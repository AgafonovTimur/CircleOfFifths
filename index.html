// По просьбе пользователя: квинта и нона строятся буквенной цепочкой
// по своему же (мажорному) кольцу — C -> G -> D (та же логика, что и у
// квинты/ноны в buildAdd9LetterArrows, но БЕЗ перехода на другое кольцо
// для терции). Терция (Eb) остаётся такой же, как в Варианте 1 —
// стрелка-стойка от тоники (числовая схема), без изменений.
function buildMAdd9LetterArrows(ring, tonicIndex){
  const arrowsCfg = SUS_CONFIGS.madd9.arrows;

  const fifthIndex = (tonicIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, tonicIndex), trainLabelAt(ring, fifthIndex),
    arrowsCfg.fifth.color, 'trainArrowHead_fifth'
  );
  const ninthIndex = (fifthIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, fifthIndex), trainLabelAt(ring, ninthIndex),
    arrowsCfg.ninth.color, 'trainArrowHead_ninth'
  );

  // терция (Eb) — как в Варианте 1: стрелка-стойка от тоники, без буквенной цепочки
  const fifthsIndex = tonicFifthsIndex(ring, tonicIndex);
  const tonicNoteName = majors[fifthsIndex];
  const angleIndex = majors.indexOf(tonicNoteName);
  if(angleIndex === -1) return;
  const startA = angleIndex*30 - 15 + WEDGE_GAP_ANGLE;
  const endA = angleIndex*30 + 15 - WEDGE_GAP_ANGLE;
  const thirdCfg = arrowsCfg.third;
  const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[thirdCfg.startPoint];
  const targetIndex = ((angleIndex + thirdCfg.degreeSteps) % 12 + 12) % 12;
  const targetAngle = targetIndex * 30;
  drawTrainArrow(fromAngle, targetAngle, thirdCfg.stubLength, thirdCfg.color, 'trainArrowHead_third');
}

// ===== Вариант 2 (буквенный) для расширенных аккордов (9/11/13 и их
// разновидности) =====
// Базовая часть (квинта/терция/[септима]) для каждого "качества" аккорда
// повторяет уже готовые буквенные схемы септаккордов/add9 — просто
// добавляются нона/ундецима/тердецима поверх них, теми же приёмами:
//   - нона   — от квинты ещё один шаг +1 по ЕЁ ЖЕ кольцу (квинта → нона);
//   - ундецима (когда не участвует в цепочке септимы) — от тоники один
//     шаг −1 по кольцу тоники, отдельная цепочка;
//   - для доминантовых 11/13 ундецима — это ПЕРВЫЙ шаг уже существующей
//     цепочки септимы (тоника → −1 [ундецима] → −2 [септима]) — просто
//     подписываем промежуточную точку;
//   - тердецима (мажорного качества, 13/maj13) — переход ОТ ТОНИКИ на
//     противоположное кольцо (та же позиция, что и тоника), отдельная
//     цепочка;
//   - тердецима минорного качества (m13/m(maj13)) помечена в исходной
//     таблице как особый маршрут "вниз 2" (по аналогии с не реализованным
//     здесь аккордом m6) — однозначной буквенной цепочки для неё нет,
//     поэтому визуально она рисуется так же, как в Варианте 1 (дуга через
//     центр на своём кольце).
//   - m(maj9)/m(maj13): септима — переход НЕ от терции/тоники, а от уже
//     полученной ноны (нона → противоположное кольцо, та же позиция).
function buildExtendedLetterArrows(chordType, ring, tonicIndex){
  const otherRing = ring === 'minor' ? 'major' : 'minor';
  const arrowsCfg = SUS_CONFIGS[chordType].arrows;
  const degrees = EXT_CHORD_DEGREES[chordType];

  const drawSame = (fromIdx, toIdx, cfgKey) => drawTrainDirectLabelArrow(
    trainLabelAt(ring, fromIdx), trainLabelAt(ring, toIdx),
    arrowsCfg[cfgKey].color, 'trainArrowHead_' + cfgKey
  );
  const drawCrossAt = (angleIdx, cfgKey) => drawTrainRadialArrowBetween(
    angleIdx * 30, arrowsCfg[cfgKey].color, 'trainArrowHead_' + cfgKey,
    ring, angleIdx, otherRing, angleIdx
  );

  const fifthIndex = (tonicIndex + 1) % 12;
  drawSame(tonicIndex, fifthIndex, 'fifth');

  let ninthIndex = null;
  if(degrees.ninth !== undefined){
    ninthIndex = (fifthIndex + 1) % 12;
    drawSame(fifthIndex, ninthIndex, 'ninth');
  }

  if(chordType === 'mmaj9' || chordType === 'mmaj13'){
    // третья: переход от тоники на противоположное кольцо (как в m7) —
    // КРОМЕ mmaj9 на мажорном кольце (напр. Cm(maj9)): крест по тому же
    // индексу дал бы относительный минор (Am), а нужна настоящая малая
    // терция (Eb) — рисуем её прямой дугой по внешнему радиусу от тоники,
    // тем же приёмом, что и у m9 на мажорном кольце.
    if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
      const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
      const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
      drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'mmaj13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
      // отдельного шага септимы (Bm->G#m) — продолжаем цепочку по своему
      // кольцу от ноны: Bm -> F#m -> C#m -> G#m (терция здесь не рисуется).
    } else {
      drawCrossAt(tonicIndex, 'third');
    }
    // септима: ЕЩЁ ОДИН шаг по своему же кольцу от ноны (+3 от ноны =
    // ровно то же расстояние, что и между тоникой и септимой по числам:
    // seventh=+5, ninth=+2, 5−2=3) — это НЕ переход на другое кольцо,
    // несмотря на то, что в таблице это описано как "вниз".
    // Исключения для mmaj9:
    //  - на мажорном кольце септима (нота B у Cm(maj9)) и нона (D) лежат
    //    на ОДНОМ И ТОМ ЖЕ индексе круга квинт на разных кольцах (D на
    //    мажорном, Bm на минорном) — поэтому вместо длинной дуги по
    //    своему кольцу рисуем короткий крест D -> Bm;
    //  - на минорном кольце нона и септима (Bm -> G#m) НЕ соседние по
    //    кругу квинт, поэтому вместо прямой стрелки нужна закруглённая
    //    дуга через центр — как у остальных стрелок минорного кольца.
    if(degrees.seventh !== undefined && ninthIndex !== null){
      if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
        drawCrossAt(ninthIndex, 'seventh');
      } else if(chordType === 'mmaj9' && ring === 'minor'){
        drawMinorV1Arrow(ninthIndex, (ninthIndex + 3) % 12, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else if(chordType === 'mmaj13' && ring === 'minor'){
        // по просьбе пользователя: убраны шаги F#m->C#m и C#m->G#m —
        // остаётся только первый шаг цепочки от ноны: Bm -> F#m.
        // Этот шаг ведёт в тердециму (F#m = тоника+3, см. degrees.thirteenth),
        // поэтому красится и подписывается как тердецима, а не как терция.
        const step1 = (ninthIndex + 1) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else {
        const seventhIndex = (ninthIndex + 3) % 12;
        drawSame(ninthIndex, seventhIndex, 'seventh');
      }
    }
    if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      // тердецима (m(maj13)): особый маршрут из таблицы ("вниз 2", по m6)
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      if(chordType === 'mmaj13' && ring === 'minor'){
        // по просьбе пользователя: вместо Am->F#m — две стрелки:
        // Am->G#m (по своему кольцу) и Am->C (крест на отн. мажор)
        const g_sharpMIndex = (ninthIndex + 3) % 12;
        drawMinorV1Arrow(tonicIndex, g_sharpMIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
        drawCrossAt(tonicIndex, 'third');
      } else if(ring === 'minor'){
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else if(chordType === 'mmaj13' && ninthIndex !== null){
        // по просьбе пользователя: вместо дуги по внешнему радиусу C -> A
        // рисуем прямую стрелку по своему кольцу от ноны: D -> A
        drawSame(ninthIndex, targetIndex, 'thirteenth');
      } else {
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.thirteenth.startPoint];
        drawTrainArrow(fromAngle, targetIndex*30, arrowsCfg.thirteenth.stubLength, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
    }
  } else if(chordType === 'add11' || chordType === 'dom9' || chordType === 'dom11' || chordType === 'dom13'){
    if(!(chordType === 'dom13' && ring === 'minor')){
      // третья: переход от квинты на противоположное кольцо (как в dom7)
      drawCrossAt(fifthIndex, 'third');
    }
    if(degrees.seventh !== undefined && degrees.eleventh === undefined){
      if(ring === 'minor'){
        // dom9 на минорном кольце (напр. тоника Am для аккорда "A9"):
        // септима — прямой шаг по своему же кольцу на +4 (Am -> C#m),
        // как в буквенной схеме для A7 на минорном кольце (см.
        // buildSeventhLetterArrows), а не цепочка через Dm
        const targetIndex = ((tonicIndex + 4) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else {
        // dom9 на мажорном кольце (напр. C9): септима — не соседняя нота
        // с тоникой (C -> Bb), поэтому рисуем одной дугой по внешнему
        // радиусу напрямую от тоники до септимы, а не цепочкой через F
        const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
        drawTrainArrow(
          tonicIndex * 30, targetIndex * 30,
          arrowsCfg.seventh.stubLength, arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    } else if(degrees.seventh !== undefined){
      const midIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, midIndex, 'eleventh');
      if(chordType === 'dom13' && ring === 'minor'){
        // по просьбе пользователя: вместо Am -> C#m (некорректно указывал
        // на терцию, а не на септиму) — цепочка от ундецимы по своему
        // кольцу: Dm -> Gm (септима)
        const targetIndex = ((midIndex - 1) % 12 + 12) % 12;
        drawMinorV1Arrow(midIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else if(ring === 'minor'){
        // dom11 на минорном кольце (напр. тоника Am для аккорда "A11"):
        // септима — прямой шаг по своему же кольцу на +4 (Am -> C#m), как
        // и у dom9 на минорном кольце, а не цепочка через Dm -> Gm
        const targetIndex = ((tonicIndex + 4) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else {
        // септима: тоника -> −1 (=ундецима) -> −2, одной цепочкой
        const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(ring, midIndex), trainLabelAt(ring, targetIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    } else if(degrees.eleventh !== undefined){
      // add11: ундецима — отдельный шаг тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      if(chordType === 'dom13' && ring === 'minor'){
        // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
        // креста терции (Em->G) — цепочка по своему кольцу от ноны:
        // Bm -> F#m (тердецима) -> C#m (терция)
        const step1 = (ninthIndex + 1) % 12;
        const step2 = (ninthIndex + 2) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
        drawMinorV1Arrow(step1, step2, arrowsCfg.third.color, 'trainArrowHead_third');
      } else {
        // тердецима (13): переход от тоники на противоположное кольцо
        drawCrossAt(tonicIndex, 'thirteenth');
      }
    }
  } else if(chordType === 'maj9' || chordType === 'maj11' || chordType === 'maj13') {
    if(ring === 'minor' && (chordType === 'maj9' || chordType === 'maj11')){
      // maj9/maj11 на минорном кольце (напр. тоника Am для аккорда "A maj9"
      // или "A maj11"): терция и септима — прямые шаги по СВОЕМУ ЖЕ
      // (минорному) кольцу (Am -> C#m, Am -> G#m), а не переход на
      // мажорное кольцо (Em -> G -> D)
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      drawMinorV1Arrow(tonicIndex, thirdIndex, arrowsCfg.third.color, 'trainArrowHead_third');
      if(degrees.seventh !== undefined){
        const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, seventhIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      }
    } else if(chordType === 'maj13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста терции (Em->G) и септимы
      // по мажорному кольцу (G->D) — цепочка по своему кольцу от ноны:
      // Bm -> F#m (тердецима) -> C#m (терция) -> G#m (септима)
      const step1 = (ninthIndex + 1) % 12;
      const step2 = (ninthIndex + 2) % 12;
      const step3 = (ninthIndex + 3) % 12;
      drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      drawMinorV1Arrow(step1, step2, arrowsCfg.third.color, 'trainArrowHead_third');
      drawMinorV1Arrow(step2, step3, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
    } else {
      // третья: переход от квинты на противоположное кольцо (как в maj7)
      drawCrossAt(fifthIndex, 'third');
      if(degrees.seventh !== undefined){
        // септима: от терции (на противоположном кольце) ещё шаг +1 по нему же
        const seventhIndex = (fifthIndex + 1) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(otherRing, fifthIndex), trainLabelAt(otherRing, seventhIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    }
    if(degrees.eleventh !== undefined){
      // ундецима: отдельная цепочка тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined && !(chordType === 'maj13' && ring === 'minor')){
      // тердецима: переход от тоники на противоположное кольцо
      drawCrossAt(tonicIndex, 'thirteenth');
    }
  } else if(chordType === 'madd11' || chordType === 'm9' || chordType === 'm11' || chordType === 'm13') {
    if(chordType === 'm9'){
      if(ring === 'minor'){
        // m9 на минорном кольце (напр. Am9): терция и септима — та же
        // буквенная цепочка, что и у m11/m13 (переход тоники на
        // относительный мажор, затем ещё шаг +1 по нему же):
        // Am -> [крест] -> C -> G
        drawCrossAt(tonicIndex, 'third');
        if(degrees.seventh !== undefined){
          const seventhIndex = (tonicIndex + 1) % 12;
          drawTrainDirectLabelArrow(
            trainLabelAt(otherRing, tonicIndex), trainLabelAt(otherRing, seventhIndex),
            arrowsCfg.seventh.color, 'trainArrowHead_seventh'
          );
        }
      } else {
        // m9 на мажорном кольце (напр. Cm9): терция и септима — не
        // соседние ноты с тоникой (C -> Eb, C -> Bb), поэтому рисуем их
        // двумя дугами по внешнему радиусу из разных точек на дуге
        // тоники (тот же приём, что и у тердецимы выше), без перехода
        // на другое кольцо
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
        const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
        drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
        if(degrees.seventh !== undefined){
          const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
          const seventhFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.seventh.startPoint];
          drawTrainArrow(seventhFromAngle, seventhIndex * 30, arrowsCfg.seventh.stubLength, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
        }
      }
    } else if(chordType === 'madd11' && ring !== 'minor'){
      // m(add11) на мажорном кольце (напр. Cm(add11)): терция — не
      // соседняя нота с тоникой (C -> Eb), поэтому рисуем прямую дугу по
      // внешнему радиусу от тоники (тот же приём, что у m9 на мажорном
      // кольце), а не крест к относительному минору (C -> Am)
      const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
      const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
      drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'm11' && ring !== 'minor'){
      // m11 на мажорном кольце (напр. Cm11): терция/септима/ундецима —
      // одна цепочка по своему же кольцу вниз по квинтам от тоники:
      // C -> F (ундецима) -> Bb (септима) -> Eb (терция)
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIdx, 'eleventh');
      drawSame(eleventhIdx, seventhIdx, 'seventh');
      drawSame(seventhIdx, thirdIdx, 'third');
    } else if(chordType === 'm13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
      // отдельного шага септимы (C->G) — нона переходит в тердециму по
      // своему кольцу (Bm -> F#m), а терция и септима приходят отдельной
      // цепочкой от ундецимы (Dm -> Gm -> Cm, см. ниже).
      if(ninthIndex !== null){
        const step1 = (ninthIndex + 1) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawMinorV1Arrow(eleventhIdx, seventhIdx, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      drawMinorV1Arrow(seventhIdx, thirdIdx, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'm13' && ring !== 'minor'){
      // по просьбе пользователя: вместо креста к отн. минору (C->Am) и
      // отдельного шага септимы (Am->Em) — продолжаем цепочку по своему
      // кольцу от ундецимы: F -> Bb -> Eb (септима и терция; сама
      // ундецима C -> F рисуется отдельно ниже, как обычно).
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawSame(eleventhIdx, seventhIdx, 'seventh');
      drawSame(seventhIdx, thirdIdx, 'third');
    } else {
      // третья: переход от тоники на противоположное кольцо (как в min7)
      drawCrossAt(tonicIndex, 'third');
      if(degrees.seventh !== undefined){
        // септима: от терции (на противоположном кольце) ещё шаг +1 по нему же
        const seventhIndex = (tonicIndex + 1) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(otherRing, tonicIndex), trainLabelAt(otherRing, seventhIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    }
    if(degrees.eleventh !== undefined && !(chordType === 'm11' && ring !== 'minor')){
      // ундецима: отдельная цепочка тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      // тердецима (m13): особый маршрут из таблицы ("вниз 2", по m6) —
      // однозначной буквенной цепочки нет, рисуем так же, как в Варианте 1
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      if(chordType === 'm13' && ring === 'minor'){
        // тердецима уже нарисована выше (Bm -> F#m), здесь ничего не рисуем
      } else if(ring === 'minor'){
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else if(chordType === 'm13' && ninthIndex !== null){
        // по просьбе пользователя: вместо дуги по внешнему радиусу C -> A
        // рисуем прямую стрелку по своему кольцу от ноны: D -> A
        drawSame(ninthIndex, targetIndex, 'thirteenth');
      } else {
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.thirteenth.startPoint];
        drawTrainArrow(fromAngle, targetIndex*30, arrowsCfg.thirteenth.stubLength, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
    }
  }
}

// единая точка входа: строит стрелки трезвучия/sus-аккорда для тоники
// любого кольца (мажор/минор), в зависимости от текущего trainChordType
// и текущего варианта (trainVariant: '1' числовой / '2' буквенный).
// Для sus/add9-аккордов variant пока не влияет — см. комментарий у
// SUS_CONFIGS. Для септаккордов 7/maj7/m7 Вариант 2 теперь строит
// буквенную цепочку стрелок (buildSeventhLetterArrows); mMaj7 в Варианте 2
// строит свою буквенную схему через buildMMaj7LetterArrows.
function buildTriadArrowsForTonic(ring, tonicIndex){
  if(SUS_CONFIGS[trainChordType]){
    // dom7 на мажорном кольце (напр. C7): по просьбе пользователя буквенная
    // и числовая схемы стрелок поменяны местами — буквенная (C -> G -> Em
    // -> F -> Bb) теперь показывается в Варианте 1, числовая — в Варианте 2.
    if(trainChordType === 'dom7' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // maj7 на мажорном кольце (напр. Cmaj7): по просьбе пользователя
    // буквенная и числовая схемы стрелок поменяны местами — буквенная
    // (C -> G -> Em -> Bm) теперь в Варианте 1, числовая — в Варианте 2.
    if(trainChordType === 'maj7' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // mMaj7: по просьбе пользователя буквенная и числовая схемы стрелок
    // поменяны местами — буквенная (см. buildMMaj7LetterArrows) теперь в
    // Варианте 1, числовая — в Варианте 2 (для обоих колец, мажорного и минорного).
    if(trainChordType === 'mmaj7'){
      if(trainVariant === '1'){
        buildMMaj7LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && SEVENTH_LETTER_CHORDS.has(trainChordType)){
      buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    // add9 на мажорном кольце (напр. Cadd9): по просьбе пользователя
    // буквенная и числовая схемы стрелок поменяны местами (вместе с
    // цветом) — буквенная (C -> G -> Em -> D) теперь в Варианте 1,
    // числовая — в Варианте 2.
    if(trainChordType === 'add9' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildAdd9LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && trainChordType === 'add9'){
      buildAdd9LetterArrows(ring, tonicIndex);
      return;
    }
    // m(add9) на мажорном кольце: добавлена буквенная схема
    // (C -> G -> D, терция/Eb как раньше) — по просьбе пользователя она
    // поставлена Вариантом 1, а прежняя числовая схема стала Вариантом 2.
    if(trainChordType === 'madd9' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildMAdd9LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // add11 на минорном кольце: буквенной схемы для этого случая нет —
    // единственная верная схема числовая (buildSusArrowsForTonic),
    // показывается под UI "Вариант 1" (кнопка "Вариант 2" заблокирована,
    // см. chordTypeUIVariant2Blocked)
    if(trainChordType === 'add11' && ring === 'minor'){
      buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      return;
    }
    // dom11 (A11) и maj11 на минорном кольце: единственная верная схема —
    // буквенная с прямыми шагами по своему кольцу (Am -> C#m, Am -> G#m/
    // C#m), показывается под UI "Вариант 1" (кнопка "Вариант 2"
    // заблокирована, см. chordTypeUIVariant2Blocked)
    if((trainChordType === 'dom11' || trainChordType === 'maj11') && ring === 'minor'){
      buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    // m11 (оба кольца): по просьбе пользователя буквенная и числовая
    // схемы стрелок поменяны местами — буквенная (buildExtendedLetterArrows,
    // F -> Bb -> Eb на мажорном кольце и т.п.) теперь показывается под UI
    // "Вариант 2", а числовая (buildSusArrowsForTonic, Dm -> Gm -> Cm /
    // Em -> Bm на минорном кольце) — под UI "Вариант 1".
    if(trainChordType === 'm11'){
      if(trainVariant === '1'){
        buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && EXT_CHORD_DEGREES[trainChordType]){
      buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
    return;
  }
  if(ring === 'minor'){
    buildTriadArrowsForMinorTonic(tonicIndex, trainVariant);
  } else {
    buildTriadArrowsForMajorTonic(majors[tonicIndex], trainVariant);
  }
}

buildTrainArrowDefs();

/* ===== Реестр цветов =====
   Каждый цвет можно называть и по имени, и по номеру (1..7) —
   см. resolveColor() ниже. Чтобы добавить новый цвет, объявите
   переменную в :root и добавьте сюда одну строку. */
const NAMED_COLORS = [
  { number: 1, name: 'green',  varName: '--green'  },
  { number: 2, name: 'red',    varName: '--red'    },
  { number: 3, name: 'yellow', varName: '--yellow' },
  { number: 4, name: 'blue',   varName: '--blue'   },
  { number: 5, name: 'cyan',   varName: '--cyan'   },
  { number: 6, name: 'orange', varName: '--orange' },
  { number: 7, name: 'purple', varName: '--purple' },
  { number: 8, name: 'lime',   varName: '--lime'   }
];
const NAMED_COLOR_ALIASES_RU = {
  'зелёный':'green', 'зеленый':'green',
  'красный':'red',
  'жёлтый':'yellow', 'желтый':'yellow',
  'синий':'blue',
  'голубой':'cyan',
  'лаймовый':'lime',
  'оранжевый':'orange',
  'фиолетовый':'purple'
};
function resolveColor(ref){
  let entry;
  if(typeof ref === 'number'){
    entry = NAMED_COLORS.find(c => c.number === ref);
  } else if(typeof ref === 'string'){
    const key = NAMED_COLOR_ALIASES_RU[ref.toLowerCase()] || ref.toLowerCase();
    entry = NAMED_COLORS.find(c => c.name === key);
  }
  if(!entry) throw new Error(`Неизвестный цвет: ${ref}`);
  return `var(${entry.varName})`;
}

/* ===== Подсветка ступеней трезвучия на круге обучения =====
   Вместо стрелок — просто красим всю ячейку нужной ступени, с
   прозрачностью 50%. degreeSteps — смещение по кругу квинт (в шагах
   по 30°) от тоники: 0 = тоника (1-я ступень), 1 = квинта (5-я ступень).
   Две версии, как и для стрелок (см. TRIAD_V1 выше):
   - TRIAD_V1_HIGHLIGHTS — числовой способ, терция прямым смещением на
     том же кольце (для минора попадёт на ячейку с суффиксом "m" —
     нужная буква всё равно верная, суффикс просто игнорируется);
   - TRIAD_V2_HIGHLIGHTS — буквенный способ, терция через родственный
     мажор/минор на той же позиции круга (корректная подпись без
     суффикса). Это прежнее (единственное) поведение подсветки. */
const TRIAD_DEGREE_HIGHLIGHT_OPACITY = 0.5;
const TRIAD_V1_HIGHLIGHTS = {
  major: {
    tonic: { ring:'major', degreeSteps: 0,  color: resolveColor(1) /* green */ },
    fifth: { ring:'major', degreeSteps: 1,  color: resolveColor(4) /* blue */ },
    third: { ring:'major', degreeSteps: 4,  color: resolveColor(3) /* yellow */ }
  },
  minor: {
    tonic: { ring:'minor', degreeSteps: 0,  color: resolveColor(1) /* green */ },
    fifth: { ring:'minor', degreeSteps: 1,  color: resolveColor(4) /* blue */ },
    third: { ring:'minor', degreeSteps: -3, color: resolveColor(3) /* yellow */ }
  }
};
const TRIAD_V2_HIGHLIGHTS = {
  major: {
    tonic: { ring:'major', degreeSteps: 0, color: resolveColor(1) /* green */ },
    fifth: { ring:'major', degreeSteps: 1, color: resolveColor(4) /* blue */ },
    third: { ring:'minor', degreeSteps: 1, color: resolveColor(3) /* yellow */ }
  },
  // минорное трезвучие: квинта — соседняя нота на том же минорном кольце,
  // терция — параллельный мажор (та же позиция круга, но мажорное кольцо)
  minor: {
    tonic: { ring:'minor', degreeSteps: 0, color: resolveColor(1) /* green */ },
    fifth: { ring:'minor', degreeSteps: 1, color: resolveColor(4) /* blue */ },
    third: { ring:'major', degreeSteps: 0, color: resolveColor(3) /* yellow */ }
  }
};
// сохранено для обратной совместимости по старым именам (Вариант 2 — как было раньше)
const TRIAD_DEGREE_HIGHLIGHTS = TRIAD_V2_HIGHLIGHTS.major;
const TRIAD_DEGREE_HIGHLIGHTS_MINOR = TRIAD_V2_HIGHLIGHTS.minor;

/* =========================================================
   ПРАКТИКА Уровень 2: показывается аккорд, нужно найти и нажать
   на круге его ноты (тоника, терция, квинта) — на любом из колец
   (мажорном или минорном), где встречается нужная буква.

   Ноты аккорда берутся из TRIAD_V1_HIGHLIGHTS — того же самого
   источника данных о построении трезвучий, что используется в
   режиме "Обучение". Если там когда-нибудь найдётся и починится
   ошибка в построении аккорда, эта починка автоматически применится
   и здесь, т.к. используется одна и та же функция/данные.
   ========================================================= */
function getTriadNoteLetters(ring, tonicIndex){
  const cfgSet = TRIAD_V1_HIGHLIGHTS[ring];
  const letters = new Set();
  Object.values(cfgSet).forEach(cfg=>{
    const idx = ((tonicIndex + cfg.degreeSteps) % 12 + 12) % 12;
    const names = cfg.ring === 'minor' ? minors : majors;
    letters.add(rootOf(names[idx]));
  });
  return letters;
}

let currentL3 = null;

/* ===== Практика 3: тип аккорда (Мажор/Минор трезвучие, 7, maj7, m7, mMaj7) =====
   По умолчанию — обычные трезвучия ('triad'). Остальные типы используют
   те же числовые смещения (Вариант 1), что и в режиме "Обучение"
   (см. SUS_CONFIGS выше), просто применённые к практике поиска нот. */
let level3ChordType = 'triad';

function getStepsForChordTypeL3(type, ring){
  if(type === 'triad'){
    const cfg = TRIAD_V1[ring];
    return [0, cfg.fifth.degreeSteps, cfg.third.degreeSteps];
  }
  const susCfg = SUS_CONFIGS[type];
  if(susCfg && susCfg.arrows){
    const steps = [0];
    Object.values(susCfg.arrows).forEach(d=>steps.push(d.degreeSteps));
    return steps;
  }
  const extCfg = EXT_CHORD_DEGREES[type];
  if(extCfg){
    const steps = [0];
    Object.values(extCfg).forEach(v=>steps.push(v));
    return steps;
  }
  return [0];
}

function getChordNoteLettersL3(ring, tonicIndex, type){
  const names = ring === 'minor' ? minors : majors;
  const steps = getStepsForChordTypeL3(type, ring);
  const letters = new Set();
  steps.forEach(s=>{
    const idx = ((tonicIndex + s) % 12 + 12) % 12;
    letters.add(rootOf(names[idx]));
  });
  return letters;
}

function chordTypeSuffixL3(type, ring){
  switch(type){
    case 'sus2': return 'sus2';
    case 'sus4': return 'sus4';
    case 'dom7': return '7';
    case 'maj7': return 'maj7';
    case 'min7': return ring === 'minor' ? '7' : 'm7';
    case 'mmaj7': return ring === 'minor' ? 'Maj7' : 'mMaj7';
    case 'add9': return 'add9';
    case 'madd9': return ring === 'minor' ? 'add9' : 'm(add9)';
    case 'dom9': return '9';
    case 'maj9': return 'maj9';
    case 'm9': return ring === 'minor' ? '9' : 'm9';
    case 'mmaj9': return ring === 'minor' ? 'Maj9' : 'mMaj9';
    case 'add11': return 'add11';
    case 'madd11': return ring === 'minor' ? 'add11' : 'm(add11)';
    case 'dom11': return '11';
    case 'maj11': return 'maj11';
    case 'm11': return ring === 'minor' ? '11' : 'm11';
    case 'dom13': return '13';
    case 'maj13': return 'maj13';
    case 'm13': return ring === 'minor' ? '13' : 'm13';
    case 'mmaj13': return ring === 'minor' ? 'Maj13' : 'mMaj13';
    default: return '';
  }
}

function pickNewChordL3(){
  let pool = activeChordsL3();
  if(pool.length === 0) return;
  if(currentL3 && pool.length > 1){
    pool = pool.filter(c => !(c.ring === currentL3.ring && c.index === currentL3.index));
  }
  const weight = 1 / pool.length;
  let r = Math.random();
  let idx = Math.floor(r / weight);
  if(idx >= pool.length) idx = pool.length - 1;
  const chosen = pool[idx];
  currentL3 = {
    ring: chosen.ring,
    index: chosen.index,
    name: chosen.name + chordTypeSuffixL3(level3ChordType, chosen.ring),
    letters: getChordNoteLettersL3(chosen.ring, chosen.index, level3ChordType),
    found: new Set()
  };
  if(practiceLevel === 3) centerText.textContent = currentL3.name;
}

/* Кнопки выбора типа аккорда для Практики 3 (Мажор/Минор, 7, maj7, m7, mMaj7) */
document.querySelectorAll('#level2TypeButtons .ringBtn[data-chordtype]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const type = btn.getAttribute('data-chordtype');
    if(type === level3ChordType) return;
    level3ChordType = type;
    document.querySelectorAll('#level2TypeButtons .ringBtn[data-chordtype]').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-chordtype') === level3ChordType);
    });
    currentL3 = null;
    if(practiceLevel === 3) pickNewChordL3();
  });
});

function onWedgeClickLevel3(e){
  if(!currentL3) return;
  const ring = e.currentTarget.getAttribute('data-ring');
  const index = parseInt(e.currentTarget.getAttribute('data-index'));
  const letter = rootOf((ring === 'major' ? majors : minors)[index]);

  if(currentL3.letters.has(letter)){
    flashWedge(ring, index, FLASH_GREEN, 300);
    if(!currentL3.found.has(letter)){
      currentL3.found.add(letter);
      if(currentL3.found.size === currentL3.letters.size){
        setTimeout(pickNewChordL3, 450);
      }
    }
  } else {
    flashWedge(ring, index, FLASH_RED, 300);
  }
}

let highlightedTrainWedges = [];

// мгновенно (без CSS-transition) применяет fill/fill-opacity к ячейке.
// Раньше transition возвращался обратно синхронно в том же тике — из-за
// этого браузер иногда успевал "доиграть" переход от старого цвета уже
// ПОСЛЕ восстановления transition, получалась вспышка. Теперь transition
// возвращается только на следующем кадре (двойной rAF), когда мгновенное
// изменение уже гарантированно отрисовано.
function setWedgeInstant(item, fill, opacity){
  item.el.style.transition = 'none';
  item.el.setAttribute('fill', fill);
  if(opacity === null){
    item.el.removeAttribute('fill-opacity');
  } else {
    item.el.setAttribute('fill-opacity', String(opacity));
  }
  void item.el.offsetWidth; // форсируем reflow, чтобы изменение применилось без transition
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      item.el.style.transition = '';
    });
  });
}

function clearTriadHighlights(){
  highlightedTrainWedges.forEach(item => {
    setWedgeInstant(item, item.baseColor, null);
  });
  highlightedTrainWedges = [];
}

// красит ячейки квинты и терции для заданной тоники (мажор или минор), 50% прозрачности.
// Учитывает текущий trainVariant ('1' числовой / '2' буквенный) — см. TRIAD_V1_HIGHLIGHTS/TRIAD_V2_HIGHLIGHTS.
function highlightTriadForTonic(ring, tonicIndex){
  if(SUS_CONFIGS[trainChordType]){
    highlightSusForTonic(trainChordType, ring, tonicIndex);
    return;
  }
  const variantSet = trainVariant === '2' ? TRIAD_V1_HIGHLIGHTS : TRIAD_V2_HIGHLIGHTS;
  const cfgSet = ring === 'minor' ? variantSet.minor : variantSet.major;
  Object.entries(cfgSet).forEach(([key, cfg])=>{
    // тоника уже подсвечена сплошным зелёным (fill-opacity:1) в
    // selectTrainTonic — не трогаем её здесь, иначе полупрозрачная
    // заливка (0.5) перекроет сплошную, и позже clearTriadHighlights()
    // сотрёт зелёный тоники при переключении Стрелками -> Цветом ->
    // Стрелками (баги "другой зелёный" и "тоника не зелёная").
    if(key === 'tonic') return;
    const targetIndex = ((tonicIndex + cfg.degreeSteps) % 12 + 12) % 12;
    const item = trainWedgeMap[(cfg.ring||'major')+'-'+targetIndex];
    if(item){
      setWedgeInstant(item, cfg.color, TRIAD_DEGREE_HIGHLIGHT_OPACITY);
      highlightedTrainWedges.push(item);
    }
  });
}

// красит ячейки sus-аккорда (тоника + 2-3 ноты) для тоники, выбранной на
// любом кольце. Мажорная тоника — ячейки берутся с мажорного кольца
// подписей, как раньше (sus-аккорды не имеют наклонения, см.
// tonicFifthsIndex). Минорная тоника — ячейки красятся на самом минорном
// кольце (по его собственному индексу, см. buildSusArrowsForTonic).
function highlightSusForTonic(chordType, ring, tonicIndex){
  // add11 на минорном кольце: буквенной схемы нет — см. пояснение в
  // buildTriadArrowsForTonic
  if(chordType === 'add11' && ring === 'minor'){
    // провалиться в обычную числовую раскладку ниже (susCfg.highlights)
  } else if(trainVariant === '2' && EXT_CHORD_DEGREES[chordType]){
    highlightExtendedLetterCells(chordType, ring, tonicIndex);
    return;
  }
  const susCfg = SUS_CONFIGS[chordType];
  // Вариант 2 (буквенный) для некоторых аккордов (maj7, add9, dom7) имеет
  // свою отдельную раскладку ячеек — см. SUS_CONFIGS.*.highlights2 — для
  // тоники на мажорном кольце, и SUS_CONFIGS.*.highlights2Minor — для
  // тоники на минорном кольце (напр. dom7: A7 = тоника Am). Для аккордов,
  // у которых Вариант 2 на минорном кольце по-прежнему заблокирован
  // (см. CHORD_TYPES_VARIANT2_MAJOR_ONLY), highlights2Minor просто не
  // задан, и используется обычная числовая раскладка (highlights).
  const highlights2Cfg = ring === 'minor' ? susCfg.highlights2Minor : susCfg.highlights2;
  // dom7 на мажорном кольце: раскладка ячеек тоже поменяна местами вместе
  // со стрелками (см. buildTriadArrowsForTonic) — буквенная в Варианте 1,
  // числовая в Варианте 2.
  let highlightsCfg;
  if((chordType === 'dom7' || chordType === 'maj7' || chordType === 'add9' || chordType === 'madd9') && ring !== 'minor'){
    highlightsCfg = trainVariant === '1' ? highlights2Cfg : susCfg.highlights;
  } else if(chordType === 'mmaj7'){
    // mMaj7: буквенная и числовая раскладки ячеек поменяны местами вместе
    // со стрелками (см. buildTriadArrowsForTonic) — буквенная в Варианте 1,
    // числовая в Варианте 2, для обоих колец.
    highlightsCfg = trainVariant === '1' ? highlights2Cfg : susCfg.highlights;
  } else {
    const useHighlights2 = trainVariant === '2' && highlights2Cfg;
    highlightsCfg = useHighlights2 ? highlights2Cfg : susCfg.highlights;
  }
  if(!highlightsCfg) return; // нет Варианта 2 для этого аккорда (напр. madd9)

  const angleIndex = ring === 'minor' ? tonicIndex : tonicFifthsIndex(ring, tonicIndex);
  const defaultRing = ring === 'minor' ? 'minor' : 'major';

  Object.entries(highlightsCfg).forEach(([key, cfg])=>{
    // см. highlightTriadForTonic — тоника не трогается здесь.
    if(key === 'tonic') return;
    const targetIndex = ((angleIndex + cfg.degreeSteps) % 12 + 12) % 12;
    const useRing = cfg.ring || defaultRing;
    const item = trainWedgeMap[useRing+'-'+targetIndex];
    if(item){
      setWedgeInstant(item, cfg.color, TRIAD_DEGREE_HIGHLIGHT_OPACITY);
      highlightedTrainWedges.push(item);
    }
  });
}

// красит ячейки Варианта 2 (буквенного) для расширенных аккордов
// (9/11/13 и разновидности) — те же целевые позиции, что рисует
// buildExtendedLetterArrows, просто без стрелок.
function highlightExtendedLetterCells(chordType, ring, tonicIndex){
  const otherRing = ring === 'minor' ? 'major' : 'minor';
  const arrowsCfg = SUS_CONFIGS[chordType].arrows;
  const degrees = EXT_CHORD_DEGREES[chordType];

  const paint = (useRing, idx, cfgKey) => {
    const item = trainWedgeMap[useRing + '-' + idx];
    if(item){
      setWedgeInstant(item, arrowsCfg[cfgKey].color, TRIAD_DEGREE_HIGHLIGHT_OPACITY);
      highlightedTrainWedges.push(item);
    }
  };

  const fifthIndex = (tonicIndex + 1) % 12;
  paint(ring, fifthIndex, 'fifth');

  let ninthIndex = null;
  if(degrees.ninth !== undefined){
    ninthIndex = (fifthIndex + 1) % 12;
    paint(ring, ninthIndex, 'ninth');
  }

  if(chordType === 'mmaj9' || chordType === 'mmaj13'){
    if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      paint(ring, thirdIndex, 'third');
    } else if(chordType === 'mmaj13' && ring === 'minor'){
      // по просьбе пользователя: терция (b3) теперь красится через крест
      // на отн. мажор (Am->C), как и сама стрелка
      paint(otherRing, tonicIndex, 'third');
    } else {
      paint(otherRing, tonicIndex, 'third');
    }
    if(degrees.seventh !== undefined && ninthIndex !== null){
      if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
        paint(otherRing, ninthIndex, 'seventh');
      } else if(chordType === 'mmaj13' && ring === 'minor'){
        // по просьбе пользователя: убран промежуточный шаг C#m (не входит
        // в аккорд) — красятся только F#m (13-я, ниже) и G#m (септима)
        const step1 = (ninthIndex + 1) % 12;
        const step3 = (ninthIndex + 3) % 12;
        paint(ring, step1, 'thirteenth');
        paint(ring, step3, 'seventh');
      } else {
        const seventhIndex = (ninthIndex + 3) % 12;
        paint(ring, seventhIndex, 'seventh');
      }
    }
    if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      paint(ring, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      paint(ring, targetIndex, 'thirteenth');
    }
  } else if(chordType === 'add11' || chordType === 'dom9' || chordType === 'dom11' || chordType === 'dom13'){
    if(!(chordType === 'dom13' && ring === 'minor')){
      paint(otherRing, fifthIndex, 'third');
    }
    if(degrees.seventh !== undefined){
      const midIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
      if(degrees.eleventh !== undefined) paint(ring, midIndex, 'eleventh');
      paint(ring, targetIndex, 'seventh');
    } else if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      paint(ring, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      if(chordType === 'dom13' && ring === 'minor'){
        // цепочка по своему кольцу от ноны: Bm -> F#m -> C#m
        if(ninthIndex !== null){
          const step1 = (ninthIndex + 1) % 12;
          const step2 = (ninthIndex + 2) % 12;
          paint(ring, step1, 'thirteenth');
          paint(ring, step2, 'third');
        }
      } else {
        paint(otherRing, tonicIndex, 'thirteenth');
      }
    }
  } else if(chordType === 'maj9' || chordType === 'maj11' || chordType === 'maj13'){
    if(ring === 'minor' && chordType === 'maj9'){
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      paint(ring, thirdIndex, 'third');
      if(degrees.seventh !== undefined){
        const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
        paint(ring, seventhIndex, 'seventh');
      }
    } else if(chordType === 'maj13' && ring === 'minor'){
      // цепочка по своему кольцу от ноны: Bm -> F#m -> C#m -> G#m
      if(ninthIndex !== null){
        const step1 = (ninthIndex + 1) % 12;
        const step2 = (ninthIndex + 2) % 12;
        const step3 = (ninthIndex + 3) % 12;
        paint(ring, step1, 'thirteenth');
        paint(ring, step2, 'third');
        paint(ring, step3, 'seventh');
      }
    } else {
      paint(otherRing, fifthIndex, 'third');
      if(degrees.seventh !== undefined){
        const seventhIndex = (fifthIndex + 1) % 12;
        paint(otherRing, seventhIndex, 'seventh');
      }
    }
    if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      paint(ring, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined && !(chordType === 'maj13' && ring === 'minor')){
      paint(otherRing, tonicIndex, 'thirteenth');
    }
  } else if(chordType === 'madd11' || chordType === 'm9' || chordType === 'm11' || chordType === 'm13'){
    if(chordType === 'm9'){
      if(ring === 'minor'){
        paint(otherRing, tonicIndex, 'third');
        if(degrees.seventh !== undefined){
          const seventhIndex = (tonicIndex + 1) % 12;
          paint(otherRing, seventhIndex, 'seventh');
        }
      } else {
        const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
        paint(ring, thirdIndex, 'third');
        if(degrees.seventh !== undefined){
          const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
          paint(ring, seventhIndex, 'seventh');
        }
      }
    } else if(chordType === 'madd11' && ring !== 'minor'){
      // m(add11) на мажорном кольце: терция красится напрямую (C -> Eb),
      // а не крестом к относительному минору — см. пояснение в
      // buildExtendedLetterArrows
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      paint(ring, thirdIndex, 'third');
    } else if(chordType === 'm13' && ring === 'minor'){
      // терция и септима — цепочка по своему кольцу от ундецимы:
      // Dm -> Gm -> Cm (та же цепочка, что и в стрелках, см.
      // buildExtendedLetterArrows); нона окрашивается отдельно выше,
      // тердецима — отдельным блоком ниже
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      paint(ring, seventhIdx, 'seventh');
      paint(ring, thirdIdx, 'third');
    } else {
      paint(otherRing, tonicIndex, 'third');
      if(degrees.seventh !== undefined){
        const seventhIndex = (tonicIndex + 1) % 12;
        paint(otherRing, seventhIndex, 'seventh');
      }
    }
    if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      paint(ring, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      // особый маршрут ("вниз 2") — красим ту же ячейку, что и Вариант 1
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      paint(ring, targetIndex, 'thirteenth');
    }
  }
}

// сохранено для обратной совместимости по имени тоники
function highlightTriadForMajorTonic(tonicNoteName){
  const tonicIndex = majors.indexOf(tonicNoteName);
  if(tonicIndex === -1) return;
  highlightTriadForTonic('major', tonicIndex);
}

/* ===== Выбор тоники кликом по ноте =====
   Все ноты по умолчанию в "отжатом" состоянии (обычный цвет кольца).
   Клик по ноте мажорного кольца делает её "нажатой" (сплошная
   подсветка --key-pressed) и подсвечивает её квинту/терцию с 50%
   прозрачностью. Повторный клик по той же ноте снимает выбор. */
let pressedTrainTonicWedge = null;
let pressedTrainTonicName = null;
let pressedTrainTonicRing = null;
let pressedTrainTonicIndex = null;

/* ===== Режим отображения подсказки трезвучия =====
   'arrows' — стрелки, 'cells' — подсветка ячеек (цветом). Независимая
   от этого ось — trainVariant ('1' числовой / '2' буквенный, см. ниже).
   Вместе они дают 4 комбинации: 1+стрелки, 1+цвет, 2+стрелки, 2+цвет —
   см. кнопки "Вариант 1"/"Вариант 2" → "Стрелками"/"Цветом". */
const TRAIN_DISPLAY_MODE_KEY = 'trainDisplayMode';
let trainDisplayMode = localStorage.getItem(TRAIN_DISPLAY_MODE_KEY) === 'cells' ? 'cells' : 'arrows';
function saveTrainDisplayMode(){
  localStorage.setItem(TRAIN_DISPLAY_MODE_KEY, trainDisplayMode);
}

/* ===== Вариант поиска ноты: '1' числовой (прямое смещение по кругу
   квинт на том же кольце) / '2' буквенный (через соседей и переход на
   родственный мажор/минор). См. TRIAD_V1 / TRIAD_V1_HIGHLIGHTS /
   TRIAD_V2_HIGHLIGHTS выше. Не для всех типов аккордов есть Вариант 2 —
   см. chordTypeHasVariant2(). */
const TRAIN_VARIANT_KEY = 'trainVariant';
let trainVariant = localStorage.getItem(TRAIN_VARIANT_KEY) === '2' ? '2' : '1';
function saveTrainVariant(){
  localStorage.setItem(TRAIN_VARIANT_KEY, trainVariant);
}

/* ===== Тип аккорда для подсказки: 'triad' (обычное трезвучие, по умолчанию),
   'sus2' или 'sus4'. Работает поверх trainDisplayMode — тот же Вариант 1
   (стрелки) / Вариант 2 (ячейки) применяется и к sus-аккордам. ===== */
const TRAIN_CHORD_TYPE_KEY = 'trainChordType';
let trainChordType = localStorage.getItem(TRAIN_CHORD_TYPE_KEY);
const VALID_TRAIN_CHORD_TYPES = new Set([
  'sus2','sus4','dom7','maj7','min7','mmaj7','add9','madd9',
  'dom9','maj9','m9','mmaj9','add11','madd11','dom11','maj11','m11','dom13','maj13','m13','mmaj13'
]);
if(!VALID_TRAIN_CHORD_TYPES.has(trainChordType)) trainChordType = 'triad';
function saveTrainChordType(){
  localStorage.setItem(TRAIN_CHORD_TYPE_KEY, trainChordType);
}

function clearTrainTonicPress(){
  if(pressedTrainTonicWedge){
    pressedTrainTonicWedge.el.setAttribute('fill', pressedTrainTonicWedge.baseColor);
    pressedTrainTonicWedge.el.removeAttribute('fill-opacity');
    pressedTrainTonicWedge = null;
  }
  pressedTrainTonicName = null;
  pressedTrainTonicRing = null;
  pressedTrainTonicIndex = null;
  clearTriadHighlights();
  clearTrainArrows();
  updateTrainDegreeLabels(null, null);
}

// ring: 'major' | 'minor', tonicIndex: 0..11
function selectTrainTonic(ring, tonicIndex){
  const item = trainWedgeMap[ring+'-'+tonicIndex];
  if(!item) return;
  if(pressedTrainTonicRing === ring && pressedTrainTonicIndex === tonicIndex){
    // повторный клик по уже нажатой ноте — снимаем выбор
    clearTrainTonicPress();
    applyTrainChordType();
    return;
  }
  clearTrainTonicPress();
  item.el.setAttribute('fill', 'var(--green)');
  item.el.setAttribute('fill-opacity', '1');
  pressedTrainTonicWedge = item;
  pressedTrainTonicName = item.name;
  pressedTrainTonicRing = ring;
  pressedTrainTonicIndex = tonicIndex;
  updateTrainDegreeLabels(ring, tonicIndex);
  // Вариант 2 доступен не для всех аккордов на минорном кольце — при
  // смене тоники (и, возможно, кольца) нужно обновить блокировку кнопок
  // "Вариант 2" и при необходимости принудительно переключиться на Вариант 1
  applyTrainChordType();
  if(trainDisplayMode === 'arrows'){
    buildTriadArrowsForTonic(ring, tonicIndex);
  } else {
    highlightTriadForTonic(ring, tonicIndex);
  }
}

// изначально все ноты в отжатом состоянии — ничего не подсвечено

let currentTrain = null;

function trainActiveChords(){
  const list = [];
  majors.forEach((n,i)=>{ if(trainSelectedNotes[rootOf(n)]) list.push({name:n, ring:'major', index:i}); });
  minors.forEach((n,i)=>{ if(trainSelectedNotes[rootOf(n)]) list.push({name:n, ring:'minor', index:i}); });
  return list;
}

// количество включённых нот (по буквам, мажор+минор считаются как одна
// и та же нота) — влияет на то, сколько последних нот исключается из
// следующего выбора (см. pickNewTrainChord ниже).
function trainSelectedNotesCount(){
  return Object.values(trainSelectedNotes).filter(Boolean).length;
}

// история последних выпавших нот (по буквам, без разделения на
// мажор/минор), самая новая — в конце; хранится не больше 3 последних.
let trainRootHistory = [];

function pickNewTrainChord(){
  let pool = trainActiveChords();
  if(pool.length === 0){
    trainCenterText.textContent = '';
    currentTrain = null;
    return;
  }

  // сколько последних нот исключать из следующего пула:
  // >=4 включённых нот — не повторять текущую;
  // >=8 включённых нот — не повторять текущую и предыдущую;
  // >=12 включённых нот — не повторять текущую и 2 предыдущие.
  const selCount = trainSelectedNotesCount();
  let excludeCount = 0;
  if(selCount >= 12) excludeCount = 3;
  else if(selCount >= 8) excludeCount = 2;
  else if(selCount >= 4) excludeCount = 1;

  if(excludeCount > 0 && trainRootHistory.length > 0){
    const excludeRoots = new Set(trainRootHistory.slice(-excludeCount));
    const filtered = pool.filter(c => !excludeRoots.has(rootOf(c.name)));
    if(filtered.length > 0) pool = filtered;
  } else if(currentTrain && pool.length > 1){
    pool = pool.filter(c => !(c.ring === currentTrain.ring && c.index === currentTrain.index));
  }

  const idx = Math.floor(Math.random() * pool.length);
  currentTrain = pool[idx];
  // в режиме "Обучение" аккорд в центре круга не нужен (сам аккорд
  // показывать не надо — только подсказки-стрелки); currentTrain всё
  // равно хранит выбранный аккорд для остальной логики режима.

  trainRootHistory.push(rootOf(currentTrain.name));
  if(trainRootHistory.length > 3) trainRootHistory.shift();
}

function onTrainWedgeClick(e){
  const path = e.currentTarget;
  const ring = path.getAttribute('data-ring');
  const index = Number(path.getAttribute('data-index'));
  if(ring !== 'major' && ring !== 'minor') return; // подсветка трезвучия — от тоники мажора или минора
  selectTrainTonic(ring, index);
}

pickNewTrainChord();

/* --- настройки обучения: тоники ---
   Блок выбора отдельных нот убран из интерфейса; все ноты
   всегда участвуют в тренировке (trainSelectedNotes хранит все true). */

/* --- переключение варианта поиска (Вариант 1 / Вариант 2) и способа
   показа подсказки (Стрелками / Цветом) — 4 кнопки, независимые оси,
   активна всегда ровно одна комбинация. --- */
const trainV1ArrowsBtn = document.getElementById('trainV1ArrowsBtn');
const trainV1ColorBtn  = document.getElementById('trainV1ColorBtn');
const trainV2ArrowsBtn = document.getElementById('trainV2ArrowsBtn');
const trainV2ColorBtn  = document.getElementById('trainV2ColorBtn');

// Обычный порядок кнопок "Вариант 1"/"Вариант 2" — для трезвучий, sus2,
// sus4, 7/maj7/m7 (мажорное кольцо), mMaj7, add9 (см. выше). А для
// расширенных аккордов (9/11/13-е семейство) кнопки "Вариант 1" и
// "Вариант 2" по-прежнему нужно менять местами (вместе с содержимым и
// цветом).
const TRAIN_V1V2_SWAPPED_TYPES = new Set([
  'dom9', 'maj9', 'm9', 'mmaj9',
  'add11', 'madd11', 'dom11', 'maj11', 'm11',
  'dom13', 'maj13', 'm13', 'mmaj13'
]);
function trainVariantUISwapped(){
  return TRAIN_V1V2_SWAPPED_TYPES.has(trainChordType);
}

function applyTrainDisplayMode(){
  const swapped = trainVariantUISwapped();
  const v1Internal = swapped ? '2' : '1';
  const v2Internal = swapped ? '1' : '2';
  trainV1ArrowsBtn.classList.toggle('active', trainVariant === v1Internal && trainDisplayMode === 'arrows');
  trainV1ColorBtn.classList.toggle('active',  trainVariant === v1Internal && trainDisplayMode === 'cells');
  trainV2ArrowsBtn.classList.toggle('active', trainVariant === v2Internal && trainDisplayMode === 'arrows');
  trainV2ColorBtn.classList.toggle('active',  trainVariant === v2Internal && trainDisplayMode === 'cells');
}
applyTrainDisplayMode();

// переключиться на заданную комбинацию (UI-кнопка + style) и перерисовать подсказку
// uiLabel: 'v1' | 'v2' — какая именно UI-кнопка была нажата
function setTrainVariantStyle(uiLabel, style){
  const swapped = trainVariantUISwapped();
  const variant = uiLabel === 'v1' ? (swapped ? '2' : '1') : (swapped ? '1' : '2');
  if(variant === '2' && !chordTypeHasVariant2(trainChordType, pressedTrainTonicRing || 'major')) return; // Вариант 2 недоступен для этого аккорда/кольца
  if(variant === '1' && chordTypeUIVariant2Blocked(trainChordType, pressedTrainTonicRing || 'major')) return;
  if(trainVariant === variant && trainDisplayMode === style) return;
  trainVariant = variant;
  trainDisplayMode = style;
  applyTrainDisplayMode();
  saveTrainVariant();
  saveTrainDisplayMode();
  if(pressedTrainTonicRing !== null){
    clearTriadHighlights();
    clearTrainArrows();
    if(trainDisplayMode === 'arrows'){
      buildTriadArrowsForTonic(pressedTrainTonicRing, pressedTrainTonicIndex);
    } else {
      highlightTriadForTonic(pressedTrainTonicRing, pressedTrainTonicIndex);
    }
  }
}

trainV1ArrowsBtn.addEventListener('click', ()=> setTrainVariantStyle('v1', 'arrows'));
trainV1ColorBtn.addEventListener('click',  ()=> setTrainVariantStyle('v1', 'cells'));
trainV2ArrowsBtn.addEventListener('click', ()=> setTrainVariantStyle('v2', 'arrows'));
trainV2ColorBtn.addEventListener('click',  ()=> setTrainVariantStyle('v2', 'cells'));


/* --- переключение типа аккорда: обычные трезвучия / sus2 / sus4 ---
   Кнопки Sus2/Sus4 работают как переключатели (toggle): повторный клик
   по уже активной кнопке возвращает обычные трезвучия ('triad'). */

/* =========================================================
   Высота вкладки "Обучение" = высота самой высокой вкладки
   "Практика" (обычно это Практика 3 с сеткой аккордов + кругом).
   Чтобы вкладка "Обучение" не была короче остальных, измеряем
   реальную высоту каждой панели уровня Практики (временно показывая
   её вне потока, без мигания) и выставляем эту высоту как
   min-height для #trainingPanel. Настройки внутри при этом остаются
   прижатыми к верху (flex-start по умолчанию), а свободное место —
   снизу, как и требовалось. ========================================================= */
function measurePanelHeight(el){
  const prevDisplay = el.style.display;
  const prevVisibility = el.style.visibility;
  const prevPosition = el.style.position;
  el.style.visibility = 'hidden';
  el.style.position = 'absolute';
  el.style.display = 'flex';
  const h = el.offsetHeight;
  el.style.display = prevDisplay;
  el.style.visibility = prevVisibility;
  el.style.position = prevPosition;
  return h;
}

function syncTrainingPanelHeight(){
  // level1Panel/level2Panel/level3Panel живут внутри #practicePanel. Когда
  // активна вкладка "Обучение", #practicePanel сам скрыт (display:none),
  // и тогда офсеты его детей всегда равны 0, даже если им выставить
  // display:flex — потому что предок не рендерится вообще. Поэтому на
  // время замера временно "открываем" сам #practicePanel (невидимо, вне
  // потока), а затем возвращаем как было.
  const prevPanelDisplay = practicePanel.style.display;
  const prevPanelVisibility = practicePanel.style.visibility;
  const prevPanelPosition = practicePanel.style.position;
  practicePanel.style.display = 'flex';
  practicePanel.style.visibility = 'hidden';
  practicePanel.style.position = 'absolute';

  const h1 = measurePanelHeight(level1Panel);
  const h2 = measurePanelHeight(level2Panel);
  const h3 = measurePanelHeight(level3Panel);

  practicePanel.style.display = prevPanelDisplay;
  practicePanel.style.visibility = prevPanelVisibility;
  practicePanel.style.position = prevPanelPosition;

  const maxH = Math.max(h1, h2, h3);
  trainingPanel.style.minHeight = maxH + 'px';
}

/* =========================================================
   Масштабирование круга: клавиши +/-, Shift+"-" сброс до 100%
   ========================================================= */
const ZOOM_MIN = 100;
const ZOOM_MAX = 1000;
const ZOOM_STEP = 10;
const ZOOM_PRACTICE_STORAGE_KEY = 'circleOfFifthsZoomPractice';
const ZOOM_TRAINING_STORAGE_KEY = 'circleOfFifthsZoomTraining';

let zoomPractice = parseInt(localStorage.getItem(ZOOM_PRACTICE_STORAGE_KEY), 10);
if(isNaN(zoomPractice)) zoomPractice = 100;
let zoomTraining = parseInt(localStorage.getItem(ZOOM_TRAINING_STORAGE_KEY), 10);
if(isNaN(zoomTraining)) zoomTraining = 100;

function applyZoom(){
  zoomPractice = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomPractice));
  zoomTraining = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoomTraining));

  svg.style.transform = `scale(${zoomPractice/100})`;
  svg.style.transformOrigin = 'center center';

  trainSvg.style.transform = `scale(${zoomTraining/100})`;
  trainSvg.style.transformOrigin = 'center center';

  localStorage.setItem(ZOOM_PRACTICE_STORAGE_KEY, zoomPractice);
  localStorage.setItem(ZOOM_TRAINING_STORAGE_KEY, zoomTraining);

  requestAnimationFrame(()=>{
    const activeWrap = appMode === 'training' ? trainCircleWrap : circleWrap;
    const rect = activeWrap.getBoundingClientRect();
    const targetTop = window.scrollY + rect.top - Math.max(0, (window.innerHeight - rect.height) / 2);
    const targetLeft = window.scrollX + rect.left - Math.max(0, (window.innerWidth - rect.width) / 2);
    window.scrollTo(targetLeft, targetTop);
  });
}

function zoomIn(){
  if(appMode === 'training'){ zoomTraining += ZOOM_STEP; } else { zoomPractice += ZOOM_STEP; }
  applyZoom();
}
function zoomOut(){
  if(appMode === 'training'){ zoomTraining -= ZOOM_STEP; } else { zoomPractice -= ZOOM_STEP; }
  applyZoom();
}
function zoomReset(){
  if(appMode === 'training'){ zoomTraining = 100; } else { zoomPractice = 100; }
  applyZoom();
}

/* =========================================================
   Горячие клавиши для выбора нот на круге (мажор/минор),
   работают и в практике, и в обучении.

   Буквы A-G — трёхэтапный цикл по одной и той же букве (натуральная
   нота):
     1-е нажатие  -> нота на МАЖОРНОМ кольце  (напр. C  -> C)
     2-е нажатие  -> та же буква на МИНОРНОМ кольце (напр. C -> Cm)
     3-е нажатие  -> снятие выбора (повторный клик по уже выбранной
                     ноте — стандартный toggle-off, см. selectTrainTonic)
   Нажатие ЛЮБОЙ ДРУГОЙ буквы сбрасывает цикл и начинает его заново
   (с мажорного кольца) для новой буквы.

   Раскладка клавиатуры не важна — сравнение идёт по физической
   клавише (e.code), поэтому работает и на русской раскладке. */
const HOTKEY_LETTER = {
  KeyA:'A', KeyB:'B', KeyC:'C', KeyD:'D', KeyE:'E', KeyF:'F', KeyG:'G'
};

/* Shift+буква -> диез (A#, C#, D#, F#, G#), задаются pitch class'ом (0..11,
   индекс в noteNames), т.к. буквенного названия недостаточно.
   E# и B# энгармонически равны F и C (pitch class 5 и 0) — на круге
   отдельных ячеек для них нет, поэтому Shift+E/Shift+B выбирают
   соответствующую ячейку F/C. */
const HOTKEY_SHARP_PC = {
  KeyA: 10, // A#
  KeyC: 1,  // C#
  KeyD: 3,  // D#
  KeyF: 6,  // F#
  KeyG: 8,  // G#
  KeyE: 5,  // E# (= F)
  KeyB: 0   // B# (= C)
};

/* "Режим бемоля": нажатие клавиши Space переводит систему в ожидание
   следующей буквы-ноты; эта следующая нота трактуется как бемольная
   (задаётся pitch class'ом, как и с диезами через Shift), после чего
   режим сбрасывается обратно на натуральные ноты. */
const HOTKEY_FLAT_PC = {
  KeyA: 8,  // Ab
  KeyB: 10, // Bb
  KeyC: 11, // Cb (= B)
  KeyD: 1,  // Db
  KeyE: 3,  // Eb
  KeyF: 4,  // Fb (= E)
  KeyG: 6   // Gb
};

let flatModePending = false;

function clickWedgeByRing(ring, index){
  if(appMode === 'training'){

  } else {

  }
}

// состояние цикла мажор <-> минор (без снятия выбора), отдельно на букву
let hotkeyCycleLetter = null;
let hotkeyCycleStage = 0; // 0 = ничего ещё не нажато, 1 = мажор, 2 = минор

/* Практика 2: подсказка (загаданная ячейка) уже стоит на строго
   определённом кольце (мажор или минор) — поэтому обычный 3-этапный
   цикл (мажор -> минор -> снятие) здесь не нужен и даже вреден: он
   может "перепрыгнуть" на другое кольцо, хотя правильный ответ может
   быть только на том кольце, где стоит загаданная ячейка. Вместо
   цикла клавиша сразу проверяется на кольце currentL2.ring: если буква/
   диез совпадают — засчитывается попытка именно там (клик по ведж-
   элементу currentL2.ring, дальше всё как обычно решает
   onWedgeClickLevel2New — зелёная/красная вспышка). */
function handleNoteHotkeyLevel2(e){
  if(!currentL2) return false;
  const ring = currentL2.ring;

  if(flatModePending){
    const letter = HOTKEY_LETTER[e.code];
    // Клавиша не является буквой ноты — просто ждём дальше, режим не сбрасываем
    if(!letter) return false;

    setFlatModePending(false);
    const pc = HOTKEY_FLAT_PC[e.code];
    if(pc === undefined) return false;
    const idx = (ring === 'major' ? majorsSemitone : minorsSemitone).indexOf(pc);
    if(idx === -1) return false;
    clickWedgeByRing(ring, idx);
    return true;
  }

  if(e.shiftKey){
    const pc = HOTKEY_SHARP_PC[e.code];
    if(pc === undefined) return false;
    const idx = (ring === 'major' ? majorsSemitone : minorsSemitone).indexOf(pc);
    if(idx === -1) return false;
    clickWedgeByRing(ring, idx);
    return true;
  }

  const letter = HOTKEY_LETTER[e.code];
  if(!letter) return false;
  const idx = ring === 'major'
    ? majors.indexOf(letter)
    : minors.findIndex(n => rootOf(n) === letter);
  if(idx === -1) return false;
  clickWedgeByRing(ring, idx);
  return true;
}

function handleNoteHotkey(e){
  // не мешаем сочетаниям типа Ctrl+C / Cmd+C / Alt+... — обрабатываем
  // только "чистую" букву или Shift+букву (для диезов)
  if(e.ctrlKey || e.metaKey || e.altKey) return false;

  // Практика 1 — горячие клавиши нот полностью отключены
  if(appMode === 'practice' && practiceLevel === 1) return false;

  // Практика 2 — свой, не циклический, обработчик (см. выше)
  if(appMode === 'practice' && practiceLevel === 2){
    return handleNoteHotkeyLevel2(e);
  }

  if(flatModePending){
    const letter = HOTKEY_LETTER[e.code];
    // Клавиша не является буквой ноты — просто ждём дальше, режим не сбрасываем
    if(!letter) return false;

    setFlatModePending(false);
    const pc = HOTKEY_FLAT_PC[e.code];
    if(pc === undefined) return false;

    const cycleKey = 'flat:' + pc;
    if(hotkeyCycleLetter !== cycleKey){
      hotkeyCycleStage = 0;
      hotkeyCycleLetter = cycleKey;
    }
    hotkeyCycleStage = (hotkeyCycleStage === 1) ? 2 : 1;

    if(hotkeyCycleStage === 1){
      const idx = majorsSemitone.indexOf(pc);
      if(idx === -1) return false;
      clickWedgeByRing('major', idx);
      return true;
    }
    const idx = minorsSemitone.indexOf(pc);
    if(idx === -1) return false;
    clickWedgeByRing('minor', idx);
    return true;
  }

  if(e.shiftKey){
    const pc = HOTKEY_SHARP_PC[e.code];
    if(pc === undefined) return false;

    const cycleKey = 'sharp:' + pc;
    if(hotkeyCycleLetter !== cycleKey){
      hotkeyCycleStage = 0;
      hotkeyCycleLetter = cycleKey;
    }
    hotkeyCycleStage = (hotkeyCycleStage === 1) ? 2 : 1;

    if(hotkeyCycleStage === 1){
      const idx = majorsSemitone.indexOf(pc);
      if(idx === -1) return false;
      clickWedgeByRing('major', idx);
      return true;
    }
    const idx = minorsSemitone.indexOf(pc);
    if(idx === -1) return false;
    clickWedgeByRing('minor', idx);
    return true;
  }

  const letter = HOTKEY_LETTER[e.code];
  if(!letter) return false;

  if(hotkeyCycleLetter !== letter){
    hotkeyCycleStage = 0;
    hotkeyCycleLetter = letter;
  }
  hotkeyCycleStage = (hotkeyCycleStage === 1) ? 2 : 1;

  if(hotkeyCycleStage === 1){
    const idx = majors.indexOf(letter);
    if(idx === -1) return false;
    clickWedgeByRing('major', idx);
    return true;
  }
  const idx = minors.findIndex(n => rootOf(n) === letter);
  if(idx === -1) return false;
  clickWedgeByRing('minor', idx);
  return true;
}

document.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  if(e.code === 'Space' && !e.ctrlKey && !e.metaKey && !e.altKey &&
     !(appMode === 'practice' && practiceLevel === 1)){
    setFlatModePending(true);
    e.preventDefault();
    return;
  }
  if(handleNoteHotkey(e)){
    e.preventDefault();
    return;
  }
  if(key === '+' || key === '='){
    zoomIn();
  } else if(key === '-' || key === '_'){
    if(e.shiftKey){
      zoomReset();
    } else {
      zoomOut();
    }
  } else if(key === 'q' || key === 'й'){
    trainV1ArrowsBtn.click();
  } else if(key === 'u' || key === 'г'){
    trainV2ColorBtn.click();
  } else if(key === 'w' || key === 'ц'){
    toggleSidePanel();
  }
});

/* =========================================================
   MIDI-клавиатура: подключение и выбор ноты на круге.

   В отличие от горячих клавиш A-G (только натуральные буквы),
   MIDI-нота однозначно задаёт pitch class (0..11), поэтому чёрные
   клавиши тоже работают — просто выбирают соответствующий диез/бемоль
   на круге (F#, Db, Ab и т.д. — они уже есть в massives majors/minors).

   Цикл нажатий на ОДНУ И ТУ ЖЕ pitch class:
     1-е нажатие -> мажорная клетка
     2-е нажатие -> минорная клетка (та же тоника)
     3-е нажатие -> снова мажорная клетка (и т.д., без снятия выбора)
   Нажатие ноты с ДРУГИМ pitch class сбрасывает цикл и начинает заново
   с мажорной клетки для новой ноты — как и с буквенными горячими клавишами.
   ========================================================= */
const minorsSemitone = minors.map(n => noteNames.indexOf(rootOf(n)));

let midiAccess = null;
let midiHotkeyPc = null;
let midiHotkeyStage = 0; // 0 = ничего ещё не нажато, 1 = мажор, 2 = минор

function handleMidiNote(pc){
  if(midiHotkeyPc !== pc){
    midiHotkeyStage = 0;
    midiHotkeyPc = pc;
  }
  midiHotkeyStage = (midiHotkeyStage === 1) ? 2 : 1;

  if(midiHotkeyStage === 1){
    const idx = majorsSemitone.indexOf(pc);
    if(idx === -1) return;
    clickWedgeByRing('major', idx);
    return;
  }
  const idx = minorsSemitone.indexOf(pc);
  if(idx === -1) return;
  clickWedgeByRing('minor', idx);
}

function onMidiMessage(event){
  const data = event.data;
  const status = data[0] & 0xf0;
  const note = data[1];
  const velocity = data[2];
  if(status === 0x90 && velocity > 0){
    handleMidiNote(note % 12);
  }
}

function bindAllMidiInputs(){
  if(!midiAccess) return;
  midiAccess.inputs.forEach(inp => {
    inp.onmidimessage = onMidiMessage;
  });
}

function populateMidiSelect(){
  const sel = document.getElementById('midiInputSelect');
  const statusLine = document.getElementById('midiStatusLine');
  sel.innerHTML = '';
  const inputs = [...midiAccess.inputs.values()];
  if(inputs.length === 0){
    sel.innerHTML = '<option>Нет входов</option>';
    statusLine.textContent = 'MIDI входы не найдены';
    statusLine.style.color = '#f88';
  } else {
    inputs.forEach(inp => {
      const opt = document.createElement('option');
      opt.value = inp.id;
      opt.textContent = inp.name + (inp.state !== 'connected' ? ' (не подключено)' : '');
      sel.appendChild(opt);
    });
    statusLine.textContent = `Входы: ${inputs.map(i => i.name).join(', ')}`;
    statusLine.style.color = '#8f8';
  }
  // слушаем ВСЕ входы сразу, выбор в списке — только информационный
  bindAllMidiInputs();
}

function requestMidiAccess(){
  const statusLine = document.getElementById('midiStatusLine');
  if(!navigator.requestMIDIAccess){
    statusLine.textContent = 'Браузер не поддерживает Web MIDI (нужен Chrome/Edge)';
    statusLine.style.color = '#f88';
    return;
  }
  navigator.requestMIDIAccess({ sysex: false })
    .then(access => {
      midiAccess = access;
      populateMidiSelect();
      access.onstatechange = () => populateMidiSelect();
    })
    .catch(err => {
      statusLine.textContent = 'Ошибка доступа к MIDI: ' + err +
        '. Если файл открыт напрямую (file://), запустите его через локальный сервер (http://localhost).';
      statusLine.style.color = '#f88';
    });
}

requestMidiAccess();

document.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  if(key === 'y' || key === 'н'){
    const panel = document.getElementById('midiPanel');
    panel.style.display = (panel.style.display === 'none' || !panel.style.display) ? 'block' : 'none';
  }
});

applyZoom();
</script>
<script>
(function(){
  // Общая подсказка для всех .infoIcon: показывается через position:fixed
  // и лежит прямо в <body>, поэтому не обрезается прокручиваемой панелью
  // настроек (#sidePanel: overflow:auto) и всегда оказывается поверх
  // соседних подписей (тоника, терция и т.д.) — перекрывать другие
  // элементы окна ей можно, это ожидаемо.
  var tip = document.getElementById('globalInfoTooltip');
  if(!tip) return;

  function showTip(icon){
    var text = icon.getAttribute('data-tip');
    if(!text) return;
    tip.textContent = text;
    tip.style.display = 'block';
    positionTip(icon);
  }

  function hideTip(){
    tip.style.display = 'none';
  }

  function positionTip(icon){
    var r = icon.getBoundingClientRect();
    var margin = 8;
    // Сначала пробуем разместить над иконкой, по центру.
    tip.style.left = '0px';
    tip.style.top = '0px';
    var tw = tip.offsetWidth;
    var th = tip.offsetHeight;

    var left = r.left + r.width / 2 - tw / 2;
    var top = r.top - th - margin;

    // Если подсказка не помещается сверху — рисуем её под иконкой.
    if(top < margin){
      top = r.bottom + margin;
    }
    // Не даём вылезти за левый/правый край окна.
    var maxLeft = window.innerWidth - tw - margin;
    if(left > maxLeft) left = maxLeft;
    if(left < margin) left = margin;
    // Не даём вылезти за нижний край окна.
    var maxTop = window.innerHeight - th - margin;
    if(top > maxTop) top = maxTop;
    if(top < margin) top = margin;

    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }

  document.addEventListener('mouseover', function(e){
    var icon = e.target.closest ? e.target.closest('.infoIcon') : null;
    if(icon) showTip(icon);
  });
  document.addEventListener('mouseout', function(e){
    var icon = e.target.closest ? e.target.closest('.infoIcon') : null;
    if(icon) hideTip();
  });
  // На случай прокрутки/ресайза, пока подсказка открыта — просто скрываем,
  // чтобы не зависала в неверном месте.
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
})();
</script>
