};

/* ===== Расширенные аккорды (9, 11, 13 и их разновидности) =====
   Числовые смещения (Вариант 1) — из сводной таблицы пользователя, той
   же формы, что и degreeSteps выше (прямое смещение от тоники по кругу
   квинт, на ТОМ ЖЕ кольце). Для этих аккордов пока реализован только
   Вариант 1 (числовой) — буквенной схемы (Вариант 2) нет, см.
   CHORD_TYPES_WITHOUT_VARIANT2 ниже. Оформление стрелок (точка старта /
   длина стойки / цвет) одинаковое для всех аккордов этой группы — так
   квинта/терция/септима/нона/ундецима/тердецима всегда выглядят
   одинаково независимо от конкретного типа аккорда. */
const EXT_CHORD_DEGREES = {
  dom9:    { fifth:1, third:4,  seventh:-2, ninth:2 },
  maj9:    { fifth:1, third:4,  seventh:5,  ninth:2 },
  m9:      { fifth:1, third:-3, seventh:-2, ninth:2 },
  mmaj9:   { fifth:1, third:-3, seventh:5,  ninth:2 },
  add11:   { fifth:1, third:4,  eleventh:-1 },
  madd11:  { fifth:1, third:-3, eleventh:-1 },
  dom11:   { fifth:1, third:4,  seventh:-2, ninth:2, eleventh:-1 },
  maj11:   { fifth:1, third:4,  seventh:5,  ninth:2, eleventh:-1 },
  m11:     { fifth:1, third:-3, seventh:-2, ninth:2, eleventh:-1 },
  dom13:   { fifth:1, third:4,  seventh:-2, ninth:2, eleventh:-1, thirteenth:3 },
  maj13:   { fifth:1, third:4,  seventh:5,  ninth:2, eleventh:-1, thirteenth:3 },
  m13:     { fifth:1, third:-3, seventh:-2, ninth:2, eleventh:-1, thirteenth:3 },
  mmaj13:  { fifth:1, third:-3, seventh:5,  ninth:2, eleventh:-1, thirteenth:3 }
};
const EXT_DEGREE_STYLE = {
  fifth:      { startPoint:'extP1', stubLength:40,  color:'var(--blue)'   },
  third:      { startPoint:'extP2', stubLength:60,  color:'var(--yellow)' },
  seventh:    { startPoint:'extP3', stubLength:80,  color:'var(--purple)' },
  ninth:      { startPoint:'extP4', stubLength:100, color:'var(--cyan)'   },
  eleventh:   { startPoint:'extP5', stubLength:120, color:'var(--orange)' },
  thirteenth: { startPoint:'extP6', stubLength:140, color:'var(--lime)'   }
};
Object.keys(EXT_CHORD_DEGREES).forEach(chordKey=>{
  const degrees = EXT_CHORD_DEGREES[chordKey];
  const arrows = {};
  Object.keys(degrees).forEach(degKey=>{
    const style = EXT_DEGREE_STYLE[degKey];
    arrows[degKey] = {
      startPoint: style.startPoint,
      degreeSteps: degrees[degKey],
      stubLength: style.stubLength,
      color: style.color
    };
  });
  SUS_CONFIGS[chordKey] = { arrows };
});

// типы аккордов, для которых нет Варианта 2 (буквенной схемы) — при
// выборе такого аккорда интерфейс принудительно переключается на
// Вариант 1 и блокирует кнопку "Вариант 2"
const CHORD_TYPES_WITHOUT_VARIANT2 = new Set([
  'sus2', 'sus4'
]);
// эти аккорды имеют буквенную схему (Вариант 2) только когда тоника
// выбрана на МАЖОРНОМ кольце — на минорном кольце буквенная схема
// совпадает с числовой (Вариант 1), поэтому там Вариант 2 блокируется
const CHORD_TYPES_VARIANT2_MAJOR_ONLY = new Set(['maj7', 'add9', 'madd9']);
// min7 — наоборот: буквенная схема (напр. Am -> C, Am -> G) осмысленна
// только когда тоника выбрана на МИНОРНОМ кольце; на мажорном кольце для
// min7 буквенной схемы нет, поэтому там Вариант 2 блокируется
const CHORD_TYPES_VARIANT2_MINOR_ONLY = new Set(['min7']);
function chordTypeHasVariant2(type, ring){
  if(type === 'triad') return true;
  if(CHORD_TYPES_WITHOUT_VARIANT2.has(type)) return false;
  if(CHORD_TYPES_VARIANT2_MAJOR_ONLY.has(type)) return (ring || 'major') === 'major';
  if(CHORD_TYPES_VARIANT2_MINOR_ONLY.has(type)) return ring === 'minor';
  return true;
}

// эти аккорды/кольца НЕ имеют отдельной схемы под кнопкой UI "Вариант 2" —
// единственная верная схема показывается под UI "Вариант 1", а кнопка
// UI "Вариант 2" блокируется целиком. madd11 — на обоих кольцах; add11 —
// только на минорном кольце (на мажорном у add11 обе схемы верны и
// различны, там ничего не меняется).
const CHORD_TYPES_UI_VARIANT2_BLOCKED = new Set(['madd11']);
const CHORD_TYPES_UI_VARIANT2_BLOCKED_MINOR_ONLY = new Set(['add11', 'dom11', 'maj9', 'maj11', 'mmaj13', 'maj13', 'm13']);
function chordTypeUIVariant2Blocked(type, ring){
  if(CHORD_TYPES_UI_VARIANT2_BLOCKED.has(type)) return true;
  if(CHORD_TYPES_UI_VARIANT2_BLOCKED_MINOR_ONLY.has(type)) return ring === 'minor';
  return false;
}

// majors — это и есть перечень нот в порядке круга квинт (позиция i совпадает
// с углом i*30°), поэтому его можно использовать как "линейку" для перевода
// любой ноты (мажор/минор/dim) в её позицию на круге квинт.
const majorsSemitone = majors.map(n => noteNames.indexOf(FLAT_TO_SHARP[n] || n));
function fifthsIndexOfSemitone(semi){
  return majorsSemitone.indexOf(semi);
}
// возвращает позицию на круге квинт (0..11) для тоники, выбранной на
// любом кольце (мажор/минор/dim) — нужно для sus-аккордов, у которых нет
// мажорного/минорного наклонения.
function tonicFifthsIndex(ring, tonicIndex){
  let semitone;
  if(ring === 'minor') semitone = noteNames.indexOf(rootOf(minors[tonicIndex]));
  else semitone = majorsSemitone[tonicIndex];
  return fifthsIndexOfSemitone(semitone);
}

function buildTrainArrowDefs(){
  const defs = el('defs', {});
  // по одному маркеру-наконечнику на каждую стрелку — из TRIAD_ARROWS и
  // из всех SUS_CONFIGS (уникально по ключу, повторы вроде "fifth" не дублируются)
  const allArrowSets = [TRIAD_ARROWS, ...Object.values(SUS_CONFIGS).map(cfg => cfg.arrows)];
  const seen = new Set();
  allArrowSets.forEach(arrowSet=>{
    Object.keys(arrowSet).forEach(key=>{
      if(seen.has(key)) return;
      seen.add(key);
      const arrowCfg = arrowSet[key];
      const marker = el('marker', {
        id: `trainArrowHead_${key}`,
        viewBox: '0 0 10 10',
        refX: '8', refY: '5',
        markerWidth: String(TRAIN_ARROW_CONFIG.arrowHeadSize),
        markerHeight: String(TRAIN_ARROW_CONFIG.arrowHeadSize),
        orient: 'auto-start-reverse'
      });
      const arrowPath = el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: arrowCfg.color });
      marker.appendChild(arrowPath);
      defs.appendChild(marker);
    });
  });
  trainSvg.appendChild(defs);
}

// нормализует toAngle так, чтобы дуга от fromAngle шла по кратчайшему пути
function shortestTargetAngle(fromAngle, toAngle){
  let diff = (toAngle - fromAngle) % 360;
  if(diff > 180) diff -= 360;
  if(diff < -180) diff += 360;
  return fromAngle + diff;
}

// текущие нарисованные стрелки (чтобы их можно было стереть при смене тоники/режима)
let trainArrowElements = [];
function clearTrainArrows(){
  trainArrowElements.forEach(elm => elm.remove());
  trainArrowElements = [];
}

function drawTrainArrow(fromAngle, toAngle, stubLength, color, markerId, rBase){
  if(rBase === undefined) rBase = R3;
  const rArc  = rBase + stubLength;
  toAngle = shortestTargetAngle(fromAngle, toAngle);

  // стойка у начальной точки (на тонике)
  const stubStart1 = polar(CX, CY, rBase, fromAngle);
  const stubEnd1 = polar(CX, CY, rArc, fromAngle);

  // стойка у ноты-цели: идёт СНАРУЖИ ВНУТРЬ — от rArc до самого края её ячейки
  // (rBase), с наконечником стрелки на конце, то есть указывает прямо на ноту,
  // а не останавливается снаружи круга
  const stubStart2 = polar(CX, CY, rArc, toAngle);
  const stubEnd2 = polar(CX, CY, rBase, toAngle);

  // дуга между двумя стойками, на радиусе rArc
  const largeArc = Math.abs(toAngle - fromAngle) > 180 ? 1 : 0;
  const sweep = toAngle > fromAngle ? 1 : 0;

  // весь путь (стойка → дуга → стойка) рисуется ОДНИМ path'ом, с одним
  // наконечником на самом конце — при увеличении strokeWidth стыки не
  // расходятся, т.к. это одна непрерывная линия
  const d = `M ${stubStart1.x} ${stubStart1.y}
             L ${stubEnd1.x} ${stubEnd1.y}
             A ${rArc} ${rArc} 0 ${largeArc} ${sweep} ${stubStart2.x} ${stubStart2.y}
             L ${stubEnd2.x} ${stubEnd2.y}`;
  const arrowPath = el('path', {
    d,
    fill: 'none',
    stroke: color,
    'stroke-width': TRAIN_ARROW_CONFIG.strokeWidth,
    'stroke-linejoin': 'round',
    'marker-end': `url(#${markerId})`
  });
  trainSvg.appendChild(arrowPath);
  trainArrowElements.push(arrowPath);
}

// строит стрелки трезвучия от заданной тоники мажора.
// variant: '1' — терция прямой дугой по тому же (мажорному) кольцу
//                (TRIAD_V1.major.third, смещение +4);
//          '2' — терция через квинту: сначала дуга к квинте (общий для
//                обоих вариантов первый шаг), затем радиальная стрелка
//                "вниз" от квинты (мажор) к её родственному минору на
//                той же позиции круга — это и есть терция (напр. для C:
//                G "вниз" даёт Em, читаем букву "E").
function buildTriadArrowsForMajorTonic(tonicNoteName, variant){
  const tonicIndex = majors.indexOf(tonicNoteName);
  if(tonicIndex === -1) return;

  const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
  const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;

  // именованные точки на верхней дуге тоники (см. TRIAD_START_POINTS)
  const startPointAngles = {};
  Object.keys(TRIAD_START_POINTS).forEach(name=>{
    startPointAngles[name] = startA + (endA - startA) * TRIAD_START_POINTS[name];
  });

  // квинта: Вариант 1 — дуга по кольцу (как раньше); Вариант 2 — прямая
  // стрелка "от подписи к подписи", в точности как у минора (см.
  // buildTriadArrowsForMinorTonic / drawTrainDirectLabelArrow), чтобы
  // Вариант 2 выглядел одинаково что в мажоре (C -> G), что в миноре (Am -> Em).
  const fifthCfg = TRIAD_V1.major.fifth;
  const fifthTargetIndex = (tonicIndex + fifthCfg.degreeSteps) % 12;

  if(variant === '1'){
    const tonicLabel = trainWedgeMap['major-' + tonicIndex].label;
    const fifthLabel = trainWedgeMap['major-' + fifthTargetIndex].label;
    drawTrainDirectLabelArrow(tonicLabel, fifthLabel, fifthCfg.color, 'trainArrowHead_fifth');

    const thirdColor = TRIAD_V1.major.third.color;
    drawTrainRadialArrowBetween(fifthTargetIndex*30, thirdColor, 'trainArrowHead_third', 'major', fifthTargetIndex, 'minor', fifthTargetIndex);
  } else {
    drawTrainArrow(startPointAngles[fifthCfg.startPoint], fifthTargetIndex*30, fifthCfg.stubLength, fifthCfg.color, 'trainArrowHead_fifth');
    const thirdCfg = TRIAD_V1.major.third;
    const thirdTargetIndex = ((tonicIndex + thirdCfg.degreeSteps) % 12 + 12) % 12;
    drawTrainArrow(startPointAngles[thirdCfg.startPoint], thirdTargetIndex*30, thirdCfg.stubLength, thirdCfg.color, 'trainArrowHead_third');
  }
}

// расстояние (в пикселях) от отступа TRAIN_RADIAL_ARROW_LABEL_GAP —
// именно столько отсчитывается от края подписи ноты до начала/конца
// радиальной стрелки минора (см. drawTrainRadialArrow)
const TRAIN_RADIAL_ARROW_LABEL_GAP = 3;

// находит точку на границе bbox текстовой подписи вдоль радиального
// направления (угол angleDeg, направление наружу если outward=true,
// иначе внутрь к центру круга). Возвращает саму точку на краю рамки
// и единичный вектор направления (для последующего отступа от края).
function pointOnLabelEdgeDir(bbox, ux, uy){
  const cx = bbox.x + bbox.width / 2;
  const cy = bbox.y + bbox.height / 2;
  const hw = bbox.width / 2, hh = bbox.height / 2;
  let t = Infinity;
  if(ux !== 0) t = Math.min(t, hw / Math.abs(ux));
  if(uy !== 0) t = Math.min(t, hh / Math.abs(uy));
  return { x: cx + ux * t, y: cy + uy * t, ux, uy };
}

function pointOnLabelEdge(bbox, angleDeg, outward){
  const a = (angleDeg - 90) * Math.PI / 180;
  let ux = Math.cos(a), uy = Math.sin(a);
  if(!outward){ ux = -ux; uy = -uy; }
  return pointOnLabelEdgeDir(bbox, ux, uy);
}

// прямая стрелка между подписями двух ячеек (по кратчайшей прямой между
// центрами их подписей), с тем же отступом TRAIN_RADIAL_ARROW_LABEL_GAP
// от края каждой подписи, что и у радиальной стрелки терции.
function drawTrainDirectLabelArrow(labelFrom, labelTo, color, markerId){
  const fromBox = labelFrom.getBBox();
  const toBox = labelTo.getBBox();
  const fromCx = fromBox.x + fromBox.width / 2, fromCy = fromBox.y + fromBox.height / 2;
  const toCx = toBox.x + toBox.width / 2, toCy = toBox.y + toBox.height / 2;
  let dx = toCx - fromCx, dy = toCy - fromCy;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;

  const startEdge = pointOnLabelEdgeDir(fromBox, dx, dy);
  const endEdge = pointOnLabelEdgeDir(toBox, -dx, -dy);

  const p1 = { x: startEdge.x + startEdge.ux * TRAIN_RADIAL_ARROW_LABEL_GAP,
               y: startEdge.y + startEdge.uy * TRAIN_RADIAL_ARROW_LABEL_GAP };
  const p2 = { x: endEdge.x + endEdge.ux * TRAIN_RADIAL_ARROW_LABEL_GAP,
               y: endEdge.y + endEdge.uy * TRAIN_RADIAL_ARROW_LABEL_GAP };

  const line = el('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    stroke: color,
    'stroke-width': TRAIN_ARROW_CONFIG.strokeWidth,
    'marker-end': `url(#${markerId})`
  });
  trainSvg.appendChild(line);
  trainArrowElements.push(line);
}

// радиальная стрелка между мажорным и минорным кольцом на одной и той же
// угловой позиции круга (переход на родственный мажор/минор — "вверх"/
// "вниз" из сводной таблицы). Работает в обе стороны:
//   fromRing='minor' → "вверх" (минор → его родственный мажор)
//   fromRing='major' → "вниз" (мажор → его родственный минор)
// Начало/конец стрелки отсчитываются не от радиусов колец, а от
// реального края подписи ноты (её bbox), с отступом
// TRAIN_RADIAL_ARROW_LABEL_GAP пикселей от этого края — мажорное кольцо
// внешнее, минорное — среднее, поэтому "от минора" всегда наружу,
// "от мажора" всегда внутрь.
function drawTrainRadialArrowBetween(angle, color, markerId, fromRing, fromIndex, toRing, toIndex){
  const fromLabel = trainWedgeMap[fromRing + '-' + fromIndex].label;
  const toLabel = trainWedgeMap[toRing + '-' + toIndex].label;
  const fromBox = fromLabel.getBBox();
  const toBox = toLabel.getBBox();

  const fromOutward = (fromRing === 'minor'); // minor->major идёт наружу, major->minor — внутрь
  const startEdge = pointOnLabelEdge(fromBox, angle, fromOutward);
  const endEdge = pointOnLabelEdge(toBox, angle, !fromOutward);

  const p1 = { x: startEdge.x + startEdge.ux * TRAIN_RADIAL_ARROW_LABEL_GAP,
               y: startEdge.y + startEdge.uy * TRAIN_RADIAL_ARROW_LABEL_GAP };
  const p2 = { x: endEdge.x + endEdge.ux * TRAIN_RADIAL_ARROW_LABEL_GAP,
               y: endEdge.y + endEdge.uy * TRAIN_RADIAL_ARROW_LABEL_GAP };

  const line = el('line', {
    x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    stroke: color,
    'stroke-width': TRAIN_ARROW_CONFIG.strokeWidth,
    'marker-end': `url(#${markerId})`
  });
  trainSvg.appendChild(line);
  trainArrowElements.push(line);
}
// сохранено для обратной совместимости по старой сигнатуре (minor->major, "вверх")
function drawTrainRadialArrow(angle, color, markerId, minorIndex, majorIndex){
  drawTrainRadialArrowBetween(angle, color, markerId, 'minor', minorIndex, 'major', majorIndex);
}

// строит стрелки трезвучия для тоники минорного кольца:
// квинта — прямая стрелка внутри минорного кольца (общий шаг для обоих
// вариантов); терция зависит от variant:
//   '1' — прямая стрелка по тому же минорному кольцу, смещение -3
//         (TRIAD_V1.minor.third) — попадает на ячейку с суффиксом "m"
//         (напр. для Am это "Cm"), нужная буква — просто "C";
//   '2' — радиальная стрелка "вверх" к родственному мажору на той же
//         позиции круга (напр. Am "вверх" даёт C) — корректная подпись
//         без суффикса.
// круговое расстояние (в шагах по кругу квинт, кратчайшее в обе стороны)
// между двумя позициями 0..11
function fifthsCircularDistance(indexA, indexB){
  const diff = Math.abs(indexA - indexB) % 12;
  return Math.min(diff, 12 - diff);
}

// ===== Гладкая дуга "через центр" (без изломов) =====
// В отличие от drawTrainArrow (стойка → дуга → стойка, с резкими углами —
// см. MINOR_CENTER_ARROW_RBASE выше, "часовой" вид), эта функция рисует
// ОДНУ непрерывную дугу окружности от центра нижней (внутренней, R0) грани
// ячейки ноты-источника до центра нижней грани ячейки ноты-цели, без
// прямых "стоек". Радиус дуги фиксирован (MINOR_ARC_RADIUS) и одинаков
// для всех вызовов — поэтому у всех дуг одного аккорда одинаковый
// "прогиб", как в arc_demo.html. Наконечник стрелки сам разворачивается
// по касательной к дуге (marker orient="auto" в SVG считает это
// автоматически, вручную ничего не пересчитываем).
const MINOR_ARC_RADIUS = R1 + MINOR_CENTER_ARROW_STUB; // тот же радиус, что был у старой "стойка-дуга-стойка"

function drawMinorCenterArc(tonicIndex, targetIndex, color, markerId){
  // начало/конец дуги — не от подписи ноты, а от центра нижней (внутренней,
  // R0) грани ячейки минорного кольца, на угле этой ячейки
  const p1 = polar(CX, CY, R0, tonicIndex * 30);
  const p2 = polar(CX, CY, R0, targetIndex * 30);

  // радиус дуги не может быть меньше половины хорды (иначе дуга такого
  // радиуса физически не дотянется от p1 до p2)
  const p1p2 = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
  const r = Math.max(Math.abs(MINOR_ARC_RADIUS), p1p2 / 2 + 1);

  // выбираем сторону выгиба так, чтобы дуга шла в сторону центра круга
  // (та же логика, что и у arc_demo: смотрим, с какой стороны хорды p1->p2
  // лежит центр CX,CY)
  const cross = (p2.x - p1.x) * (CY - p1.y) - (p2.y - p1.y) * (CX - p1.x);
  const sweepFlag = cross > 0 ? 0 : 1;

  const d = `M ${p1.x} ${p1.y} A ${r} ${r} 0 0 ${sweepFlag} ${p2.x} ${p2.y}`;
  const path = el('path', {
    d,
    fill: 'none',
    stroke: color,
    'stroke-width': TRAIN_ARROW_CONFIG.strokeWidth,
    'stroke-linecap': 'round',
    'marker-end': `url(#${markerId})`
  });
  trainSvg.appendChild(path);
  trainArrowElements.push(path);
}

// рисует стрелку минорного Варианта 1 от тоники к целевой ячейке того же
// (минорного) кольца: если ячейка соседняя — прямая линия "от подписи к
// подписи" (как раньше); если нет — гладкая дуга через центр, одного
// фиксированного радиуса (см. drawMinorCenterArc / MINOR_ARC_RADIUS выше).
function drawMinorV1Arrow(tonicIndex, targetIndex, color, markerId){
  if(fifthsCircularDistance(tonicIndex, targetIndex) === 1){
    const tonicLabel = trainWedgeMap['minor-' + tonicIndex].label;
    const targetLabel = trainWedgeMap['minor-' + targetIndex].label;
    drawTrainDirectLabelArrow(tonicLabel, targetLabel, color, markerId);
  } else {
    drawMinorCenterArc(tonicIndex, targetIndex, color, markerId);
  }
}

function buildTriadArrowsForMinorTonic(tonicIndex, variant){
  const fifthCfg = TRIAD_V1.minor.fifth;
  const fifthTargetIndex = (tonicIndex + fifthCfg.degreeSteps) % 12;
  drawMinorV1Arrow(tonicIndex, fifthTargetIndex, fifthCfg.color, 'trainArrowHead_fifth');

  const thirdCfg = TRIAD_V1.minor.third;
  if(variant === '2'){
    const thirdTargetIndex = ((tonicIndex + thirdCfg.degreeSteps) % 12 + 12) % 12;
    drawMinorV1Arrow(tonicIndex, thirdTargetIndex, thirdCfg.color, 'trainArrowHead_third');
  } else {
    // относительный мажор находится под тем же индексом, что и минорная тоника
    drawTrainRadialArrowBetween(tonicIndex*30, thirdCfg.color, 'trainArrowHead_third', 'minor', tonicIndex, 'major', tonicIndex);
  }
}

// во сколько раз уменьшаются stubLength у sus/септаккордов/add9, когда
// тоника выбрана на минорном кольце — стрелки в этом случае идут ВНУТРЬ
// (к центру), а свободного места там меньше, чем снаружи мажорного
// кольца, поэтому длины стоек масштабируются, чтобы дуги не "проваливались"
// за центр круга (radius должен остаться положительным: R1 - 100*scale > 0).
const MINOR_SUS_ARROW_STUB_SCALE = 0.7;

// строит стрелки sus-аккорда/септаккорда/add9 для тоники, выбранной на
// любом кольце (мажор/минор) — эти аккорды не имеют "наклонения", смещения
// заданы напрямую по кругу квинт от тоники. Мажорная тоника — стрелки
// рисуются как раньше, наружу от мажорного кольца (R3). Минорная тоника —
// стрелки рисуются на самом минорном кольце (по его собственному индексу,
// он идёт в том же порядке круга квинт, что и мажорное), дугами ВНУТРЬ,
// к центру, тем же приёмом, что и "стрелка через центр" у минорного
// Варианта 1 (см. MINOR_CENTER_ARROW_RBASE выше).
// строит стрелки sus2/sus4 так, чтобы они ВСЕГДА указывали на соседнюю
// ячейку по кругу квинт — прямой линией "от подписи к подписи" (как
// drawMinorV1Arrow для одного шага). Если целевая ступень не является
// соседней (напр. секунда в мажорном sus2, +2 от тоники), стрелка рисуется
// цепочкой из двух сегментов через промежуточную соседнюю ячейку
// (напр. C -> G -> D): первый сегмент рисует сама "квинта" (ключ fifth,
// т.к. она всегда соседняя), второй — от той же промежуточной ячейки к цели.
function buildNeighborSusArrows(chordType, ring, tonicIndex){
  const susCfg = SUS_CONFIGS[chordType];
  function labelAt(idx){
    return trainWedgeMap[ring + '-' + idx].label;
  }
  Object.keys(susCfg.arrows).forEach(key=>{
    const arrowCfg = susCfg.arrows[key];
    const steps = (ring === 'minor' && arrowCfg.minorDegreeSteps !== undefined)
      ? arrowCfg.minorDegreeSteps
      : arrowCfg.degreeSteps;
    const targetIndex = ((tonicIndex + steps) % 12 + 12) % 12;
    const dist = fifthsCircularDistance(tonicIndex, targetIndex);
    if(dist <= 1){
      drawTrainDirectLabelArrow(labelAt(tonicIndex), labelAt(targetIndex), arrowCfg.color, `trainArrowHead_${key}`);
    } else {
      const step = steps > 0 ? 1 : -1;
      const midIndex = ((tonicIndex + step) % 12 + 12) % 12;
      drawTrainDirectLabelArrow(labelAt(midIndex), labelAt(targetIndex), arrowCfg.color, `trainArrowHead_${key}`);
    }
  });
}

function buildSusArrowsForTonic(chordType, ring, tonicIndex){
  if(chordType === 'sus2' || chordType === 'sus4'){
    buildNeighborSusArrows(chordType, ring, tonicIndex);
    return;
  }
  const susCfg = SUS_CONFIGS[chordType];

  // ===== Минорное кольцо: у ВСЕХ стрелок (квинта/терция/септима/нона)
  // теперь одна и та же дуга-через-центр, одного и того же радиуса
  // (MINOR_CENTER_ARROW_RBASE + MINOR_CENTER_ARROW_STUB) — тем же приёмом,
  // что и у минорного трезвучия (см. drawMinorV1Arrow). Раньше у каждой
  // ступени был свой радиус (stubLength * MINOR_SUS_ARROW_STUB_SCALE),
  // из-за чего дуги внутри одного аккорда получались разного "прогиба" —
  // теперь радиус всегда один и тот же, независимо от того, квинта это,
  // септима или нона. Если целевая нота соседняя по кругу квинт —
  // рисуется прямая линия "от подписи к подписи", как и у трезвучия.
  if(ring === 'minor'){
    // нона у add9/madd9: рисуем не от тоники, а от квинты (соседняя
    // ячейка квинты и ноны на круге квинт) — напр. для Am (fifth=Em,
    // ninth=Bm) стрелка идёт Em -> Bm, а не Am -> Bm через центр.
    const fifthIndex = susCfg.arrows.fifth
      ? ((tonicIndex + susCfg.arrows.fifth.degreeSteps) % 12 + 12) % 12
      : tonicIndex;
    if(chordType === 'm11'){
      // m11 на минорном кольце (напр. Am11): вместо отдельных стрелок
      // тоника->ступень — две цепочки по своему кольцу:
      // ундецима -> септима -> терция (Dm -> Gm -> Cm) и
      // квинта -> нона (Em -> Bm). Старая прямая тоника->нона (Am->Bm)
      // убрана.
      const eleventhIndex = ((tonicIndex + susCfg.arrows.eleventh.degreeSteps) % 12 + 12) % 12;
      const seventhIndex = ((tonicIndex + susCfg.arrows.seventh.degreeSteps) % 12 + 12) % 12;
      const thirdIndex = ((tonicIndex + susCfg.arrows.third.degreeSteps) % 12 + 12) % 12;
      const ninthIndex = ((tonicIndex + susCfg.arrows.ninth.degreeSteps) % 12 + 12) % 12;
      drawMinorV1Arrow(tonicIndex, fifthIndex, susCfg.arrows.fifth.color, 'trainArrowHead_fifth');
      drawMinorV1Arrow(tonicIndex, eleventhIndex, susCfg.arrows.eleventh.color, 'trainArrowHead_eleventh');
      drawMinorV1Arrow(eleventhIndex, seventhIndex, susCfg.arrows.seventh.color, 'trainArrowHead_seventh');
      drawMinorV1Arrow(seventhIndex, thirdIndex, susCfg.arrows.third.color, 'trainArrowHead_third');
      drawMinorV1Arrow(fifthIndex, ninthIndex, susCfg.arrows.ninth.color, 'trainArrowHead_ninth');
      return;
    }
    Object.keys(susCfg.arrows).forEach(key=>{
      const arrowCfg = susCfg.arrows[key];
      const targetIndex = ((tonicIndex + arrowCfg.degreeSteps) % 12 + 12) % 12;
      if(key === 'ninth' && (chordType === 'add9' || chordType === 'madd9' || chordType === 'm9' || chordType === 'mmaj9')){
        drawMinorV1Arrow(fifthIndex, targetIndex, arrowCfg.color, `trainArrowHead_${key}`);
      } else {
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowCfg.color, `trainArrowHead_${key}`);
      }
    });
    return;
  }

  // ===== Мажорное кольцо: без изменений (стрелки наружу от R3, с
  // индивидуальными stubLength и точками старта на дуге тоники) =====
  const fifthsIndex = tonicFifthsIndex(ring, tonicIndex);
  const tonicNoteName = majors[fifthsIndex];
  const angleIndex = majors.indexOf(tonicNoteName);
  if(angleIndex === -1) return;

  const startA = angleIndex*30 - 15 + WEDGE_GAP_ANGLE;
  const endA = angleIndex*30 + 15 - WEDGE_GAP_ANGLE;
  const startPointAngles = {};
  Object.keys(TRIAD_START_POINTS).forEach(name=>{
    startPointAngles[name] = startA + (endA - startA) * TRIAD_START_POINTS[name];
  });

  Object.keys(susCfg.arrows).forEach(key=>{
    const arrowCfg = susCfg.arrows[key];
    const targetIndex = ((angleIndex + arrowCfg.degreeSteps) % 12 + 12) % 12;
    const targetAngle = targetIndex * 30;
    const fromAngle = startPointAngles[arrowCfg.startPoint];
    drawTrainArrow(fromAngle, targetAngle, arrowCfg.stubLength, arrowCfg.color, `trainArrowHead_${key}`);
  });
}

// ===== Вариант 2 (буквенный) для септаккордов 7 / maj7 / m7 =====
// В отличие от Варианта 1 (прямое числовое смещение по кругу квинт на
// том же кольце), здесь квинта и терция строятся так же, как в буквенном
// трезвучии (см. buildTriadArrowsForMajorTonic/MinorTonic, variant='2'):
//   - квинта: сосед по своему кольцу (+1), стрелка "от подписи к подписи";
//   - терция: переход на родственное кольцо (радиальная стрелка) —
//     у аккордов с большой терцией (7, maj7) переход происходит ОТ КВИНТЫ
//     "вниз" на противоположное кольцо; у аккордов с малой терцией (m7) —
//     переход происходит ОТ ТОНИКИ "вверх" на противоположное кольцо.
// Септима зависит от конкретного типа аккорда:
//   - 7  (dom7):  от тоники два шага по своему же кольцу в сторону
//                 уменьшения (тоника → −1 → −2), цепочка из 2 стрелок;
//   - maj7:       от терции (уже на противоположном кольце) ещё один
//                 шаг +1 по ТОМУ ЖЕ (противоположному) кольцу;
//   - m7 (min7):  от терции (уже на противоположном кольце) ещё один
//                 шаг +1 по ТОМУ ЖЕ (противоположному) кольцу.
// Само это семейство функций работает симметрично для тоники на любом
// кольце (мажор/минор) — направление перехода терции (вверх/вниз)
// определяется автоматически внутри drawTrainRadialArrowBetween.
const SEVENTH_LETTER_CHORDS = new Set(['dom7', 'maj7', 'min7']);

function trainLabelAt(ring, idx){
  return trainWedgeMap[ring + '-' + idx].label;
}

function buildSeventhLetterArrows(chordType, ring, tonicIndex){
  const otherRing = ring === 'minor' ? 'major' : 'minor';
  const arrowsCfg = SUS_CONFIGS[chordType].arrows;

  // квинта: сосед по своему кольцу (+1), как в буквенном трезвучии
  const fifthIndex = (tonicIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, tonicIndex), trainLabelAt(ring, fifthIndex),
    arrowsCfg.fifth.color, 'trainArrowHead_fifth'
  );

  if(chordType === 'dom7' && ring === 'minor'){
    // минорное кольцо (напр. тоника Am для аккорда "A7"): буквенная схема
    // здесь зеркальна мажорной — терция получается прямым шагом по своему
    // же кольцу (Am -> C#m, +4 по кругу квинт), а септима — переходом на
    // противоположное (мажорное) кольцо от квинты (Am -> Em -> G).
    const thirdIndex = ((tonicIndex + 4) % 12 + 12) % 12;
    drawMinorV1Arrow(tonicIndex, thirdIndex, arrowsCfg.third.color, 'trainArrowHead_third');
    drawTrainRadialArrowBetween(
      fifthIndex * 30, arrowsCfg.seventh.color, 'trainArrowHead_seventh',
      ring, fifthIndex, otherRing, fifthIndex
    );
  } else if(chordType === 'dom7'){
    // терция: от квинты — переход на противоположное кольцо (та же
    // позиция круга, что и квинта)
    drawTrainRadialArrowBetween(
      fifthIndex * 30, arrowsCfg.third.color, 'trainArrowHead_third',
      ring, fifthIndex, otherRing, fifthIndex
    );
    // септима: два шага по своему кольцу вниз от тоники (напр. C -> Bb) —
    // Bb НЕ соседняя нота с C, поэтому рисуем одной дугой по внешнему
    // радиусу напрямую от тоники до септимы, а не цепочкой через F
    const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
    drawTrainArrow(
      tonicIndex * 30, targetIndex * 30,
      arrowsCfg.seventh.stubLength, arrowsCfg.seventh.color, 'trainArrowHead_seventh'
    );
  } else if(chordType === 'maj7'){
    // терция: от квинты — переход на противоположное кольцо
    drawTrainRadialArrowBetween(
      fifthIndex * 30, arrowsCfg.third.color, 'trainArrowHead_third',
      ring, fifthIndex, otherRing, fifthIndex
    );
    // септима: от терции (на противоположном кольце) ещё шаг +1 по нему же
    const seventhIndex = (fifthIndex + 1) % 12;
    drawTrainDirectLabelArrow(
      trainLabelAt(otherRing, fifthIndex), trainLabelAt(otherRing, seventhIndex),
      arrowsCfg.seventh.color, 'trainArrowHead_seventh'
    );
  } else if(chordType === 'min7'){
    // терция: от тоники — переход на противоположное кольцо (та же
    // позиция круга, что и тоника), напр. Am -> C
    drawTrainRadialArrowBetween(
      tonicIndex * 30, arrowsCfg.third.color, 'trainArrowHead_third',
      ring, tonicIndex, otherRing, tonicIndex
    );
    // септима: прямая стрелка от самой тоники сразу к септиме на
    // противоположном кольце (напр. Am -> G), а НЕ цепочкой через
    // относительный мажор (не "C -> G")
    const seventhIndex = (tonicIndex + 1) % 12;
    drawTrainDirectLabelArrow(
      trainLabelAt(ring, tonicIndex), trainLabelAt(otherRing, seventhIndex),
      arrowsCfg.seventh.color, 'trainArrowHead_seventh'
    );
  }
}

// ===== Вариант 2 (буквенный) для mMaj7 =====
// Мажорное кольцо (напр. тоника C, аккорд "C mMaj7"): квинта — сосед по
// своему кольцу (C -> G), септима — от квинты ещё один шаг +1, но сразу
// на минорное кольцо (G -> Bm), терция — минорная терция (Eb), рисуется
// отдельной прямой дугой по внешнему радиусу от тоники (C -> Eb), т.к.
// Eb не сосед C и обычной цепочкой через подписи не строится.
// Минорное кольцо (напр. тоника Am, аккорд "Am mMaj7"): квинта — сосед по
// своему кольцу (Am -> Em), терция — переход на родственный мажор той же
// позиции (Am -> C), септима — большая септима (G#m), тоже не сосед Am,
// рисуется прямой дугой по внешнему радиусу (Am -> G#m).
function buildMMaj7LetterArrows(ring, tonicIndex){
  const arrowsCfg = SUS_CONFIGS.mmaj7.arrows;
  if(ring === 'minor'){
    const fifthIndex = (tonicIndex + 1) % 12;
    drawTrainDirectLabelArrow(
      trainLabelAt('minor', tonicIndex), trainLabelAt('minor', fifthIndex),
      arrowsCfg.fifth.color, 'trainArrowHead_fifth'
    );
    drawTrainRadialArrowBetween(
      tonicIndex * 30, arrowsCfg.third.color, 'trainArrowHead_third',
      'minor', tonicIndex, 'major', tonicIndex
    );
    const seventhIndex = ((tonicIndex + 5) % 12 + 12) % 12;
    drawMinorV1Arrow(tonicIndex, seventhIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
  } else {
    const fifthIndex = (tonicIndex + 1) % 12;
    drawTrainDirectLabelArrow(
      trainLabelAt('major', tonicIndex), trainLabelAt('major', fifthIndex),
      arrowsCfg.fifth.color, 'trainArrowHead_fifth'
    );
    const seventhIndex = (fifthIndex + 1) % 12;
    drawTrainDirectLabelArrow(
      trainLabelAt('major', fifthIndex), trainLabelAt('minor', seventhIndex),
      arrowsCfg.seventh.color, 'trainArrowHead_seventh'
    );
    const thirdIndex = ((tonicIndex - 3) % 12 + 12) % 12;
    drawTrainArrow(
      tonicIndex * 30, thirdIndex * 30,
      arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third'
    );
  }
}

// ===== Вариант 2 (буквенный) для add9 =====
// Квинта — сосед по своему кольцу (+1), как у септаккордов. Третья
// ступень — переход на противоположное кольцо (та же позиция, что и
// квинта), напр. C -> G -> Em. Нона — от квинты (на исходном кольце) на
// позицию на шаг дальше квинты (напр. G -> D).
function buildAdd9LetterArrows(ring, tonicIndex){
  const otherRing = ring === 'minor' ? 'major' : 'minor';
  const arrowsCfg = SUS_CONFIGS.add9.arrows;

  const fifthIndex = (tonicIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, tonicIndex), trainLabelAt(ring, fifthIndex),
    arrowsCfg.fifth.color, 'trainArrowHead_fifth'
  );
  drawTrainRadialArrowBetween(
    fifthIndex * 30, arrowsCfg.third.color, 'trainArrowHead_third',
    ring, fifthIndex, otherRing, fifthIndex
  );
  const ninthIndex = (fifthIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, fifthIndex), trainLabelAt(ring, ninthIndex),
    arrowsCfg.ninth.color, 'trainArrowHead_ninth'
  );
}

// ===== Вариант 2 (буквенный) для m(add9) на МАЖОРНОМ кольце =====
// По просьбе пользователя: квинта и нона строятся буквенной цепочкой
// по своему же (мажорному) кольцу — C -> G -> D (та же логика, что и у
// квинты/ноны в buildAdd9LetterArrows, но БЕЗ перехода на другое кольцо
// для терции). Терция (Eb) остаётся такой же, как в Варианте 1 —
// стрелка-стойка от тоники (числовая схема), без изменений.
function buildMAdd9LetterArrows(ring, tonicIndex){
  const arrowsCfg = SUS_CONFIGS.madd9.arrows;

  const fifthIndex = (tonicIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, tonicIndex), trainLabelAt(ring, fifthIndex),
    arrowsCfg.fifth.color, 'trainArrowHead_fifth'
  );
  const ninthIndex = (fifthIndex + 1) % 12;
  drawTrainDirectLabelArrow(
    trainLabelAt(ring, fifthIndex), trainLabelAt(ring, ninthIndex),
    arrowsCfg.ninth.color, 'trainArrowHead_ninth'
  );

  // терция (Eb) — как в Варианте 1: стрелка-стойка от тоники, без буквенной цепочки
  const fifthsIndex = tonicFifthsIndex(ring, tonicIndex);
  const tonicNoteName = majors[fifthsIndex];
  const angleIndex = majors.indexOf(tonicNoteName);
  if(angleIndex === -1) return;
  const startA = angleIndex*30 - 15 + WEDGE_GAP_ANGLE;
  const endA = angleIndex*30 + 15 - WEDGE_GAP_ANGLE;
  const thirdCfg = arrowsCfg.third;
  const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[thirdCfg.startPoint];
  const targetIndex = ((angleIndex + thirdCfg.degreeSteps) % 12 + 12) % 12;
  const targetAngle = targetIndex * 30;
  drawTrainArrow(fromAngle, targetAngle, thirdCfg.stubLength, thirdCfg.color, 'trainArrowHead_third');
}

// ===== Вариант 2 (буквенный) для расширенных аккордов (9/11/13 и их
// разновидности) =====
// Базовая часть (квинта/терция/[септима]) для каждого "качества" аккорда
// повторяет уже готовые буквенные схемы септаккордов/add9 — просто
// добавляются нона/ундецима/тердецима поверх них, теми же приёмами:
//   - нона   — от квинты ещё один шаг +1 по ЕЁ ЖЕ кольцу (квинта → нона);
//   - ундецима (когда не участвует в цепочке септимы) — от тоники один
//     шаг −1 по кольцу тоники, отдельная цепочка;
//   - для доминантовых 11/13 ундецима — это ПЕРВЫЙ шаг уже существующей
//     цепочки септимы (тоника → −1 [ундецима] → −2 [септима]) — просто
//     подписываем промежуточную точку;
//   - тердецима (мажорного качества, 13/maj13) — переход ОТ ТОНИКИ на
//     противоположное кольцо (та же позиция, что и тоника), отдельная
//     цепочка;
//   - тердецима минорного качества (m13/m(maj13)) помечена в исходной
//     таблице как особый маршрут "вниз 2" (по аналогии с не реализованным
//     здесь аккордом m6) — однозначной буквенной цепочки для неё нет,
//     поэтому визуально она рисуется так же, как в Варианте 1 (дуга через
//     центр на своём кольце).
//   - m(maj9)/m(maj13): септима — переход НЕ от терции/тоники, а от уже
//     полученной ноны (нона → противоположное кольцо, та же позиция).
function buildExtendedLetterArrows(chordType, ring, tonicIndex){
  const otherRing = ring === 'minor' ? 'major' : 'minor';
  const arrowsCfg = SUS_CONFIGS[chordType].arrows;
  const degrees = EXT_CHORD_DEGREES[chordType];

  const drawSame = (fromIdx, toIdx, cfgKey) => drawTrainDirectLabelArrow(
    trainLabelAt(ring, fromIdx), trainLabelAt(ring, toIdx),
    arrowsCfg[cfgKey].color, 'trainArrowHead_' + cfgKey
  );
  const drawCrossAt = (angleIdx, cfgKey) => drawTrainRadialArrowBetween(
    angleIdx * 30, arrowsCfg[cfgKey].color, 'trainArrowHead_' + cfgKey,
    ring, angleIdx, otherRing, angleIdx
  );

  const fifthIndex = (tonicIndex + 1) % 12;
  drawSame(tonicIndex, fifthIndex, 'fifth');

  let ninthIndex = null;
  if(degrees.ninth !== undefined){
    ninthIndex = (fifthIndex + 1) % 12;
    drawSame(fifthIndex, ninthIndex, 'ninth');
  }

  if(chordType === 'mmaj9' || chordType === 'mmaj13'){
    // третья: переход от тоники на противоположное кольцо (как в m7) —
    // КРОМЕ mmaj9 на мажорном кольце (напр. Cm(maj9)): крест по тому же
    // индексу дал бы относительный минор (Am), а нужна настоящая малая
    // терция (Eb) — рисуем её прямой дугой по внешнему радиусу от тоники,
    // тем же приёмом, что и у m9 на мажорном кольце.
    if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
      const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
      const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
      drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'mmaj13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
      // отдельного шага септимы (Bm->G#m) — продолжаем цепочку по своему
      // кольцу от ноны: Bm -> F#m -> C#m -> G#m (терция здесь не рисуется).
    } else {
      drawCrossAt(tonicIndex, 'third');
    }
    // септима: ЕЩЁ ОДИН шаг по своему же кольцу от ноны (+3 от ноны =
    // ровно то же расстояние, что и между тоникой и септимой по числам:
    // seventh=+5, ninth=+2, 5−2=3) — это НЕ переход на другое кольцо,
    // несмотря на то, что в таблице это описано как "вниз".
    // Исключения для mmaj9:
    //  - на мажорном кольце септима (нота B у Cm(maj9)) и нона (D) лежат
    //    на ОДНОМ И ТОМ ЖЕ индексе круга квинт на разных кольцах (D на
    //    мажорном, Bm на минорном) — поэтому вместо длинной дуги по
    //    своему кольцу рисуем короткий крест D -> Bm;
    //  - на минорном кольце нона и септима (Bm -> G#m) НЕ соседние по
    //    кругу квинт, поэтому вместо прямой стрелки нужна закруглённая
    //    дуга через центр — как у остальных стрелок минорного кольца.
    if(degrees.seventh !== undefined && ninthIndex !== null){
      if((chordType === 'mmaj9' || chordType === 'mmaj13') && ring === 'major'){
        drawCrossAt(ninthIndex, 'seventh');
      } else if(chordType === 'mmaj9' && ring === 'minor'){
        drawMinorV1Arrow(ninthIndex, (ninthIndex + 3) % 12, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else if(chordType === 'mmaj13' && ring === 'minor'){
        // по просьбе пользователя: убраны шаги F#m->C#m и C#m->G#m —
        // остаётся только первый шаг цепочки от ноны: Bm -> F#m.
        // Этот шаг ведёт в тердециму (F#m = тоника+3, см. degrees.thirteenth),
        // поэтому красится и подписывается как тердецима, а не как терция.
        const step1 = (ninthIndex + 1) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else {
        const seventhIndex = (ninthIndex + 3) % 12;
        drawSame(ninthIndex, seventhIndex, 'seventh');
      }
    }
    if(degrees.eleventh !== undefined){
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      // тердецима (m(maj13)): особый маршрут из таблицы ("вниз 2", по m6)
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      if(chordType === 'mmaj13' && ring === 'minor'){
        // по просьбе пользователя: вместо Am->F#m — две стрелки:
        // Am->G#m (по своему кольцу) и Am->C (крест на отн. мажор)
        const g_sharpMIndex = (ninthIndex + 3) % 12;
        drawMinorV1Arrow(tonicIndex, g_sharpMIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
        drawCrossAt(tonicIndex, 'third');
      } else if(ring === 'minor'){
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else if(chordType === 'mmaj13' && ninthIndex !== null){
        // по просьбе пользователя: вместо дуги по внешнему радиусу C -> A
        // рисуем прямую стрелку по своему кольцу от ноны: D -> A
        drawSame(ninthIndex, targetIndex, 'thirteenth');
      } else {
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.thirteenth.startPoint];
        drawTrainArrow(fromAngle, targetIndex*30, arrowsCfg.thirteenth.stubLength, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
    }
  } else if(chordType === 'add11' || chordType === 'dom9' || chordType === 'dom11' || chordType === 'dom13'){
    if(!(chordType === 'dom13' && ring === 'minor')){
      // третья: переход от квинты на противоположное кольцо (как в dom7)
      drawCrossAt(fifthIndex, 'third');
    }
    if(degrees.seventh !== undefined && degrees.eleventh === undefined){
      if(ring === 'minor'){
        // dom9 на минорном кольце (напр. тоника Am для аккорда "A9"):
        // септима — прямой шаг по своему же кольцу на +4 (Am -> C#m),
        // как в буквенной схеме для A7 на минорном кольце (см.
        // buildSeventhLetterArrows), а не цепочка через Dm
        const targetIndex = ((tonicIndex + 4) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else {
        // dom9 на мажорном кольце (напр. C9): септима — не соседняя нота
        // с тоникой (C -> Bb), поэтому рисуем одной дугой по внешнему
        // радиусу напрямую от тоники до септимы, а не цепочкой через F
        const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
        drawTrainArrow(
          tonicIndex * 30, targetIndex * 30,
          arrowsCfg.seventh.stubLength, arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    } else if(degrees.seventh !== undefined){
      const midIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, midIndex, 'eleventh');
      if(chordType === 'dom13' && ring === 'minor'){
        // по просьбе пользователя: вместо Am -> C#m (некорректно указывал
        // на терцию, а не на септиму) — цепочка от ундецимы по своему
        // кольцу: Dm -> Gm (септима)
        const targetIndex = ((midIndex - 1) % 12 + 12) % 12;
        drawMinorV1Arrow(midIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else if(ring === 'minor'){
        // dom11 на минорном кольце (напр. тоника Am для аккорда "A11"):
        // септима — прямой шаг по своему же кольцу на +4 (Am -> C#m), как
        // и у dom9 на минорном кольце, а не цепочка через Dm -> Gm
        const targetIndex = ((tonicIndex + 4) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      } else {
        // септима: тоника -> −1 (=ундецима) -> −2, одной цепочкой
        const targetIndex = ((tonicIndex - 2) % 12 + 12) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(ring, midIndex), trainLabelAt(ring, targetIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    } else if(degrees.eleventh !== undefined){
      // add11: ундецима — отдельный шаг тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      if(chordType === 'dom13' && ring === 'minor'){
        // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
        // креста терции (Em->G) — цепочка по своему кольцу от ноны:
        // Bm -> F#m (тердецима) -> C#m (терция)
        const step1 = (ninthIndex + 1) % 12;
        const step2 = (ninthIndex + 2) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
        drawMinorV1Arrow(step1, step2, arrowsCfg.third.color, 'trainArrowHead_third');
      } else {
        // тердецима (13): переход от тоники на противоположное кольцо
        drawCrossAt(tonicIndex, 'thirteenth');
      }
    }
  } else if(chordType === 'maj9' || chordType === 'maj11' || chordType === 'maj13') {
    if(ring === 'minor' && (chordType === 'maj9' || chordType === 'maj11')){
      // maj9/maj11 на минорном кольце (напр. тоника Am для аккорда "A maj9"
      // или "A maj11"): терция и септима — прямые шаги по СВОЕМУ ЖЕ
      // (минорному) кольцу (Am -> C#m, Am -> G#m), а не переход на
      // мажорное кольцо (Em -> G -> D)
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      drawMinorV1Arrow(tonicIndex, thirdIndex, arrowsCfg.third.color, 'trainArrowHead_third');
      if(degrees.seventh !== undefined){
        const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
        drawMinorV1Arrow(tonicIndex, seventhIndex, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      }
    } else if(chordType === 'maj13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста терции (Em->G) и септимы
      // по мажорному кольцу (G->D) — цепочка по своему кольцу от ноны:
      // Bm -> F#m (тердецима) -> C#m (терция) -> G#m (септима)
      const step1 = (ninthIndex + 1) % 12;
      const step2 = (ninthIndex + 2) % 12;
      const step3 = (ninthIndex + 3) % 12;
      drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      drawMinorV1Arrow(step1, step2, arrowsCfg.third.color, 'trainArrowHead_third');
      drawMinorV1Arrow(step2, step3, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
    } else {
      // третья: переход от квинты на противоположное кольцо (как в maj7)
      drawCrossAt(fifthIndex, 'third');
      if(degrees.seventh !== undefined){
        // септима: от терции (на противоположном кольце) ещё шаг +1 по нему же
        const seventhIndex = (fifthIndex + 1) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(otherRing, fifthIndex), trainLabelAt(otherRing, seventhIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    }
    if(degrees.eleventh !== undefined){
      // ундецима: отдельная цепочка тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined && !(chordType === 'maj13' && ring === 'minor')){
      // тердецима: переход от тоники на противоположное кольцо
      drawCrossAt(tonicIndex, 'thirteenth');
    }
  } else if(chordType === 'madd11' || chordType === 'm9' || chordType === 'm11' || chordType === 'm13') {
    if(chordType === 'm9'){
      if(ring === 'minor'){
        // m9 на минорном кольце (напр. Am9): терция и септима — та же
        // буквенная цепочка, что и у m11/m13 (переход тоники на
        // относительный мажор, затем ещё шаг +1 по нему же):
        // Am -> [крест] -> C -> G
        drawCrossAt(tonicIndex, 'third');
        if(degrees.seventh !== undefined){
          const seventhIndex = (tonicIndex + 1) % 12;
          drawTrainDirectLabelArrow(
            trainLabelAt(otherRing, tonicIndex), trainLabelAt(otherRing, seventhIndex),
            arrowsCfg.seventh.color, 'trainArrowHead_seventh'
          );
        }
      } else {
        // m9 на мажорном кольце (напр. Cm9): терция и септима — не
        // соседние ноты с тоникой (C -> Eb, C -> Bb), поэтому рисуем их
        // двумя дугами по внешнему радиусу из разных точек на дуге
        // тоники (тот же приём, что и у тердецимы выше), без перехода
        // на другое кольцо
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
        const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
        drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
        if(degrees.seventh !== undefined){
          const seventhIndex = ((tonicIndex + degrees.seventh) % 12 + 12) % 12;
          const seventhFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.seventh.startPoint];
          drawTrainArrow(seventhFromAngle, seventhIndex * 30, arrowsCfg.seventh.stubLength, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
        }
      }
    } else if(chordType === 'madd11' && ring !== 'minor'){
      // m(add11) на мажорном кольце (напр. Cm(add11)): терция — не
      // соседняя нота с тоникой (C -> Eb), поэтому рисуем прямую дугу по
      // внешнему радиусу от тоники (тот же приём, что у m9 на мажорном
      // кольце), а не крест к относительному минору (C -> Am)
      const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
      const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
      const thirdIndex = ((tonicIndex + degrees.third) % 12 + 12) % 12;
      const thirdFromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.third.startPoint];
      drawTrainArrow(thirdFromAngle, thirdIndex * 30, arrowsCfg.third.stubLength, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'm11' && ring !== 'minor'){
      // m11 на мажорном кольце (напр. Cm11): терция/септима/ундецима —
      // одна цепочка по своему же кольцу вниз по квинтам от тоники:
      // C -> F (ундецима) -> Bb (септима) -> Eb (терция)
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIdx, 'eleventh');
      drawSame(eleventhIdx, seventhIdx, 'seventh');
      drawSame(seventhIdx, thirdIdx, 'third');
    } else if(chordType === 'm13' && ring === 'minor'){
      // по просьбе пользователя: вместо креста к отн. мажору (Am->C) и
      // отдельного шага септимы (C->G) — нона переходит в тердециму по
      // своему кольцу (Bm -> F#m), а терция и септима приходят отдельной
      // цепочкой от ундецимы (Dm -> Gm -> Cm, см. ниже).
      if(ninthIndex !== null){
        const step1 = (ninthIndex + 1) % 12;
        drawMinorV1Arrow(ninthIndex, step1, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawMinorV1Arrow(eleventhIdx, seventhIdx, arrowsCfg.seventh.color, 'trainArrowHead_seventh');
      drawMinorV1Arrow(seventhIdx, thirdIdx, arrowsCfg.third.color, 'trainArrowHead_third');
    } else if(chordType === 'm13' && ring !== 'minor'){
      // по просьбе пользователя: вместо креста к отн. минору (C->Am) и
      // отдельного шага септимы (Am->Em) — продолжаем цепочку по своему
      // кольцу от ундецимы: F -> Bb -> Eb (септима и терция; сама
      // ундецима C -> F рисуется отдельно ниже, как обычно).
      const eleventhIdx = ((tonicIndex - 1) % 12 + 12) % 12;
      const seventhIdx = ((tonicIndex - 2) % 12 + 12) % 12;
      const thirdIdx = ((tonicIndex - 3) % 12 + 12) % 12;
      drawSame(eleventhIdx, seventhIdx, 'seventh');
      drawSame(seventhIdx, thirdIdx, 'third');
    } else {
      // третья: переход от тоники на противоположное кольцо (как в min7)
      drawCrossAt(tonicIndex, 'third');
      if(degrees.seventh !== undefined){
        // септима: от терции (на противоположном кольце) ещё шаг +1 по нему же
        const seventhIndex = (tonicIndex + 1) % 12;
        drawTrainDirectLabelArrow(
          trainLabelAt(otherRing, tonicIndex), trainLabelAt(otherRing, seventhIndex),
          arrowsCfg.seventh.color, 'trainArrowHead_seventh'
        );
      }
    }
    if(degrees.eleventh !== undefined && !(chordType === 'm11' && ring !== 'minor')){
      // ундецима: отдельная цепочка тоника -> −1
      const eleventhIndex = ((tonicIndex - 1) % 12 + 12) % 12;
      drawSame(tonicIndex, eleventhIndex, 'eleventh');
    }
    if(degrees.thirteenth !== undefined){
      // тердецима (m13): особый маршрут из таблицы ("вниз 2", по m6) —
      // однозначной буквенной цепочки нет, рисуем так же, как в Варианте 1
      const targetIndex = ((tonicIndex + degrees.thirteenth) % 12 + 12) % 12;
      if(chordType === 'm13' && ring === 'minor'){
        // тердецима уже нарисована выше (Bm -> F#m), здесь ничего не рисуем
      } else if(ring === 'minor'){
        drawMinorV1Arrow(tonicIndex, targetIndex, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      } else if(chordType === 'm13' && ninthIndex !== null){
        // по просьбе пользователя: вместо дуги по внешнему радиусу C -> A
        // рисуем прямую стрелку по своему кольцу от ноны: D -> A
        drawSame(ninthIndex, targetIndex, 'thirteenth');
      } else {
        const startA = tonicIndex*30 - 15 + WEDGE_GAP_ANGLE;
        const endA = tonicIndex*30 + 15 - WEDGE_GAP_ANGLE;
        const fromAngle = startA + (endA - startA) * TRIAD_START_POINTS[arrowsCfg.thirteenth.startPoint];
        drawTrainArrow(fromAngle, targetIndex*30, arrowsCfg.thirteenth.stubLength, arrowsCfg.thirteenth.color, 'trainArrowHead_thirteenth');
      }
    }
  }
}

// единая точка входа: строит стрелки трезвучия/sus-аккорда для тоники
// любого кольца (мажор/минор), в зависимости от текущего trainChordType
// и текущего варианта (trainVariant: '1' числовой / '2' буквенный).
// Для sus/add9-аккордов variant пока не влияет — см. комментарий у
// SUS_CONFIGS. Для септаккордов 7/maj7/m7 Вариант 2 теперь строит
// буквенную цепочку стрелок (buildSeventhLetterArrows); mMaj7 в Варианте 2
// строит свою буквенную схему через buildMMaj7LetterArrows.
function buildTriadArrowsForTonic(ring, tonicIndex){
  if(SUS_CONFIGS[trainChordType]){
    // dom7 на мажорном кольце (напр. C7): по просьбе пользователя буквенная
    // и числовая схемы стрелок поменяны местами — буквенная (C -> G -> Em
    // -> F -> Bb) теперь показывается в Варианте 1, числовая — в Варианте 2.
    if(trainChordType === 'dom7' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // maj7 на мажорном кольце (напр. Cmaj7): по просьбе пользователя
    // буквенная и числовая схемы стрелок поменяны местами — буквенная
    // (C -> G -> Em -> Bm) теперь в Варианте 1, числовая — в Варианте 2.
    if(trainChordType === 'maj7' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // mMaj7: по просьбе пользователя буквенная и числовая схемы стрелок
    // поменяны местами — буквенная (см. buildMMaj7LetterArrows) теперь в
    // Варианте 1, числовая — в Варианте 2 (для обоих колец, мажорного и минорного).
    if(trainChordType === 'mmaj7'){
      if(trainVariant === '1'){
        buildMMaj7LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && SEVENTH_LETTER_CHORDS.has(trainChordType)){
      buildSeventhLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    // add9 на мажорном кольце (напр. Cadd9): по просьбе пользователя
    // буквенная и числовая схемы стрелок поменяны местами (вместе с
    // цветом) — буквенная (C -> G -> Em -> D) теперь в Варианте 1,
    // числовая — в Варианте 2.
    if(trainChordType === 'add9' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildAdd9LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && trainChordType === 'add9'){
      buildAdd9LetterArrows(ring, tonicIndex);
      return;
    }
    // m(add9) на мажорном кольце: добавлена буквенная схема
    // (C -> G -> D, терция/Eb как раньше) — по просьбе пользователя она
    // поставлена Вариантом 1, а прежняя числовая схема стала Вариантом 2.
    if(trainChordType === 'madd9' && ring !== 'minor'){
      if(trainVariant === '1'){
        buildMAdd9LetterArrows(ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    // add11 на минорном кольце: буквенной схемы для этого случая нет —
    // единственная верная схема числовая (buildSusArrowsForTonic),
    // показывается под UI "Вариант 1" (кнопка "Вариант 2" заблокирована,
    // см. chordTypeUIVariant2Blocked)
    if(trainChordType === 'add11' && ring === 'minor'){
      buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      return;
    }
    // dom11 (A11) и maj11 на минорном кольце: единственная верная схема —
    // буквенная с прямыми шагами по своему кольцу (Am -> C#m, Am -> G#m/
    // C#m), показывается под UI "Вариант 1" (кнопка "Вариант 2"
    // заблокирована, см. chordTypeUIVariant2Blocked)
    if((trainChordType === 'dom11' || trainChordType === 'maj11') && ring === 'minor'){
      buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    // m11 (оба кольца): по просьбе пользователя буквенная и числовая
    // схемы стрелок поменяны местами — буквенная (buildExtendedLetterArrows,
    // F -> Bb -> Eb на мажорном кольце и т.п.) теперь показывается под UI
    // "Вариант 2", а числовая (buildSusArrowsForTonic, Dm -> Gm -> Cm /
    // Em -> Bm на минорном кольце) — под UI "Вариант 1".
    if(trainChordType === 'm11'){
      if(trainVariant === '1'){
        buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      } else {
        buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
      }
      return;
    }
    if(trainVariant === '2' && EXT_CHORD_DEGREES[trainChordType]){
      buildExtendedLetterArrows(trainChordType, ring, tonicIndex);
      return;
    }
    buildSusArrowsForTonic(trainChordType, ring, tonicIndex);
    return;
  }
  if(ring === 'minor'){
    buildTriadArrowsForMinorTonic(tonicIndex, trainVariant);
  } else {
    buildTriadArrowsForMajorTonic(majors[tonicIndex], trainVariant);
  }
}

buildTrainArrowDefs();

/* ===== Реестр цветов =====
   Каждый цвет можно называть и по имени, и по номеру (1..7) —
   см. resolveColor() ниже. Чтобы добавить новый цвет, объявите
   переменную в :root и добавьте сюда одну строку. */
const NAMED_COLORS = [
  { number: 1, name: 'green',  varName: '--green'  },
  { number: 2, name: 'red',    varName: '--red'    },
  { number: 3, name: 'yellow', varName: '--yellow' },
  { number: 4, name: 'blue',   varName: '--blue'   },
  { number: 5, name: 'cyan',   varName: '--cyan'   },
  { number: 6, name: 'orange', varName: '--orange' },
  { number: 7, name: 'purple', varName: '--purple' },
  { number: 8, name: 'lime',   varName: '--lime'   }
];
const NAMED_COLOR_ALIASES_RU = {
  'зелёный':'green', 'зеленый':'green',
  'красный':'red',
  'жёлтый':'yellow', 'желтый':'yellow',
  'синий':'blue',
  'голубой':'cyan',
  'лаймовый':'lime',
  'оранжевый':'orange',
  'фиолетовый':'purple'
};
function resolveColor(ref){
  let entry;
  if(typeof ref === 'number'){
    entry = NAMED_COLORS.find(c => c.number === ref);
  } else if(typeof ref === 'string'){
    const key = NAMED_COLOR_ALIASES_RU[ref.toLowerCase()] || ref.toLowerCase();
    entry = NAMED_COLORS.find(c => c.name === key);
  }
  if(!entry) throw new Error(`Неизвестный цвет: ${ref}`);
  return `var(${entry.varName})`;
}

/* ===== Подсветка ступеней трезвучия на круге обучения =====
   Вместо стрелок — просто красим всю ячейку нужной ступени, с
   прозрачностью 50%. degreeSteps — смещение по кругу квинт (в шагах
   по 30°) от тоники: 0 = тоника (1-я ступень), 1 = квинта (5-я ступень).
   Две версии, как и для стрелок (см. TRIAD_V1 выше):
   - TRIAD_V1_HIGHLIGHTS — числовой способ, терция прямым смещением на
     том же кольце (для минора попадёт на ячейку с суффиксом "m" —
     нужная буква всё равно верная, суффикс просто игнорируется);
   - TRIAD_V2_HIGHLIGHTS — буквенный способ, терция через родственный
     мажор/минор на той же позиции круга (корректная подпись без
     суффикса). Это прежнее (единственное) поведение подсветки. */
const TRIAD_DEGREE_HIGHLIGHT_OPACITY = 0.5;
const TRIAD_V1_HIGHLIGHTS = {
  major: {
    tonic: { ring:'major', degreeSteps: 0,  color: resolveColor(1) /* green */ },
    fifth: { ring:'major', degreeSteps: 1,  color: resolveColor(4) /* blue */ },
    third: { ring:'major', degreeSteps: 4,  color: resolveColor(3) /* yellow */ }
  },
  minor: {
    tonic: { ring:'minor', degreeSteps: 0,  color: resolveColor(1) /* green */ },
    fifth: { ring:'minor', degreeSteps: 1,  color: resolveColor(4) /* blue */ },
    third: { ring:'minor', degreeSteps: -3, color: resolveColor(3) /* yellow */ }
  }
};
const TRIAD_V2_HIGHLIGHTS = {
  major: {
    tonic: { ring:'major', degreeSteps: 0, color: resolveColor(1) /* green */ },
    fifth: { ring:'major', degreeSteps: 1, color: resolveColor(4) /* blue */ },
    third: { ring:'minor', degreeSteps: 1, color: resolveColor(3) /* yellow */ }
  },
  // минорное трезвучие: квинта — соседняя нота на том же минорном кольце,
  // терция — параллельный мажор (та же позиция круга, но мажорное кольцо)
  minor: {
    tonic: { ring:'minor', degreeSteps: 0, color: resolveColor(1) /* green */ },
    fifth: { ring:'minor', degreeSteps: 1, color: resolveColor(4) /* blue */ },
    third: { ring:'major', degreeSteps: 0, color: resolveColor(3) /* yellow */ }
  }
};
// сохранено для обратной совместимости по старым именам (Вариант 2 — как было раньше)
const TRIAD_DEGREE_HIGHLIGHTS = TRIAD_V2_HIGHLIGHTS.major;
const TRIAD_DEGREE_HIGHLIGHTS_MINOR = TRIAD_V2_HIGHLIGHTS.minor;

/* =========================================================
   ПРАКТИКА Уровень 2: показывается аккорд, нужно найти и нажать
   на круге его ноты (тоника, терция, квинта) — на любом из колец
   (мажорном или минорном), где встречается нужная буква.

   Ноты аккорда берутся из TRIAD_V1_HIGHLIGHTS — того же самого
   источника данных о построении трезвучий, что используется в
   режиме "Обучение". Если там когда-нибудь найдётся и починится
   ошибка в построении аккорда, эта починка автоматически применится
   и здесь, т.к. используется одна и та же функция/данные.
   ========================================================= */
function getTriadNoteLetters(ring, tonicIndex){
  const cfgSet = TRIAD_V1_HIGHLIGHTS[ring];
  const letters = new Set();
  Object.values(cfgSet).forEach(cfg=>{
    const idx = ((tonicIndex + cfg.degreeSteps) % 12 + 12) % 12;
    const names = cfg.ring === 'minor' ? minors : majors;
    letters.add(rootOf(names[idx]));
  });
  return letters;
}

let currentL3 = null;

/* ===== Практика 3: тип аккорда (Мажор/Минор трезвучие, 7, maj7, m7, mMaj7, ...) =====
   По умолчанию — обычные трезвучия ('triad'). Остальные типы используют
   те же числовые смещения (Вариант 1), что и в режиме "Обучение"
   (см. SUS_CONFIGS выше), просто применённые к практике поиска нот.

   МУЛЬТИВЫБОР: в отличие от режима "Обучение" (там всегда ровно один
   активный тип аккорда), в Практике 3 можно включить сразу несколько
   типов — все они попадают в общую выборку для новых вопросов.
   level3ChordTypes — Set выбранных типов; хотя бы один тип должен
   оставаться выбранным всегда (последний нельзя снять кликом/хоткеем). */
let level3ChordTypes = new Set(['triad']);

function getStepsForChordTypeL3(type, ring){
  if(type === 'triad'){
    const cfg = TRIAD_V1[ring];
    return [0, cfg.fifth.degreeSteps, cfg.third.degreeSteps];
  }
  const susCfg = SUS_CONFIGS[type];
  if(susCfg && susCfg.arrows){
    const steps = [0];
    Object.values(susCfg.arrows).forEach(d=>steps.push(d.degreeSteps));
    return steps;
  }
  const extCfg = EXT_CHORD_DEGREES[type];
  if(extCfg){
    const steps = [0];
    Object.values(extCfg).forEach(v=>steps.push(v));
    return steps;
  }
  return [0];
}

function getChordNoteLettersL3(ring, tonicIndex, type){
  const names = ring === 'minor' ? minors : majors;
  const steps = getStepsForChordTypeL3(type, ring);
  const letters = new Set();
  steps.forEach(s=>{
    const idx = ((tonicIndex + s) % 12 + 12) % 12;
    letters.add(rootOf(names[idx]));
  });
  return letters;
}

function chordTypeSuffixL3(type, ring){
  switch(type){
    case 'sus2': return 'sus2';
    case 'sus4': return 'sus4';
    case 'dom7': return '7';
    case 'maj7': return 'maj7';
    case 'min7': return ring === 'minor' ? '7' : 'm7';
    case 'mmaj7': return ring === 'minor' ? 'Maj7' : 'mMaj7';
    case 'add9': return 'add9';
    case 'madd9': return ring === 'minor' ? 'add9' : 'm(add9)';
    case 'dom9': return '9';
    case 'maj9': return 'maj9';
    case 'm9': return ring === 'minor' ? '9' : 'm9';
    case 'mmaj9': return ring === 'minor' ? 'Maj9' : 'mMaj9';
    case 'add11': return 'add11';
    case 'madd11': return ring === 'minor' ? 'add11' : 'm(add11)';
    case 'dom11': return '11';
    case 'maj11': return 'maj11';
    case 'm11': return ring === 'minor' ? '11' : 'm11';
    case 'dom13': return '13';
    case 'maj13': return 'maj13';
    case 'm13': return ring === 'minor' ? '13' : 'm13';
    case 'mmaj13': return ring === 'minor' ? 'Maj13' : 'mMaj13';
    default: return '';
  }
}

// история последних выпавших нот для Практики 3 (по буквам)
let rootHistoryL3 = [];

function pickNewChordL3(){
  let pool = activeChordsL3();
  if(pool.length === 0) return;

  const selCount = new Set(pool.map(c => rootOf(c.name))).size;
  let excludeCount = 0;
  if(selCount >= 12) excludeCount = 3;
  else if(selCount >= 8) excludeCount = 2;
  else if(selCount >= 4) excludeCount = 1;

  if(excludeCount > 0 && rootHistoryL3.length > 0){
    const excludeRoots = new Set(rootHistoryL3.slice(-excludeCount));
    const filtered = pool.filter(c => !excludeRoots.has(rootOf(c.name)));
    if(filtered.length > 0) pool = filtered;
  } else if(currentL3 && pool.length > 1){
    pool = pool.filter(c => !(c.ring === currentL3.ring && c.index === currentL3.index));
  }

  const weight = 1 / pool.length;
  let r = Math.random();
  let idx = Math.floor(r / weight);
  if(idx >= pool.length) idx = pool.length - 1;
  const chosen = pool[idx];

  // случайный тип аккорда из всех выбранных (мультивыбор)
  const typesArr = level3ChordTypes.size > 0 ? Array.from(level3ChordTypes) : ['triad'];
  const chordType = typesArr[Math.floor(Math.random() * typesArr.length)];

  currentL3 = {
    ring: chosen.ring,
    index: chosen.index,
    chordType: chordType,
    name: chosen.name + chordTypeSuffixL3(chordType, chosen.ring),
    letters: getChordNoteLettersL3(chosen.ring, chosen.index, chordType),
    found: new Set()
  };
  if(practiceLevel === 3) centerText.textContent = currentL3.name;
  renderLevel3Hint();

  rootHistoryL3.push(rootOf(chosen.name));
  if(rootHistoryL3.length > 3) rootHistoryL3.shift();
}

/* Кнопки выбора типа(-ов) аккорда для Практики 3 — мультивыбор: клик
   переключает тип в списке выбранных. Хотя бы один тип должен оставаться
   выбранным всегда — клик по последнему активному типу его не снимает. */
document.querySelectorAll('#level2TypeButtons .ringBtn[data-chordtype]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const type = btn.getAttribute('data-chordtype');
    if(level3ChordTypes.has(type)){
      if(level3ChordTypes.size === 1) return; // хотя бы один тип должен остаться выбранным
      level3ChordTypes.delete(type);
    } else {
      level3ChordTypes.add(type);
    }
    btn.classList.toggle('active', level3ChordTypes.has(type));
    currentL3 = null;
    if(practiceLevel === 3) pickNewChordL3();
  });
});

function onWedgeClickLevel3(e){
  if(!currentL3) return;
  const ring = e.currentTarget.getAttribute('data-ring');
  const index = parseInt(e.currentTarget.getAttribute('data-index'));
  const letter = rootOf((ring === 'major' ? majors : minors)[index]);

  if(currentL3.letters.has(letter)){
    flashWedge(ring, index, FLASH_GREEN, 300);
    if(!currentL3.found.has(letter)){
      currentL3.found.add(letter);
      renderLevel3Hint();
      if(currentL3.found.size === currentL3.letters.size){
        setTimeout(pickNewChordL3, 450);
      }
    }
  } else {
    flashWedge(ring, index, FLASH_RED, 300);
  }
}

/* ===== Практика 3: подсказка (буквы нот аккорда прямо на местах, куда
   нужно нажать на круге). Включается кнопкой "Подсказка" или клавишей
   Я/Z. Для каждой ещё не найденной буквы аккорда подпись рисуется на
   обеих подходящих ячейках круга (мажорное и минорное кольцо), т.к.
   засчитывается клик по любой из них. ===== */
const LEVEL3_HINT_RADIUS_MINOR = (R0 + R2) / 2;
const LEVEL3_HINT_RADIUS_MAJOR = (R2 + R3) / 2;
let level3HintVisible = false;

function renderLevel3Hint(){
  while(level3HintLayer.firstChild) level3HintLayer.removeChild(level3HintLayer.firstChild);
  if(!level3HintVisible || !currentL3 || practiceLevel !== 3) return;

  currentL3.letters.forEach(letter=>{
    if(currentL3.found.has(letter)) return;
    const majorIdx = majors.findIndex(n => rootOf(n) === letter);
    const minorIdx = minors.findIndex(n => rootOf(n) === letter);
    if(majorIdx !== -1){
      const p = polar(CX, CY, LEVEL3_HINT_RADIUS_MAJOR, majorIdx * 30);
      const t = el('text', {x:p.x, y:p.y, class:'level3HintLabel'});
      t.textContent = letter;
      level3HintLayer.appendChild(t);
    }
    if(minorIdx !== -1){
      const p = polar(CX, CY, LEVEL3_HINT_RADIUS_MINOR, minorIdx * 30);
      const t = el('text', {x:p.x, y:p.y, class:'level3HintLabel'});
      t.textContent = letter;
      level3HintLayer.appendChild(t);
    }
  });
}

function setLevel3HintVisible(v){
  level3HintVisible = v;
  if(level3HintBtn) level3HintBtn.classList.toggle('active', v);
  renderLevel3Hint();
}

function toggleLevel3Hint(){
  setLevel3HintVisible(!level3HintVisible);
}

const level3HintBtn = document.getElementById('level3HintBtn');
if(level3HintBtn){
  level3HintBtn.addEventListener('click', toggleLevel3Hint);
}

/* =========================================================
   ПРАКТИКА Уровень 2 (новый): на круге (не в центре) отображается
   одна нота — надо нажать её на круге. Если нота относится к
   мажорному кольцу — засчитывается клик по мажорному кольцу на
   соответствующей позиции, если к минорному — по минорному кольцу.
   В центре ничего не отображается. Настройки (выбор нот) — свой
   независимый набор selectedNotesL2 (см. круг выбора выше).
   ========================================================= */
const level2NoteLabelEl = document.getElementById('level2NoteLabel');
if(level2NoteLabelEl) level2NoteLabelEl.style.display = 'none';

const YELLOW_HIGHLIGHT_L2 = resolveColor(3); /* жёлтый — подсветка ячейки-задания */

function plainNoteLabel(name){
  return name.replace(/m$/, '');
}

let currentL2 = null;

function setWedgeFillL2(ring, index, color){
  const item = wedgeMap[ring+'-'+index];
  if(item) item.el.setAttribute('fill', color);
}

function clearWedgeHighlightL2(ring, index){
  const item = wedgeMap[ring+'-'+index];
  if(item) item.el.setAttribute('fill', item.baseColor);
}

// история последних выпавших нот для Практики 2 (по буквам)
let rootHistoryL2 = [];

function pickNewChordL2(){
  if(currentL2) clearWedgeHighlightL2(currentL2.ring, currentL2.index);
  let pool = activeChordsL2();
  if(pool.length === 0){ currentL2 = null; return; }
  const prev = currentL2;

  const selCount = new Set(pool.map(c => rootOf(c.name))).size;
  let excludeCount = 0;
  if(selCount >= 12) excludeCount = 3;
  else if(selCount >= 8) excludeCount = 2;
  else if(selCount >= 4) excludeCount = 1;

  if(excludeCount > 0 && rootHistoryL2.length > 0){
    const excludeRoots = new Set(rootHistoryL2.slice(-excludeCount));
    const filtered = pool.filter(c => !excludeRoots.has(rootOf(c.name)));
    if(filtered.length > 0) pool = filtered;
  } else if(prev && pool.length > 1){
    pool = pool.filter(c => !(c.ring === prev.ring && c.index === prev.index));
  }

  const weight = 1 / pool.length;
  let r = Math.random();
  let idx = Math.floor(r / weight);
  if(idx >= pool.length) idx = pool.length - 1;
  const chosen = pool[idx];
  currentL2 = {
    ring: chosen.ring,
    index: chosen.index,
    name: chosen.name,
    label: plainNoteLabel(chosen.name)
  };
  if(practiceLevel === 2) setWedgeFillL2(currentL2.ring, currentL2.index, YELLOW_HIGHLIGHT_L2);

  rootHistoryL2.push(rootOf(currentL2.name));
  if(rootHistoryL2.length > 3) rootHistoryL2.shift();
}

function onWedgeClickLevel2New(e){
  if(!currentL2) return;
  const ring = e.currentTarget.getAttribute('data-ring');
  const index = parseInt(e.currentTarget.getAttribute('data-index'));

  if(ring === currentL2.ring && index === currentL2.index){
    flashWedge(ring, index, FLASH_GREEN, 300);
    setTimeout(pickNewChordL2, 320);
  } else {
    flashWedge(ring, index, FLASH_RED, 300);
  }
}
