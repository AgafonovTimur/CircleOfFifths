<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Circle of Fifths</title>
<style>

  :root{
    --font: 'PT Sans Bold Embedded', Arial, sans-serif;

    --bg:#141414;
    --shadow:#303030;

    /* единый цвет всего текста в приложении — как у ноты в центре круга */
    --app-text-color:#D0D0D0;
    --text:var(--app-text-color);

    /* цвета круга — взяты с серых сегментов картинки (область D / Bm / C#°) */
    --ring-major:#2F2F2F;   /* внешнее кольцо (мажор), как у "D" */
    --ring-minor:#2F2F2F;   /* среднее кольцо (минор), как у "Bm" */
    --ring-note:#404040;    /* кольцо названий нот (обучение) */
    --ring-major-hover:#474747;
    --ring-minor-hover:#3c3c3c;

    --green:#689461;
    --red:#ffcccc;
    --green-flash:#689461;
    --red-flash:rgba(255,204,204,0.5);

    /* отдельный красный для подсветки формулы в подсказках (i), не
       путать с --red выше (он для подсветки нот на самом круге).
       Прозрачность 30% (0.3). Чтобы поменять цвет/прозрачность формулы
       в подсказках — правьте именно эту переменную. */
    --tip-formula-red:rgba(250, 82, 86, 1);

    /* доп. цвета для стрелок-подсказок (обучение) — называть можно
       и по имени, и по номеру, см. NAMED_COLORS в JS */
    --blue:rgba(179,217,255,0.5);
    --cyan:rgba(179,255,255,0.5);
    --yellow:rgba(255,242,179,0.5);
    --orange:rgba(255,217,179,0.5);
    --purple:rgba(217,179,255,0.5);
    --lime:rgba(220,255,179,0.5);

    /* палитра настроек — как на скриншотах */
    --menu-bg:#1e1e1e;
    --menu-border:#333333;
    --btn-bg:#333333;
    --btn-bg-hover:#3d3d3d;
    --btn-text:var(--app-text-color);
    --btn-active-bg:#5a5a5a;
    --btn-active-text:var(--app-text-color);

    /* цвет "нажатой" ноты на круге обучения (выбранная тоника) */
    --key-pressed: var(--btn-active-bg);
    --header-text:var(--app-text-color);
    --section-label:var(--app-text-color);
  }
  html,body{
    margin:0;padding:0;background:var(--bg);
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:var(--font);
    color:var(--text);
  }
  /* Убираем стандартную синюю/серую подсветку тапа на мобильных
     браузерах (WebKit/Blink) — именно она давала синий многоугольник
     поверх сегментов круга при нажатии. Плюс отключаем контекстное
     меню/выделение при долгом тапе на интерактивных элементах круга. */
  *{
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
  }
  svg, .wedge, .selWedge{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .wedge:focus, .selWedge:focus, svg:focus, svg *:focus{
    outline:none;
  }
  #app{
    display:flex;flex-direction:column;align-items:safe center;justify-content:safe center;gap:18px;
    padding:20px;
    box-sizing:border-box;
    min-height:100vh;
    width:100vw;
  }
  #score{
    font-size:16px;
    color:var(--text);
  }
  .wedge{
    cursor:pointer;
    transition:fill 0.05s ease;
  }
  #centerCircle, #trainCenterCircle{
    fill:var(--bg);
  }
  #centerNote, #trainCenterNote{
    font-weight:bold;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
    user-select:none;
    font-family:var(--font);
  }
  #ringSelect{
    display:flex;
    gap:8px;
  }
  .ringBtn{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:8px;
    padding:10px 0;
    width:100%;
    font-size:18px;
    font-family:var(--font);
    cursor:pointer;
    opacity:1;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ringBtn.active{
    background:var(--btn-active-bg);
    color:var(--btn-active-text);
  }
  .ringBtn:hover{
    background:var(--btn-bg-hover);
  }
  .ringBtn.active:hover{
    background:#666;
  }
  .ringBtn.disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .ringBtn.disabled:hover{
    background:var(--btn-bg);
  }
  #circleWrap, #trainCircleWrap{
    overflow:visible;
    flex:1 1 auto;
    width:100%;
    display:flex;
    align-items:safe center;
    justify-content:safe center;
    position:relative;
  }
  #level2NoteLabel{
    position:absolute;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-family:'PT Sans Bold Embedded', Arial, sans-serif;
    font-weight:bold;
    font-size:47px;
    color:var(--app-text-color);
    pointer-events:none;
    z-index:5;
  }
  /* ===== Панель настроек — модальное окно поверх круга, по центру
     экрана, с затемнением фона (#sidePanelBackdrop). Открывается и
     закрывается по клавише W, колесу мыши (вверх/вниз) и клику по
     затемнению. Состояние (открыта/закрыта) сохраняется в localStorage,
     чтобы не сбрасываться при перезагрузке страницы. ===== */
  #sidePanelBackdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:9;
  }
  #sidePanel{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:var(--menu-bg);
    border:1px solid var(--menu-border);
    border-radius:12px;
    padding:18px 22px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.6);
    max-height:92vh;
    max-width:92vw;
    overflow:auto;
    box-sizing:border-box;
    z-index:10;
    font-family:var(--font);
    scrollbar-width:none;      /* Firefox: скрыть скроллбар, скролл работает */
    -ms-overflow-style:none;   /* IE/Edge legacy */
  }
  #sidePanel::-webkit-scrollbar{
    display:none;              /* Chrome/Safari: скрыть скроллбар, скролл работает */
  }
  /* ===== Мобильная версия панели настроек: выезжающая снизу шторка
     (bottom-sheet), открывается свайпом вверх, закрывается свайпом
     вниз или тапом вне панели. Настройки внутри — те же самые, но
     позиционирование и способ открытия/закрытия — отдельные от
     десктопной версии и не пересекаются с ней (десктоп управляется
     колесом мыши и клавишей W, мобильная — свайпами и хендлом). ===== */
  body.is-mobile #sidePanel{
    left:0;
    right:0;
    top:auto;
    bottom:0;
    transform:translateY(100%);
    max-width:100vw;
    width:100%;
    max-height:80vh;
    border-radius:16px 16px 0 0;
    transition:transform 0.25s ease;
    touch-action:pan-y;
  }
  body.is-mobile #sidePanel.open{
    transform:translateY(0);
  }
  body.is-mobile #sidePanelBackdrop{
    transition:opacity 0.25s ease;
    opacity:0;
    pointer-events:none;
  }
  body.is-mobile #sidePanelBackdrop.open{
    opacity:1;
    pointer-events:auto;
  }
  /* Верхние вкладки "Практика 1 / Практика 2 / Обучение" — как на макете.
     Переключают, какой уровень/режим отображается ниже; настройки
     каждого уровня сохраняются отдельно и не сбрасываются при переходах. */
  #topTabBar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:8px;
    width:100%;
  }
  .topTabBtn{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:10px;
    padding:14px 6px;
    width:100%;
    font-size:16px;
    font-family:var(--font);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .topTabBtn.active{
    background:var(--btn-active-bg);
    color:var(--btn-active-text);
    font-weight:bold;
  }
  .topTabBtn:hover{
    background:var(--btn-bg-hover);
  }
  .topTabBtn.active:hover{
    background:#666;
  }
  #level2TypeHeader{
    font-size:16px;
    color:var(--header-text);
    font-weight:bold;
    letter-spacing:0.3px;
    font-family:var(--font);
  }
  #selectHeader, #selectHeader2, #selectHeader3{
    font-size:16px;
    color:var(--header-text);
    font-weight:bold;
    letter-spacing:0.3px;
    font-family:var(--font);
  }
  #selectButtons{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    width:100%;
  }
  #selectCircleWrap, #trainSelectCircleWrap, #selectCircleWrap2, #selectCircleWrap3{
    width:min(680px, 80vw);
    height:min(680px, 80vw);
  }
  #selectCircleWrap svg, #trainSelectCircleWrap svg, #selectCircleWrap2 svg, #selectCircleWrap3 svg{
    width:100%;
    height:100%;
  }
  #level1Panel, #level2Panel, #level3Panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
  }
  /* ===== Практика 3: сетка типов аккордов (3 в ряд), каждый со своей
     подсказкой (i) — как в списке аккордов вкладки "Обучение", только
     карточки уложены по 3 в ряд вместо одной колонки. ===== */
  #level2TypeButtons{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px 8px;
    width:100%;
  }
  #level2TypeButtons .ringBtnRow{
    gap:4px;
  }
  #level2TypeButtons .ringBtn{
    padding:8px 2px;
    font-size:13px;
  }
  #level2TypeButtons .infoIcon{
    width:20px;
    height:20px;
    font-size:11px;
  }
  #selectButtons2, #selectButtons3{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    width:100%;
  }
  #trainCircle{
    overflow:visible;
  }
  .selWedge{
    cursor:pointer;
  }
  .selLabel{
    pointer-events:none;
    user-select:none;
    text-anchor:middle;
    dominant-baseline:middle;
    font-size:14px;
    font-weight:bold;
    font-family:var(--font);
  }
  .level3HintLabel{
    pointer-events:none;
    user-select:none;
    text-anchor:middle;
    dominant-baseline:middle;
    font-size:16px;
    font-weight:bold;
    font-family:var(--font);
    fill:#fff;
    stroke:#000;
    stroke-width:0.6px;
    paint-order:stroke;
  }
  .trainChordLetters{
    pointer-events:none;
    user-select:none;
    text-anchor:middle;
    dominant-baseline:middle;
    font-size:9px;
    font-weight:normal;
    font-family:var(--font);
    fill:var(--app-text-color);
  }
  #trainCircleInner{
    position:relative;
    width:480px;
    height:480px;
  }
  /* Показывается на 1 секунду в центре круга при выборе типа аккорда
     цифровой клавишей в режиме "Обучение". */
  #trainHotkeyChordLabel{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:'PT Sans Bold Embedded', Arial, sans-serif;
    font-weight:bold;
    font-size:40px;
    color:var(--app-text-color);
    pointer-events:none;
    z-index:6;
    text-align:center;
  }
  .trainRomanLabel{
    pointer-events:none;
    user-select:none;
    text-anchor:end;
    dominant-baseline:hanging;
    font-size:11px;
    font-weight:bold;
    font-family:var(--font);
    fill:var(--red);
    display:none;
  }
  #trainExtraSettings{
    margin:10px 0 4px;
    display:flex;
    flex-direction:column;
    align-self:stretch;
    gap:6px;
  }
  #trainExtraSettings label{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--font);
    font-size:20px;
    text-align:left;
    color:var(--app-text-color);
    cursor:pointer;
  }
  #trainExtraSettings input[type="checkbox"]{
    cursor:pointer;
  }
  #midiPanel{
    margin:10px 0 4px;
    display:flex;
    flex-direction:column;
    align-self:stretch;
    gap:8px;
    padding-top:10px;
    border-top:1px solid var(--panel-border, rgba(255,255,255,0.15));
  }
  .midiPanelRow{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font);
    font-size:20px;
    color:var(--app-text-color);
  }
  .midiPanelRow select{
    flex:1;
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:8px;
    padding:6px 8px;
    font-family:var(--font);
    font-size:15px;
    cursor:pointer;
  }
  #midiStatusLine{
    font-family:var(--font);
    font-size:14px;
    color:#8f8;
  }
  #midiStatusLine.midiStatusError{
    color:#f88;
  }
  .noteBtn{
    background:var(--btn-bg);
    color:var(--btn-text);
    border:none;
    border-radius:8px;
    padding:10px 0;
    width:100%;
    font-size:15px;
    font-family:var(--font);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .noteBtn.active{
    background:var(--btn-active-bg);
    color:var(--btn-active-text);
  }
  .noteBtn:hover{
    background:var(--btn-bg-hover);
  }
  .noteBtn.active:hover{
    background:#666;
  }
  #trainingPanel, #practicePanel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
  }

  /* ===== Кнопки переключения вида подсказки (стрелки / подсветка ячеек) =====

     ---- НАСТРОЙКИ (крутите цифры в var(...., ЗДЕСЬ)) ----
     --panel-card-padding  : паддинг ВНУТРИ каждой карточки (Вариант1/2 и список аккордов) и легенды
     --panel-cards-gap     : расстояние между карточкой "Вариант1/2" и карточкой со списком аккордов
     --variant-groups-gap  : расстояние между блоком "Вариант 1" и блоком "Вариант 2"
     --chordlist-row-gap   : расстояние между строками списка аккордов (Sus2, Sus4, 7, ...)
     --variant-btn-padding : паддинг кнопок "Стрелками"/"Цветом"
     --info-icon-size      : размер круглой иконки (i)
     --info-icon-font-size : размер буквы "i" внутри иконки
     Если что-то из этого нужно вернуть как было — см. комментарий "было:" у каждого свойства.
  */
  #trainDisplayModeButtons{
    display:flex;
    flex-direction:column;
    gap:var(--panel-cards-gap, 16px);        /* было: 14px (раньше это был общий gap всех рядов сразу) */

    /* теперь просто содержимое вкладки "Обучение" внутри общей боковой
       панели #sidePanel — отдельного фиксированного позиционирования
       больше не требуется, панель уже стоит сбоку от круга */
    width:var(--train-display-width, min(680px, 80vw));  /* было: 340px, потом auto — теперь ширина как у Практики 1/2/3 (ширина круга выбора нот) */
    box-sizing:border-box;
  }
  /* Ранее у .variantCardsRow была своя рамка/фон отдельным блоком —
     убрано по запросу: кнопки "Вариант 1/2" теперь без обводки, как и
     сетка типов аккордов ниже. */
  .variantCardsRow{
    display:flex;
    gap:var(--variant-groups-gap, 20px);      /* было: 14px, было внутри .variantGroupsRow */
    width:100%;
    box-sizing:border-box;
  }
  /* ===== Список типов аккордов вкладки "Обучение": единая сетка в 3
     колонки без рамок и разделителей между "семействами" — как на
     макете-скриншоте (тот же порядок, что и в сетке "Тип аккорда"
     Практики 3, #level2TypeButtons). #trainChordGroups сам является
     grid-контейнером — отдельных карточек-групп больше нет. */
  #trainChordGroups{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:var(--chordgrid-row-gap, 10px) var(--chordgrid-col-gap, 8px);
    width:100%;
    max-height:78vh;
    overflow-y:auto;
    scrollbar-width:none;
    box-sizing:border-box;
  }
  #trainChordGroups::-webkit-scrollbar{
    display:none;
  }
  .chordGridCard{
    display:grid;
    gap:var(--chordgrid-row-gap, 10px) var(--chordgrid-col-gap, 8px);
    box-sizing:border-box;
    width:100%;
  }
  .chordGridCard.cols3{
    grid-template-columns:repeat(3, 1fr);
  }
  .chordGridCard.cols4{
    grid-template-columns:repeat(4, 1fr);
  }
  .chordGridCard.cols5{
    grid-template-columns:repeat(5, 1fr);
  }
  .chordGridCard .ringBtnRow{
    gap:4px;
  }
  .chordGridCard .ringBtn{
    padding:9px 2px;

    font-size:13px;
  }
  .chordGridCard .infoIcon{
    width:20px;
    height:20px;
    font-size:11px;
  }
  /* строка "кнопка + инфо-иконка" внутри trainDisplayModeButtons */
  .ringBtnRow{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .ringBtnRow .ringBtn{
    flex:1;
  }
  /* ===== Группы "Вариант 1" / "Вариант 2": заголовок + 2 кнопки под ним
     (Стрелками / Цветом). Обе группы — часть одного набора из 4 кнопок,
     активна всегда ровно одна (см. applyTrainVariantStyle в JS). ===== */
  .variantGroup{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1 1 0;
    min-width:0;
  }
  .variantGroupLabel{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:bold;
    color:var(--section-label);
    font-family:var(--font);
  }
  .variantGroupRow{
    display:flex;
    gap:6px;
  }
  .variantGroupRow .ringBtn{
    flex:1;
    font-size:14px;
    padding:var(--variant-btn-padding, 12px 0); /* было: 8px 0. Чтобы убрать — верните "8px 0" */
  }
  /* инфо-иконка (i) с подсказкой по наведению, в стиле "СЛОЖНОСТЬ ⓘ" */
  .infoIcon{
    flex:0 0 auto;
    width:var(--info-icon-size, 22px);        /* было: 18px */
    height:var(--info-icon-size, 22px);       /* было: 18px */
    border-radius:50%;
    background:var(--btn-bg);
    color:var(--btn-text);
    font-size:var(--info-icon-font-size, 13px); /* было: 12px */
    font-family:var(--font);
    font-style:italic;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:default;
    position:relative;
    user-select:none;
  }
  .infoIcon:hover{
    background:var(--btn-bg-hover);
  }
  /* ===== Легенда цветов вкладки "Обучение" =====
     Показывает, какой цвет какой ступени аккорда соответствует, для
     текущего выбранного типа аккорда (обновляется при смене кнопок).
     Теперь обычный блок внутри панели (2 колонки), а не плавающий
     элемент сбоку от круга — как на макете-скриншоте.

     --legend-row-gap     : расстояние между строками легенды
     --legend-padding     : паддинг внутри блока легенды (убрать — верните 16px)
     --legend-swatch-size : размер цветного квадратика
     --legend-font-size   : размер текста легенды
  */
  #trainLegend{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:var(--legend-row-gap, 14px) var(--legend-col-gap, 18px);
    width:100%;

    background:var(--menu-bg);
    border-radius:12px;
    padding:var(--legend-padding, 20px);      /* было: 16px */
    box-sizing:border-box;
  }
  .legendRow{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .legendSwatch{
    flex:0 0 auto;
    width:var(--legend-swatch-size, 24px);    /* было: 16px */
    height:var(--legend-swatch-size, 24px);   /* было: 16px */
    border-radius:6px;                        /* было: 4px */
    box-sizing:border-box;
  }

  fontSize: 47,
  color: getComputedStyle(document.documentElement).getPropertyValue('--app-text-color').trim(),
  fontFamily: "'PT Sans Bold Embedded'",
  verticalOffset: 0.07
};
/* ========================================================= */

const CX = 240, CY = 240;

const R0 = 95;
const R1 = 95;
const R2 = 160;
const R3 = 235;

const WEDGE_GAP_RADIAL = 1;

// НАСТРОЙКА РАССТОЯНИЯ: доля (0..1) от половины ширины кольца, на которую
// строка "буквы аккорда" (напр. "C E G") смещается от названия ноты К ЦЕНТРУ
// круга (к внутреннему краю своей ячейки/кольца, т.е. "ниже", как на образце).
// Увеличивайте, чтобы строка была ближе к внутренней границе ячейки.
const CHORD_LETTERS_RADIUS_OFFSET_RATIO = 0.72;
const WEDGE_GAP_ANGLE  = 0.5;

const majors = ['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const minors = ['Am','Em','Bm','F#m','C#m','G#m','D#m','Bbm','Fm','Cm','Gm','Dm'];
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const FLAT_TO_SHARP = { 'Db':'C#', 'Ab':'G#', 'Eb':'D#', 'Bb':'A#', 'Gb':'F#' };

function rootOf(name){
  let root = name.replace('°','').replace(/m$/,'');
  return FLAT_TO_SHARP[root] || root;
}

const allChords = [];
majors.forEach((n,i)=>allChords.push({name:n, ring:'major', index:i}));
minors.forEach((n,i)=>allChords.push({name:n, ring:'minor', index:i}));

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

// Угловая полуширина дуги для буквенной подписи аккорда (в градусах от
// центра ячейки в обе стороны). Меньше половины ширины ячейки (15°),
// чтобы буквы не пересекали её боковые границы.
const CHORD_LETTERS_ARC_HALF_ANGLE = 13;

// Строит "d" для невидимой дуги, вдоль которой рисуются буквы аккорда
// (через <textPath>). На нижней половине круга (90°..270°) дуга рисуется
// в обратном направлении — иначе текст оказался бы перевёрнутым вверх
// ногами (стандартная особенность текста на SVG-путях).
function chordLettersArcD(radius, centerAngle){
  const a1 = centerAngle - CHORD_LETTERS_ARC_HALF_ANGLE;
  const a2 = centerAngle + CHORD_LETTERS_ARC_HALF_ANGLE;
  const norm = ((centerAngle % 360) + 360) % 360;
  const flip = norm > 90 && norm < 270;
  const startAngle = flip ? a2 : a1;
  const endAngle = flip ? a1 : a2;
  const p1 = polar(CX, CY, radius, startAngle);
  const p2 = polar(CX, CY, radius, endAngle);
  const sweep = endAngle > startAngle ? 1 : 0;
  return `M ${p1.x} ${p1.y} A ${radius} ${radius} 0 0 ${sweep} ${p2.x} ${p2.y}`;
}

function segmentPath(rInner, rOuter, startAngle, endAngle){
  const p1 = polar(CX, CY, rOuter, startAngle);
  const p2 = polar(CX, CY, rOuter, endAngle);
  const p3 = polar(CX, CY, rInner, endAngle);
  const p4 = polar(CX, CY, rInner, startAngle);
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return `M ${p1.x} ${p1.y}
          A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y}
          L ${p3.x} ${p3.y}
          A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x} ${p4.y}
          Z`;
}

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildRing(ringName, rInner, rOuter, baseColor){
  for(let i=0;i<12;i++){
    const startA = i*30 - 15 + WEDGE_GAP_ANGLE;
    const endA = i*30 + 15 - WEDGE_GAP_ANGLE;
    const path = el('path', {
      d: segmentPath(rInner + WEDGE_GAP_RADIAL, rOuter - WEDGE_GAP_RADIAL, startA, endA),
      fill: baseColor,
      stroke: 'none',

      'data-index': i
    });

    svg.appendChild(path);
    wedgeMap[ringName+'-'+i] = { el: path, baseColor };
  }
}

// история последних выпавших нот (по буквам, без разделения на
// мажор/минор), самая новая — в конце; хранится не больше 3 последних.
let rootHistory = [];

function pickNewChord(){
  let pool = activeChords();

  // сколько последних нот исключать из следующего пула:
  // >=4 включённых нот — не повторять текущую;
  // >=8 включённых нот — не повторять текущую и предыдущую;
  // >=12 включённых нот — не повторять текущую и 2 предыдущие.
  const selCount = new Set(pool.map(c => rootOf(c.name))).size;
  let excludeCount = 0;
  if(selCount >= 12) excludeCount = 3;
  else if(selCount >= 8) excludeCount = 2;
  else if(selCount >= 4) excludeCount = 1;

  if(excludeCount > 0 && rootHistory.length > 0){
    const excludeRoots = new Set(rootHistory.slice(-excludeCount));
    const filtered = pool.filter(c => !excludeRoots.has(rootOf(c.name)));
    if(filtered.length > 0) pool = filtered;
  } else if(current && pool.length > 1){
    pool = pool.filter(c => !(c.ring === current.ring && c.index === current.index));
  }

  const weight = 1 / pool.length;
  let r = Math.random();
  let idx = Math.floor(r / weight);
  if(idx >= pool.length) idx = pool.length - 1;
  current = pool[idx];
  centerText.textContent = current.name;

  rootHistory.push(rootOf(current.name));
  if(rootHistory.length > 3) rootHistory.shift();
}

const FLASH_GREEN = getComputedStyle(document.documentElement).getPropertyValue('--green-flash').trim();
const FLASH_RED = getComputedStyle(document.documentElement).getPropertyValue('--red-flash').trim();

function flashWedge(ringName, index, color, duration){
  const item = wedgeMap[ringName+'-'+index];
  item.el.setAttribute('fill', color);
  setTimeout(()=>{
    item.el.setAttribute('fill', item.baseColor);
  }, duration);
}

function onWedgeClick(e){
  if(practiceLevel === 2){
    onWedgeClickLevel2New(e);
    return;
  }
  if(practiceLevel === 3){
    onWedgeClickLevel3(e);
    return;
  }
  const ring = e.currentTarget.getAttribute('data-ring');
  const index = parseInt(e.currentTarget.getAttribute('data-index'));

  if(ring === current.ring && index === current.index){
    flashWedge(ring, index, FLASH_GREEN, 300);
    setTimeout(pickNewChord, 320);
  } else {
    flashWedge(ring, index, FLASH_RED, 300);
  }
}

// Точечная ручная коррекция позиции римской цифры (ступени аккорда) для
// отдельных ячеек — на случай, если общее смещение (ROMAN_LABEL_*_INSET)
// подходит не всем ячейкам одинаково из-за разной ширины/формы глифов.
// Ключ — название ноты как в массивах majors/minors ('F#', 'C#m', ...),
// значение — { dx, dy } в пикселях (dx: + вправо, dy: + ВВЕРХ, - ВНИЗ).
// Если для ячейки записи нет — используется базовая позиция без изменений.
// ВАЖНО: каждый ключ должен встречаться в этом объекте только один раз —
// при дублировании ключа JS молча использует последнее по порядку значение.
const ROMAN_LABEL_MANUAL_OFFSETS = {
  'C':   { dx: 12,  dy: 2 },
  'G':   { dx: 10,  dy: -2 },
  'D':   { dx: 7,  dy: -4 },
  'A':   { dx: 3,  dy: -5 },
  'E':   { dx: 0,  dy: -3 },
  'B':   { dx: -5, dy: 0 },
  'F#':  { dx: -5, dy: 4 },
  'Db':  { dx: -2, dy: 9 },
  'Ab':  { dx: 1, dy: 12 },
  'Eb':  { dx: 7,  dy: 12 },
  'Bb':  { dx: 10,  dy: 7 },
  'F':   { dx: 12,  dy: 5 },
  'Am':  { dx: 7,  dy: 3 },
  'Em':  { dx: 5,  dy: 1 },
  'Bm':  { dx: 5,  dy: 1 },
  'F#m': { dx: 5,  dy: 2 },

function buildTrainRing(ringName, names, rInner, rOuter, baseColor){
  for(let i=0;i<12;i++){
    const startA = i*30 - 15 + WEDGE_GAP_ANGLE;
    const endA = i*30 + 15 - WEDGE_GAP_ANGLE;
    const path = el('path', {
      d: segmentPath(rInner + WEDGE_GAP_RADIAL, rOuter - WEDGE_GAP_RADIAL, startA, endA),
      fill: baseColor,
      stroke: 'none',
      class: 'wedge',
      'data-ring': ringName,
      'data-index': i
    });
    path.addEventListener('click', onTrainWedgeClick);
    trainSvg.appendChild(path);

    const mid = polar(CX, CY, (rInner+rOuter)/2, i*30);
    const label = el('text', {
      x: mid.x, y: mid.y,
      class: 'selLabel',
      fill: 'var(--app-text-color)'
    });
    label.textContent = names[i];
    label.style.pointerEvents = 'none';
    trainSvg.appendChild(label);

    // Буквы аккорда (напр. "C E G") — показываются чуть ниже названия
    // ноты, ближе к внешнему краю ячейки; включаются/выключаются чекбоксом
    // "Показывать буквы аккорда под нотами". Текст рисуется вдоль
    // невидимой дуги (textPath), повторяющей кривизну нижней части
    // ячейки, и не пересекает её боковые границы (см. CHORD_LETTERS_ARC_*).
    const chordLettersOffset = (rOuter - rInner) / 2 * CHORD_LETTERS_RADIUS_OFFSET_RATIO;
    const chordLettersRadius = (rInner+rOuter)/2 - chordLettersOffset;
    const chordArcId = 'chordArc-' + ringName + '-' + i;
    const chordArcPath = el('path', {
      id: chordArcId,
      d: chordLettersArcD(chordLettersRadius, i*30),
      fill: 'none',
      stroke: 'none'
    });
    trainSvg.appendChild(chordArcPath);
    const chordLettersEl = el('text', {
      class: 'trainChordLetters'
    });
    const chordLettersTextPath = el('textPath', {
      'href': '#' + chordArcId,
      startOffset: '50%'
    });
    chordLettersEl.appendChild(chordLettersTextPath);
    chordLettersEl.style.pointerEvents = 'none';
    chordLettersEl.style.display = 'none';
    trainSvg.appendChild(chordLettersEl);
    const chordArcLength = chordArcPath.getTotalLength();

    // Ступень аккорда в тональности (римская цифра, напр. "IV") — показывается
    // в правом верхнем углу ячейки, только для диатонических аккордов
    // нажатой тоники; включается/выключается тем же чекбоксом.
    const romanPos = polar(CX, CY, rOuter - ROMAN_LABEL_RADIAL_INSET, i*30 + ROMAN_LABEL_ANGLE_INSET);
    const romanManualOffset = ROMAN_LABEL_MANUAL_OFFSETS[names[i]] || { dx: 0, dy: 0 };
    const romanEl = el('text', {
      x: romanPos.x + romanManualOffset.dx, y: romanPos.y - romanManualOffset.dy,
      class: 'trainRomanLabel'
    });
    trainSvg.appendChild(romanEl);

    trainWedgeMap[ringName+'-'+i] = { el: path, baseColor, name: names[i], label, chordLettersEl, chordLettersTextPath, chordArcLength, romanEl };
  }
}

buildTrainRing('minor', minors, R0, R2, getComputedStyle(document.documentElement).getPropertyValue('--ring-minor').trim());
buildTrainRing('major', majors, R2, R3, getComputedStyle(document.documentElement).getPropertyValue('--ring-major').trim());

/* =========================================================
   Буквы нот аккорда под каждой тоникой + ступени аккорда в углу
   =========================================================
   Не зависит от существующей "стрелочной" логики выше — считает состав
   аккорда напрямую в полутонах от тоники и записывает буквами (с учётом
   диезов/бемолей), как в обычной теории музыки. */
const LETTERS7 = ['C','D','E','F','G','A','B'];
const NATURAL_PC = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
// для интервала (в полутонах, 0..11) — на сколько буквенных шагов (0..6)
// отстоит нота от тоники; для 14/17/21 (девятая/ундецима/тердецима)
// берётся тот же шаг, что и у соответствующей ступени внутри октавы.
const LETTER_STEP_BY_SEMITONE = {0:0,1:1,2:1,3:2,4:2,5:3,6:4,7:4,8:5,9:5,10:6,11:6};

function parseTrainNoteName(raw){
  const name = raw.endsWith('m') ? raw.slice(0,-1) : raw;
  const letter = name[0];
  let offset = 0;
  for(const c of name.slice(1)){ if(c==='#') offset++; else if(c==='b') offset--; }
  const pc = ((NATURAL_PC[letter] + offset) % 12 + 12) % 12;
  return {letter, pc};
}

// Возвращает букву+знак альтерации ноты, отстоящей от rootRaw на interval
// полутонов (interval может быть >11, напр. 14 = нона).
function spellTrainInterval(rootRaw, interval){
  const root = parseTrainNoteName(rootRaw);
  const mod = ((interval % 12) + 12) % 12;
  const steps = LETTER_STEP_BY_SEMITONE[mod];
  const rootLetterIdx = LETTERS7.indexOf(root.letter);
  const letter = LETTERS7[(rootLetterIdx + steps) % 7];
  const targetPc = ((root.pc + interval) % 12 + 12) % 12;
  let diff = ((targetPc - NATURAL_PC[letter]) % 12 + 12) % 12;
  if(diff > 6) diff -= 12;
  let acc = '';
  if(diff > 0) acc = '#'.repeat(diff);
  else if(diff < 0) acc = 'b'.repeat(-diff);
  return letter + acc;
}

// Формулы аккордов в полутонах от тоники (0 = тоника).
const TRAIN_CHORD_FORMULAS = {
  triadMajor:[0,4,7], triadMinor:[0,3,7],
  sus2:[0,2,7], sus4:[0,5,7],
  dom7:[0,4,7,10], maj7:[0,4,7,11], min7:[0,3,7,10], mmaj7:[0,3,7,11],
  add9:[0,4,7,14], madd9:[0,3,7,14],
  dom9:[0,4,7,10,14], maj9:[0,4,7,11,14], m9:[0,3,7,10,14], mmaj9:[0,3,7,11,14],
  add11:[0,4,7,17], madd11:[0,3,7,17],
  dom11:[0,4,7,10,14,17], maj11:[0,4,7,11,14,17], m11:[0,3,7,10,14,17],
  dom13:[0,4,7,10,14,17,21], maj13:[0,4,7,11,14,17,21], m13:[0,3,7,10,14,17,21], mmaj13:[0,3,7,11,14,17,21]
};

function trainChordFormula(chordType, ring){
  if(chordType === 'triad') return ring === 'major' ? TRAIN_CHORD_FORMULAS.triadMajor : TRAIN_CHORD_FORMULAS.triadMinor;
  return TRAIN_CHORD_FORMULAS[chordType] || TRAIN_CHORD_FORMULAS.triadMajor;
}

function trainChordLettersFor(noteRaw, ring, chordType){
  return trainChordFormula(chordType, ring).map(iv => spellTrainInterval(noteRaw, iv));
}

// Размер шрифта букв аккорда в зависимости от количества нот в нём —
// чем длиннее аккорд (9/11/13-е), тем мельче буквы, чтобы больше
// поместилось на дуге ячейки, не вылезая за её пределы.
const CHORD_LETTERS_FONT_SIZE_BY_COUNT = {
  3: 9, 4: 8.5, 5: 7.5, 6: 6.8, 7: 6.2, default: 9
};

// --- Настройка "Показывать буквы аккорда под нотами" ---
const TRAIN_SHOW_CHORD_LETTERS_KEY = 'circleTrainShowChordLetters';
let trainShowChordLetters = localStorage.getItem(TRAIN_SHOW_CHORD_LETTERS_KEY) === '1';

function refreshTrainChordLetters(){
  Object.keys(trainWedgeMap).forEach(key=>{
    const item = trainWedgeMap[key];
    const ring = key.split('-')[0];
    if(!item.chordLettersEl || !item.chordLettersTextPath) return;
    if(trainShowChordLetters){
      const letters = trainChordLettersFor(item.name, ring, trainChordType);
      item.chordLettersTextPath.textContent = letters.join(' ');
      item.chordLettersEl.style.fontSize = (CHORD_LETTERS_FONT_SIZE_BY_COUNT[letters.length] || CHORD_LETTERS_FONT_SIZE_BY_COUNT.default) + 'px';
      item.chordLettersEl.style.display = '';
      // Если естественная длина текста больше доступной дуги (напр. для
      // 9/11/13-аккордов с двойными диезами/бемолями) — сжимаем текст по
      // ширине дуги, чтобы буквы не заезжали в соседнюю ячейку.
      // Всегда растягиваем/сжимаем текст до одной и той же ширины дуги
      // (а не только когда он "случайно" не помещается) — иначе при
      // смене тоники в пределах одного типа аккорда буквы визуально
      // меняют размер из-за разной длины конкретного написания
      // (диезы/бемоли/дубль-знаки занимают разную ширину).
      const maxLength = item.chordArcLength * 0.96;
      item.chordLettersTextPath.setAttribute('textLength', maxLength);
      item.chordLettersTextPath.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    } else {
      item.chordLettersEl.style.display = 'none';
    }
  });
}

const trainShowChordLettersCheckbox = document.getElementById('trainShowChordLettersCheckbox');
trainShowChordLettersCheckbox.checked = trainShowChordLetters;
trainShowChordLettersCheckbox.addEventListener('change', ()=>{
  trainShowChordLetters = trainShowChordLettersCheckbox.checked;
  localStorage.setItem(TRAIN_SHOW_CHORD_LETTERS_KEY, trainShowChordLetters ? '1' : '0');
  refreshTrainChordLetters();
});

/* --- Ступени диатонических аккордов тональности (римские цифры) в правом
   верхнем углу каждой ячейки --- */
const TRAIN_SHOW_DEGREES_KEY = 'circleTrainShowDegrees';
let trainShowDegrees = localStorage.getItem(TRAIN_SHOW_DEGREES_KEY) === '1';

// Соответствие "полутоновый класс высоты" -> индекс ячейки в кольце.
const semitoneToTrainRingIndex = { major: {}, minor: {} };
majors.forEach((n,i)=>{ semitoneToTrainRingIndex.major[parseTrainNoteName(n).pc] = i; });
minors.forEach((n,i)=>{ semitoneToTrainRingIndex.minor[parseTrainNoteName(n).pc] = i; });

// Диатонические ступени мажорной тональности: смещение в полутонах от
// тоники, римская цифра, качество аккорда (кольцо-мишень). vii° (дим.)
// намеренно не учитывается.
const MAJOR_KEY_ROMAN_DEGREES = [
  { semitone:0,  roman:'I',   quality:'major' },
  { semitone:2,  roman:'ii',  quality:'minor' },
  { semitone:4,  roman:'iii', quality:'minor' },
  { semitone:5,  roman:'IV',  quality:'major' },
  { semitone:7,  roman:'V',   quality:'major' },
  { semitone:9,  roman:'vi',  quality:'minor' }
];

// Диатонические ступени натуральной минорной тональности. ii° (дим.)
// намеренно не учитывается.
const MINOR_KEY_ROMAN_DEGREES = [
  { semitone:0,  roman:'i',   quality:'minor' },
  { semitone:3,  roman:'III', quality:'major' },
  { semitone:5,  roman:'iv',  quality:'minor' },
  { semitone:7,  roman:'v',   quality:'minor' },
  { semitone:8,  roman:'VI',  quality:'major' },
  { semitone:10, roman:'VII', quality:'major' }
];

function clearTrainRomanLabels(){
  Object.values(trainWedgeMap).forEach(item=>{
    item.romanEl.textContent = '';
    item.romanEl.style.display = 'none';
  });
}

function updateTrainDegreeLabels(ring, tonicIndex){
  clearTrainRomanLabels();
  if(!trainShowDegrees || ring === null || tonicIndex === null) return;
  const item = trainWedgeMap[ring+'-'+tonicIndex];
  if(!item) return;
  const tonicPc = parseTrainNoteName(item.name).pc;
  const degrees = ring === 'major' ? MAJOR_KEY_ROMAN_DEGREES : MINOR_KEY_ROMAN_DEGREES;
  degrees.forEach(deg=>{
    const targetPc = (tonicPc + deg.semitone) % 12;
    const targetRing = deg.quality === 'major' ? 'major' : 'minor';
    const targetIndex = semitoneToTrainRingIndex[targetRing][targetPc];
    const targetItem = trainWedgeMap[targetRing+'-'+targetIndex];
    if(!targetItem) return;
    targetItem.romanEl.textContent = deg.roman;
    targetItem.romanEl.style.display = 'inline';
  });
}

const trainShowDegreesCheckbox = document.getElementById('trainShowDegreesCheckbox');
trainShowDegreesCheckbox.checked = trainShowDegrees;
trainShowDegreesCheckbox.addEventListener('change', ()=>{

  localStorage.setItem(TRAIN_SHOW_DEGREES_KEY, trainShowDegrees ? '1' : '0');
  if(trainShowDegrees && pressedTrainTonicRing !== null){
    updateTrainDegreeLabels(pressedTrainTonicRing, pressedTrainTonicIndex);
  } else {

  }
});

/* =========================================================
   Стрелки-подсказка на круге обучения (вариант "Мажор 1"):
   показывают из каких нот строится мажорное трезвучие выбранной
   тоники.

   Геометрия (все расстояния — от центра круга CX,CY):
   - R3 — радиус верхнего края ячеек мажорного кольца ("край круга").
   - У тоники берётся верхняя дуга её ячейки (от startAngle до
     endAngle) и делится на 3 равные части: 1-я точка деления —
     начало стрелки к квинте, 2-я точка — начало стрелки к терции.
   - От каждой точки вверх (по радиусу) рисуется прямая "стойка"
     длиной stubLength: от R3 до R3+stubLength.
   - У ноты-цели (квинта/терция) берётся середина верхней дуги её
     ячейки (т.к. стрелка в неё одна — делить пополам не нужно,
     это и есть середина) и от неё тоже рисуется стойка такой же
     длины, перпендикулярно дуге (то есть тоже строго по радиусу).
   - Стойки соединяются дугой на радиусе R3+stubLength, с
     наконечником стрелки на конце (у ноты-цели).
   - Для терции используется больший stubLength, чтобы стрелки не
     пересекались.
   ========================================================= */
const TRAIN_ARROW_CONFIG = {
  strokeWidth: 3,          // толщина линий (стойки и дуги)
  arrowHeadSize: 7         // размер наконечника стрелки
};

/* ===== Именованные точки начала стрелок =====
   Верхняя дуга тоники делится на равные части, здесь — на 3 (получаются
   2 точки деления). Каждая точка задаётся как доля (0..1) пути от начала
   до конца дуги тоники. Чтобы добавить ещё точки (например, для септимы
   в C7), просто добавьте новую запись сюда с нужной долей. */
const TRIAD_START_POINTS = {
  pointA: 1/4,   // первая точка деления дуги тоники (ближе к началу)
  pointC: 2/4,   // третья точка (середина дуги) — для 4-нотных аккордов (септаккорды)
  pointB: 3/4,   // вторая точка деления дуги тоники (ближе к концу)
  // extP1..extP6 — доп. точки для расширенных аккордов (9/11/13 и их
  // разновидности), у которых может быть до 6 не-тонических нот сразу
  // (квинта, терция, септима, нона, ундецима, тердецима)
  extP1: 1/7,
  extP2: 2/7,
  extP3: 3/7,
  extP4: 4/7,
  extP5: 5/7,
  extP6: 6/7
};

/* ===== Конфигурация Варианта 1 (числового) для трезвучия =====
   Прямое смещение от тоники по кругу квинт, на ТОМ ЖЕ кольце (мажор
   остаётся на мажорном, минор — на минорном). Это буквально формула
   "0, +1, +4" (мажор) / "0, +1, -3" (минор) из сводной таблицы.
   Каждая запись описывает одну стрелку:
   - startPoint   — имя точки из TRIAD_START_POINTS, откуда начинается стрелка
   - degreeSteps  — смещение по кругу квинт от тоники (в шагах по 30°) до ноты-цели
   - stubLength   — длина стойки и высота дуги
   - color        — цвет стрелки (можно указать любой CSS-цвет или var(--...))
   Примечание про минор: прямое смещение -3 на минорном кольце попадает
   на ячейку с суффиксом "m" (например, для Am это будет "Cm"), хотя
   нужная нота — просто "C". Это осознанный компромисс Варианта 1: он
   учит считать шаги по одному и тому же кольцу, а суффикс "m" в подписи
   нужно просто игнорировать. Вариант 2 (ниже) даёт корректную подпись
   без суффикса — через переход на родственное мажорное кольцо. */
const TRIAD_V1 = {
  major: {
    fifth: { startPoint: 'pointB', degreeSteps: 1,  stubLength: 40, color: 'var(--blue)' },
    third: { startPoint: 'pointA', degreeSteps: 4,  stubLength: 70, color: 'var(--yellow)' }
  },
  minor: {
    fifth: { startPoint: 'pointB', degreeSteps: 1,  stubLength: 40, color: 'var(--blue)' },
    third: { startPoint: 'pointA', degreeSteps: -3, stubLength: 70, color: 'var(--yellow)' }
  }
};
// сохранено для обратной совместимости (используется в buildTrainArrowDefs
// для регистрации маркеров-наконечников по ключам "fifth"/"third" — те же
// ключи что и в TRIAD_V1.minor, поэтому одного набора достаточно)
const TRIAD_ARROWS = TRIAD_V1.major;

/* ===== Стрелка "через центр" (для минорного Варианта 1) =====
   Если целевая ячейка НЕ соседняя с тоникой на круге квинт (расстояние
   больше 1 шага в обе стороны), прямая линия между подписями выглядит
   некрасиво/непонятно — вместо неё рисуется дуга, уходящая внутрь, почти
   до центра круга, по тому же принципу, что и обычные стрелки мажора
   (drawTrainArrow: стойка → дуга → стойка, единый path с одним
   наконечником) — просто с другим радиусом и в другую сторону (внутрь,
   а не наружу).

   Как редактировать:
   - MINOR_CENTER_ARROW_RBASE — радиус, от которого начинаются "стойки"
     (сейчас R1 — внутренний край минорного кольца, т.е. стрелка стартует
     от подписи ноты).
   - MINOR_CENTER_ARROW_STUB — длина стойки; ОТРИЦАТЕЛЬНОЕ число, поэтому
     дуга уходит внутрь. Чем больше по модулю (например, -90 вместо -70),
     тем ближе дуга проходит к самому центру круга. */
const MINOR_CENTER_ARROW_RBASE = R1;
const MINOR_CENTER_ARROW_STUB = 150;

/* ===== SUS-аккорды: конфигурация =====
   Sus-аккорды (sus2, sus4) не имеют мажорного/минорного наклонения —
   поэтому смещения задаются напрямую по кругу квинт от тоники (в шагах
   по 30°, как и degreeSteps выше), а отображаются всегда на мажорном
   кольце подписей (там хранятся "чистые" имена нот без суффиксов).

   ВАРИАНТ 1 (числовой): SUS2 = 0, +1, +2   |   SUS4 = 0, −1, +1
   ВАРИАНТ 2 (буквенный): те же смещения, просто прочитанные как шаги
   по соседним нотам круга квинт. */
const SUS_CONFIGS = {
  sus2: {
    arrows: {
      fifth:  { startPoint:'pointB', degreeSteps: 1, stubLength:40, color:'var(--blue)' },
      // в мажоре секунда — не сосед тоники (+2), поэтому рисуется цепочкой
      // через квинту (напр. C -> G -> D), см. buildNeighborSusArrows.
      // В миноре вместо этого используется соседняя ячейка с другой
      // стороны круга (напр. Am -> Dm), см. minorDegreeSteps.
      second: { startPoint:'pointA', degreeSteps: 2, minorDegreeSteps: -1, stubLength:70, color:'var(--yellow)' }
    }
    // highlights (цвета для "Вариант 2") добавляются ниже, после объявления
    // resolveColor()/NAMED_COLORS — см. SUS_CONFIGS.sus2.highlights
  },
  sus4: {
    arrows: {
      fifth:  { startPoint:'pointB', degreeSteps: 1,  stubLength:40, color:'var(--blue)' },
      fourth: { startPoint:'pointA', degreeSteps: -1, stubLength:70, color:'var(--yellow)' }
    }
  },
  // ===== Септаккорды (7, maj7, m7, mMaj7) — числовые смещения по кругу
  // квинт от тоники (Вариант 1). Вариант 2 (буквенная цепочка через
  // соседей/родственный мажор-минор) задаётся ниже через highlights.
  dom7: {
    arrows: {
      fifth:   { startPoint:'pointA', degreeSteps: 1,  stubLength:40,  color:'var(--blue)' },
      third:   { startPoint:'pointC', degreeSteps: 4,  stubLength:70,  color:'var(--yellow)' },
      seventh: { startPoint:'pointB', degreeSteps: -2, stubLength:100, color:'var(--purple)' }
    }
  },
  maj7: {
    arrows: {
      fifth:   { startPoint:'pointA', degreeSteps: 1, stubLength:40,  color:'var(--blue)' },
      third:   { startPoint:'pointC', degreeSteps: 4, stubLength:70,  color:'var(--yellow)' },
      seventh: { startPoint:'pointB', degreeSteps: 5, stubLength:100, color:'var(--purple)' }
    }
  },
  min7: {
    arrows: {
      fifth:   { startPoint:'pointA', degreeSteps: 1,  stubLength:40,  color:'var(--blue)' },
      third:   { startPoint:'pointC', degreeSteps: -3, stubLength:70,  color:'var(--yellow)' },
      seventh: { startPoint:'pointB', degreeSteps: -2, stubLength:100, color:'var(--purple)' }
    }
  },
  mmaj7: {
    arrows: {
      fifth:   { startPoint:'pointA', degreeSteps: 1,  stubLength:40,  color:'var(--blue)' },
      third:   { startPoint:'pointC', degreeSteps: -3, stubLength:70,  color:'var(--yellow)' },
      seventh: { startPoint:'pointB', degreeSteps: 5,  stubLength:100, color:'var(--purple)' }
    }
  },
  // ===== add9 / m(add9) — трезвучие + нона (числовые смещения по кругу
  // квинт от тоники, Вариант 1). Нона всегда попадает в ту же ячейку
  // круга, что и секунда у sus2 (+2), просто трактуется как 9-я ступень.
  add9: {
    arrows: {
      fifth: { startPoint:'pointA', degreeSteps: 1, stubLength:40,  color:'var(--blue)' },
      third: { startPoint:'pointC', degreeSteps: 4, stubLength:70,  color:'var(--yellow)' },
      ninth: { startPoint:'pointB', degreeSteps: 2, stubLength:100, color:'var(--cyan)' }
    }
  },

      third: { startPoint:'pointC', degreeSteps: -3, stubLength:70,  color:'var(--yellow)' },

    }
