<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Circle of Fifths Trainer</title>
<style>
  :root{
    --bg:#1a1a1a;
    --shadow:#303030;
    --text:#8e8e8e;

    /* цвета круга — взяты с серых сегментов картинки (область D / Bm / C#°) */
    --ring-major:#373737;   /* внешнее кольцо (мажор), как у "D" */
    --ring-minor:#373737;   /* среднее кольцо (минор), как у "Bm" */
    --ring-dim:#373737;     /* внутреннее кольцо (уменьш.), как у "C#°" */
    --ring-major-hover:#474747;
    --ring-minor-hover:#3c3c3c;
    --ring-dim-hover:#333333;

    --green:#b3ffb3;
    --red:#ffcccc;
    --green-flash:rgba(179,255,179,0.5);
    --red-flash:rgba(255,204,204,0.5);
  }
  html,body{
    margin:0;padding:0;background:var(--bg);
    height:100%;
    width:100%;
    overflow:auto;
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
  }
  #app{
    display:flex;flex-direction:column;align-items:safe center;justify-content:safe center;gap:18px;
    padding:20px;
    box-sizing:border-box;
    min-height:100vh;
    width:100vw;
  }
  #score{
    font-size:16px;
    color:var(--text);
  }
  .wedge{
    cursor:pointer;
    transition:fill 0.05s ease;
  }
  #centerCircle{
    fill:var(--bg);
  }
  #centerNote{
    font-weight:bold;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
    user-select:none;
  }
  #ringSelect{
    display:flex;
    gap:8px;
  }
  .ringBtn{
    background:#2a2a2a;
    color:#9a9a9a;
    border:none;
    border-radius:8px;
    padding:10px 0;
    width:100%;
    font-size:14px;
    cursor:pointer;
    opacity:1;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ringBtn.active{
    background:#5a5a5a;
    color:#f0f0f0;
  }
  .ringBtn:hover{
    background:#3a3a3a;
  }
  .ringBtn.active:hover{
    background:#666;
  }
  #circleWrap{
    overflow:visible;
    flex:1 1 auto;
    width:100%;
    display:flex;
    align-items:safe center;
    justify-content:safe center;
  }
  #menuOverlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:transparent;
    align-items:center;
    justify-content:flex-end;
    padding-right:440px;
    box-sizing:border-box;
    z-index:100;
  }
  #menuOverlay.open{
    display:flex;
  }
  #menuPanel{
    background:#181818;
    border:1px solid #333;
    border-radius:12px;
    padding:20px 22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    min-width:260px;
    box-shadow:0 4px 20px rgba(0,0,0,0.6);
  }
  .ringBtn[data-ring="dim"]{
    grid-column:1 / -1;
  }
</style>
</head>
<body>
<div id="app">
  <div id="circleWrap">
    <svg id="circle" width="480" height="480" viewBox="0 0 480 480"></svg>
  </div>
</div>

<div id="menuOverlay">
  <div id="menuPanel">
    <button class="ringBtn active" data-ring="major">Мажор</button>
    <button class="ringBtn active" data-ring="minor">Минор</button>
    <button class="ringBtn active" data-ring="dim">Dim</button>
  </div>
</div>

<script>
/* =========================================================
   НАСТРОЙКИ ноты в центре круга (размер / цвет / шрифт)
   Меняйте значения в этом объекте CENTER_NOTE_CONFIG
   ========================================================= */
const CENTER_NOTE_CONFIG = {
  fontSize: 34,        // размер шрифта ноты в центре
  color: "#8E8E8E",    // цвет текста ноты в центре
  fontFamily: "Arial, Helvetica, sans-serif"
};
/* ========================================================= */

const CX = 240, CY = 240;

// радиусы колец: [innerHole, dimOuter, minorOuter, majorOuter]
const R0 = 55;   // пустой центр
const R1 = 95;   // внешний радиус кольца "уменьшённые" (толщина как у бывшего мажора)
const R2 = 160;  // внешний радиус кольца "минор" (толщина не меняется)
const R3 = 235;  // внешний радиус кольца "мажор" (толщина как у бывшего dim)

// зазор между ячейками (px по радиусу, deg по углу), чтобы был виден фон
const WEDGE_GAP_RADIAL = 1;   // отступ от верхней/нижней границы кольца, px
const WEDGE_GAP_ANGLE  = 0.5; // отступ от боковых границ сегмента, deg

const majors = ['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const minors = ['Am','Em','Bm','F#m','C#m','G#m','D#m','Bbm','Fm','Cm','Gm','Dm'];
const dims   = ['B°','F#°','C#°','G#°','D#°','A#°','F°','C°','G°','D°','A°','E°'];

// все элементы для викторины: {name, ring, index}
const allChords = [];
majors.forEach((n,i)=>allChords.push({name:n, ring:'major', index:i}));
minors.forEach((n,i)=>allChords.push({name:n, ring:'minor', index:i}));
dims.forEach((n,i)=>allChords.push({name:n, ring:'dim', index:i}));

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

// путь "бублик"-сегмента между двумя радиусами и двумя углами
function segmentPath(rInner, rOuter, startAngle, endAngle){
  const p1 = polar(CX, CY, rOuter, startAngle);
  const p2 = polar(CX, CY, rOuter, endAngle);
  const p3 = polar(CX, CY, rInner, endAngle);
  const p4 = polar(CX, CY, rInner, startAngle);
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return `M ${p1.x} ${p1.y}
          A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y}
          L ${p3.x} ${p3.y}
          A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x} ${p4.y}
          Z`;
}

const svg = document.getElementById('circle');
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const wedgeMap = {}; // key "ring-index" -> svg path element

function buildRing(ringName, rInner, rOuter, baseColor){
  for(let i=0;i<12;i++){
    const startA = i*30 - 15 + WEDGE_GAP_ANGLE;
    const endA = i*30 + 15 - WEDGE_GAP_ANGLE;
    const path = el('path', {
      d: segmentPath(rInner + WEDGE_GAP_RADIAL, rOuter - WEDGE_GAP_RADIAL, startA, endA),
      fill: baseColor,
      stroke: 'none',
      class: 'wedge',
      'data-ring': ringName,
      'data-index': i
    });
    path.addEventListener('click', onWedgeClick);
    svg.appendChild(path);
    wedgeMap[ringName+'-'+i] = { el: path, baseColor };
  }
}

buildRing('dim',   R0, R1, getComputedStyle(document.documentElement).getPropertyValue('--ring-dim').trim());
buildRing('minor', R1, R2, getComputedStyle(document.documentElement).getPropertyValue('--ring-minor').trim());
buildRing('major', R1<R2?R2:R2, R3, getComputedStyle(document.documentElement).getPropertyValue('--ring-major').trim());

// центральный круг + текст ноты
svg.appendChild(el('circle', {cx:CX, cy:CY, r:R0-2, id:'centerCircle'}));
const centerText = el('text', {
  x:CX, y:CY, id:'centerNote',
  'font-size': CENTER_NOTE_CONFIG.fontSize,
  fill: CENTER_NOTE_CONFIG.color,
  'font-family': CENTER_NOTE_CONFIG.fontFamily
});
svg.appendChild(centerText);

let current = null;
const enabledRings = { major:true, minor:true, dim:true };

function activeChords(){
  return allChords.filter(c=>enabledRings[c.ring]);
}

function pickNewChord(){
  const pool = activeChords();
  current = pool[Math.floor(Math.random()*pool.length)];
  centerText.textContent = current.name;
}

const FLASH_GREEN = getComputedStyle(document.documentElement).getPropertyValue('--green-flash').trim();
const FLASH_RED = getComputedStyle(document.documentElement).getPropertyValue('--red-flash').trim();

function flashWedge(ringName, index, color, duration){
  const item = wedgeMap[ringName+'-'+index];
  item.el.setAttribute('fill', color);
  setTimeout(()=>{
    item.el.setAttribute('fill', item.baseColor);
  }, duration);
}

function onWedgeClick(e){
  const ring = e.currentTarget.getAttribute('data-ring');
  const index = parseInt(e.currentTarget.getAttribute('data-index'));

  if(ring === current.ring && index === current.index){
    flashWedge(ring, index, FLASH_GREEN, 300);
  } else {
    flashWedge(ring, index, FLASH_RED, 300);
    flashWedge(current.ring, current.index, FLASH_GREEN, 300);
  }

  setTimeout(pickNewChord, 320);
}

document.querySelectorAll('.ringBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const ring = btn.getAttribute('data-ring');
    const activeCount = Object.values(enabledRings).filter(Boolean).length;
    // не даём выключить последнее активное кольцо
    if(enabledRings[ring] && activeCount === 1) return;
    enabledRings[ring] = !enabledRings[ring];
    btn.classList.toggle('active', enabledRings[ring]);
    pickNewChord();
  });
});

pickNewChord();

/* =========================================================
   Масштабирование круга: клавиши +/-, Shift+"-" сброс до 100%
   ========================================================= */
const ZOOM_MIN = 100;   // %
const ZOOM_MAX = 1000;  // %
const ZOOM_STEP = 10;   // %
const ZOOM_STORAGE_KEY = 'circleOfFifthsZoom';

let zoom = parseInt(localStorage.getItem(ZOOM_STORAGE_KEY), 10);
if(isNaN(zoom)) zoom = 100;

function applyZoom(){
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom));
  svg.style.transform = `scale(${zoom/100})`;
  svg.style.transformOrigin = 'center center';
  localStorage.setItem(ZOOM_STORAGE_KEY, zoom);
  requestAnimationFrame(()=>{
    const rect = document.getElementById('circleWrap').getBoundingClientRect();
    const targetTop = window.scrollY + rect.top - Math.max(0, (window.innerHeight - rect.height) / 2);
    const targetLeft = window.scrollX + rect.left - Math.max(0, (window.innerWidth - rect.width) / 2);
    window.scrollTo(targetLeft, targetTop);
  });
}

function zoomIn(){
  zoom += ZOOM_STEP;
  applyZoom();
}
function zoomOut(){
  zoom -= ZOOM_STEP;
  applyZoom();
}
function zoomReset(){
  zoom = 100;
  applyZoom();
}

/* =========================================================
   Меню колец: клавиша Y (или Н) — открыть/закрыть
   ========================================================= */
const menuOverlay = document.getElementById('menuOverlay');

function toggleMenu(){
  menuOverlay.classList.toggle('open');
}
function closeMenu(){
  menuOverlay.classList.remove('open');
}

menuOverlay.addEventListener('click', (e)=>{
  if(e.target === menuOverlay) closeMenu();
});

document.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  if(key === '+' || key === '='){
    zoomIn();
  } else if(key === '-' || key === '_'){
    if(e.shiftKey){
      zoomReset();
    } else {
      zoomOut();
    }
  } else if(key === 'y' || key === 'н'){
    toggleMenu();
  }
});

applyZoom();
</script>
</body>
</html>
